name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only by default, and every job keeps it except flate-diff, which raises
# pull-requests: write for itself alone to post its comment. Combined with
# persist-credentials: false on each checkout, a compromised action cannot reach the
# git token.
permissions:
  contents: read

jobs:
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install yamllint
        run: pip install yamllint

      # Whole repo, not just kubernetes/ and talos/: taskfile.yaml and .github/ were
      # never linted, and had been carrying errors unnoticed.
      - name: Lint YAML files
        run: |
          yamllint -c .yamllint.yaml .

  kubeconform:
    name: Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Versions come from .mise.toml so this job and `task validate` cannot validate
      # with different schemas.
      - name: Install tools
        run: |
          KUBECONFORM=$(grep -oP '(?<=^kubeconform = ")[^"]+' .mise.toml)
          YQ=$(grep -oP '(?<=^yq = ")[^"]+' .mise.toml)
          curl -sL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin
          curl -sL "https://github.com/mikefarah/yq/releases/download/v${YQ}/yq_linux_amd64" \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Validate Kubernetes manifests
        run: ./scripts/kubeconform.sh

  helm-values:
    name: Helm Values
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same source of versions as the job above, for the same reason.
      - name: Install tools
        run: |
          HELM=$(grep -oP '(?<=^helm = ")[^"]+' .mise.toml)
          YQ=$(grep -oP '(?<=^yq = ")[^"]+' .mise.toml)
          curl -sL "https://get.helm.sh/helm-v${HELM}-linux-amd64.tar.gz" \
            | tar xz -C /tmp --strip-components=1 linux-amd64/helm
          install -m 0755 /tmp/helm /usr/local/bin/helm
          curl -sL "https://github.com/mikefarah/yq/releases/download/v${YQ}/yq_linux_amd64" \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Check HelmRelease values against their charts
        run: ./scripts/helm-values-check.sh

  flate:
    name: Flate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: home-operations/flate/action@797c483c107913d3f7757b7d3e1f6bc9179fe43d # v0.6.0
        with:
          # The action exports FLATE_BASE from this input, defaulting to the default branch,
          # and a base makes `test` run in changed-only mode. Cleared on purpose: this job
          # validates the whole tree. Left at its default it also fails outright on a PR,
          # where a depth-1 checkout has no local `main` to resolve.
          base: ""

      # Renders the whole Flux tree offline — Kustomizations, postBuild substitution, and a
      # real `helm template` of every HelmRelease. The only check here that runs Helm at all:
      # kubeconform validates files against Kubernetes schemas and never sees what a chart
      # produces. Replaces flux-local, archived upstream in favour of this tool.
      #
      # No equivalent of flux-local's `sources: flux-system` and none needed: that option
      # existed because flux-local resolved every Kustomization path inside the local
      # checkout, so the gateway-api one pointing upstream looked like a missing directory.
      # flate fetches the source instead, and validates it like the others.
      - name: Render and validate every Kustomization and HelmRelease
        run: flate test all --path ./kubernetes --no-progress

  flate-diff:
    name: Flate Diff
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Deliberately absent from status-check below: this job only reports. A rendering error
    # is already a failure of the job above, and a merge should not hinge on whether a
    # comment could be posted.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The baseline is a git rev flate materializes itself, so the history has to be here.
          fetch-depth: 0

      - uses: home-operations/flate/action@797c483c107913d3f7757b7d3e1f6bc9179fe43d # v0.6.0
        with:
          # Cleared here too, and the baseline passed on the command line instead, so the
          # rev this job compares against is written where it is read.
          base: ""

      # `all` and not `hr`: it covers both the Flux objects a Kustomization produces and the
      # manifests the charts render, which is what makes a version bump readable — the point
      # is to see the Deployment that changes, not the tag that changed.
      - name: Render the diff against main
        run: |
          flate diff all --path ./kubernetes --base origin/main -o github --no-progress \
            > diff.md 2>diff.err || { cat diff.err; exit 1; }

      - name: Comment the diff on the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # A comment caps at 65536 characters, and a rejected comment would fail the job
          # over a formatting detail rather than over the cluster.
          LIMIT=60000
          {
            echo "### Flate — rendered diff against \`main\`"
            echo
            if [ ! -s diff.md ]; then
              echo "No change to any rendered manifest."
            else
              echo '```diff'
              head -c "$LIMIT" diff.md
              echo '```'
              if [ "$(wc -c < diff.md)" -gt "$LIMIT" ]; then
                echo
                echo "_Truncated — see the job log for the whole diff._"
              fi
            fi
          } > comment.md
          # Edited in place so a branch pushed ten times leaves one comment, not ten.
          gh pr comment "$PR" --body-file comment.md --edit-last --create-if-none

  renovate-validate:
    name: Renovate Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Renovate config
        run: |
          npx -y -p renovate -- renovate-config-validator .github/renovate.json

  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy
        # Pinned to v0.69.3 — last version before CVE-2026-33634 supply-chain
        # compromise on v0.69.4/v0.69.5/v0.69.6.
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.69.3

      - name: Scan manifests for misconfigurations
        run: |
          trivy config kubernetes/ \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-files '**/*.sops.yaml' \
            --ignorefile .trivyignore.yaml

      - name: Scan repo for leaked secrets
        run: |
          trivy fs kubernetes/ \
            --scanners secret \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-files '**/*.sops.yaml' \
            --ignorefile .trivyignore.yaml

      # Image scan is warn-only: upstream images are already pinned to latest
      # via Renovate, so blocking merges on CVEs we can't fix ourselves would
      # also block the very PRs bringing the fixes. Runtime coverage is
      # provided by trivy-operator; this step surfaces findings pre-deploy.
      - name: Scan container images from manifests (warn-only)
        run: |
          grep -rhE '^\s+image:\s+\S+' kubernetes/ \
            --include='*.yaml' --exclude='*.sops.yaml' \
            | awk '{print $2}' | tr -d '"' | sort -u > /tmp/images.txt
          echo "Images to scan:"
          cat /tmp/images.txt
          while IFS= read -r image; do
            [ -z "$image" ] && continue
            echo "::group::Scanning $image"
            trivy image "$image" \
              --severity HIGH,CRITICAL \
              --exit-code 0 \
              --ignore-unfixed \
              --no-progress \
              --ignorefile .trivyignore.yaml \
              || true
            echo "::endgroup::"
          done < /tmp/images.txt

  zizmor:
    name: Workflow Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # --offline skips the online audits, which need a token to query the GitHub API.
      # The ones that matter here — unpinned actions, excessive permissions — are static.
      - name: Audit workflows
        run: |
          pipx run zizmor==1.28.0 --format plain --offline .github/workflows/

  status-check:
    name: Status Check
    runs-on: ubuntu-latest
    needs: [yaml-lint, kubeconform, helm-values, flate, renovate-validate, trivy, zizmor]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.yaml-lint.result }}" == "failure" ]] || \
             [[ "${{ needs.kubeconform.result }}" == "failure" ]] || \
             [[ "${{ needs.helm-values.result }}" == "failure" ]] || \
             [[ "${{ needs.flate.result }}" == "failure" ]] || \
             [[ "${{ needs.renovate-validate.result }}" == "failure" ]] || \
             [[ "${{ needs.zizmor.result }}" == "failure" ]] || \
             [[ "${{ needs.trivy.result }}" == "failure" ]]; then
            echo "❌ One or more checks failed"
            exit 1
          fi
          echo "✅ All checks passed"
