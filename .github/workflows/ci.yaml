name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install yamllint
        run: pip install yamllint

      # Whole repo, not just kubernetes/ and talos/: taskfile.yaml and .github/ were
      # never linted, and had been carrying errors unnoticed.
      - name: Lint YAML files
        run: |
          yamllint -c .yamllint.yaml .

  kubeconform:
    name: Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Versions come from .mise.toml so this job and `task validate` cannot validate
      # with different schemas.
      - name: Install tools
        run: |
          KUBECONFORM=$(grep -oP '(?<=^kubeconform = ")[^"]+' .mise.toml)
          YQ=$(grep -oP '(?<=^yq = ")[^"]+' .mise.toml)
          curl -sL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin
          curl -sL "https://github.com/mikefarah/yq/releases/download/v${YQ}/yq_linux_amd64" \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Validate Kubernetes manifests
        run: ./scripts/kubeconform.sh

  renovate-validate:
    name: Renovate Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Renovate config
        run: |
          npx -y -p renovate -- renovate-config-validator .github/renovate.json

  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Trivy
        # Pinned to v0.69.3 — last version before CVE-2026-33634 supply-chain
        # compromise on v0.69.4/v0.69.5/v0.69.6.
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.69.3

      - name: Scan manifests for misconfigurations
        run: |
          trivy config kubernetes/ \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-files '**/*.sops.yaml' \
            --ignorefile .trivyignore.yaml

      - name: Scan repo for leaked secrets
        run: |
          trivy fs kubernetes/ \
            --scanners secret \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-files '**/*.sops.yaml' \
            --ignorefile .trivyignore.yaml

      # Image scan is warn-only: upstream images are already pinned to latest
      # via Renovate, so blocking merges on CVEs we can't fix ourselves would
      # also block the very PRs bringing the fixes. Runtime coverage is
      # provided by trivy-operator; this step surfaces findings pre-deploy.
      - name: Scan container images from manifests (warn-only)
        run: |
          grep -rhE '^\s+image:\s+\S+' kubernetes/ \
            --include='*.yaml' --exclude='*.sops.yaml' \
            | awk '{print $2}' | tr -d '"' | sort -u > /tmp/images.txt
          echo "Images to scan:"
          cat /tmp/images.txt
          while IFS= read -r image; do
            [ -z "$image" ] && continue
            echo "::group::Scanning $image"
            trivy image "$image" \
              --severity HIGH,CRITICAL \
              --exit-code 0 \
              --ignore-unfixed \
              --no-progress \
              --ignorefile .trivyignore.yaml \
              || true
            echo "::endgroup::"
          done < /tmp/images.txt

  status-check:
    name: Status Check
    runs-on: ubuntu-latest
    needs: [yaml-lint, kubeconform, renovate-validate, trivy]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.yaml-lint.result }}" == "failure" ]] || \
             [[ "${{ needs.kubeconform.result }}" == "failure" ]] || \
             [[ "${{ needs.renovate-validate.result }}" == "failure" ]] || \
             [[ "${{ needs.trivy.result }}" == "failure" ]]; then
            echo "❌ One or more checks failed"
            exit 1
          fi
          echo "✅ All checks passed"
