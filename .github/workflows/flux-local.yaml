name: Flux Local

on:
  pull_request:
    branches: [main]
    paths:
      - "kubernetes/**"
  push:
    branches: [main]
    paths:
      - "kubernetes/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: fluxcd/flux2/action@16602fa989daa99762f1c6d1186ae2ad1c735815 # v2.9.3

      - uses: allenporter/flux-local/action/test@92d3a538c009c3fec120fbf50f6ef33b3e0a569c # 8.4.0
        with:
          path: kubernetes/flux
          enable-helm: true
          # flux-local resolves every Kustomization path inside the local checkout, whatever
          # its sourceRef, so the gateway-api one — pointing at the upstream repo — looks
          # like a missing directory. Restricting to our own source excludes it while
          # keeping path validation strict everywhere else, which
          # skip-invalid-kustomization-paths would have disabled for the whole repo.
          sources: flux-system

  diff:
    name: Diff
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Only this job writes, and only to post the diff as a PR comment.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: fluxcd/flux2/action@16602fa989daa99762f1c6d1186ae2ad1c735815 # v2.9.3

      - uses: allenporter/flux-local/action/diff@92d3a538c009c3fec120fbf50f6ef33b3e0a569c # 8.4.0
        with:
          path: kubernetes/flux
          live-branch: main
          # Same reason as the test job above.
          sources: flux-system
