name: Images

on:
  push:
    branches: [main]
    paths:
      - images/mineru/**
      - .github/workflows/images.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mineru:
    name: MinerU
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag is the MinerU version the Dockerfile pins, so a Renovate bump there is
      # what publishes a new tag.
      - name: Read version
        id: version
        run: |
          echo "tag=$(grep -oP '(?<=^ARG MINERU_VERSION=)\S+' images/mineru/Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/mineru
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mineru:${{ steps.version.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
