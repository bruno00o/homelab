[tools]
# Must match talos/talconfig.yaml talosVersion
talosctl = "1.13.9"
# https://github.com/budimanjojo/talhelper
talhelper = "3.1.17"
# Should match talos/talconfig.yaml kubernetesVersion
kubectl = "1.36.4"
# https://github.com/fluxcd/flux2
flux2 = "2.9.4"
helm = "4.2.4"
# https://github.com/helmfile/helmfile
helmfile = "1.7.4"
sops = "3.13.3"
age = "1.3.1"
# mikefarah/yq — NOT kislyuk/yq (Python)
yq = "4.53.6"
jq = "1.8.2"
# Must match the version installed by .github/workflows/ci.yaml
kubeconform = "0.8.0"
# Renders the Flux tree offline; replaces the archived flux-local. Not in mise's registry,
# hence the ubi backend. Must match the version in .github/workflows/ci.yaml.
"ubi:home-operations/flate" = "0.6.0"
# Git hooks — run `task hooks:install` after installing
lefthook = "2.1.11"
