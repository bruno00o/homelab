---
repositories:
  - name: cilium
    url: https://helm.cilium.io/
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: controlplaneio
    url: ghcr.io/controlplaneio-fluxcd/charts
    oci: true

releases:
  # Must never lead the OCIRepository tag in kubernetes/flux/repositories.yaml. This chart
  # installs the CNI before Flux exists; Flux then adopts the release, so a version here
  # that is ahead makes a fresh bootstrap *downgrade* its own CNI on the first reconcile —
  # worse than an upgrade, since engine and datapath state do not go backwards cleanly.
  # That is what PR #377 left behind: it bumped this file to 1.20.0 on its own while the
  # OCIRepository stayed on 1.19.6, and nothing showed it because the cluster was already
  # bootstrapped. Bump the two together, this one last.
  - name: cilium
    namespace: kube-system
    chart: cilium/cilium
    version: 1.20.4
    values:
      - cilium-values.yaml
    wait: true
    timeout: 300

  - name: prometheus-operator-crds
    namespace: kube-system
    chart: prometheus-community/prometheus-operator-crds
    version: 32.0.2
    wait: true

  # Installs Flux from kubernetes/flux/flux-instance.yaml, so it has to exist first. Flux then
  # adopts the release. Same rule as cilium: never ahead of kubernetes/flux/repositories.yaml.
  - name: flux-operator
    namespace: flux-system
    chart: controlplaneio/flux-operator
    version: 0.62.1
    needs:
      - kube-system/cilium
    wait: true
    timeout: 300
