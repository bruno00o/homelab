apiVersion: v1
kind: ConfigMap
metadata:
  name: adguard-config
  namespace: adguard
data:
  AdGuardHome.yaml: |
    http:
      pprof:
        port: 6060
        enabled: false
      address: 0.0.0.0:80
      session_ttl: 720h
    users: []
    auth_attempts: 0
    block_auth_min: 0
    dns:
      bind_hosts:
        - 0.0.0.0
      port: 53
      ratelimit: 20
      refuse_any: true
      upstream_dns:
        - https://dns10.quad9.net/dns-query
        - https://dns.cloudflare.com/dns-query
      fallback_dns:
        - 9.9.9.10
        - 1.1.1.1
      bootstrap_dns:
        - 9.9.9.10
        - 149.112.112.10
        - 1.1.1.1
      cache_enabled: true
      cache_size: 4194304
      enable_dnssec: false
      hostsfile_enabled: true
    tls:
      enabled: false
    querylog:
      # This interval sizes the PVC: AdGuard keeps the current log plus one rotation,
      # so the volume must hold twice the interval's worth of queries. At 90d it was
      # heading for 5Gi of query log alone. A week is what the "why was this blocked"
      # lookup actually needs; the dashboard reads stats.db, not this.
      interval: 168h
      enabled: true
      file_enabled: true
    statistics:
      interval: 24h
      enabled: true
    filters:
      - enabled: true
        url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
        name: AdGuard DNS filter
        id: 1
    filtering:
      rewrites:
        - domain: 'qdrant.${CLUSTER_DOMAIN}'
          answer: ${LB_QDRANT}
          enabled: true
        - domain: 'dozerdb.${CLUSTER_DOMAIN}'
          answer: ${LB_DOZERDB}
          enabled: true
        - domain: 'valkey.${CLUSTER_DOMAIN}'
          answer: ${LB_VALKEY}
          enabled: true
        - domain: 'ntp.${CLUSTER_DOMAIN}'
          answer: ${LB_NTP}
          enabled: true
        - domain: '*.${CLUSTER_DOMAIN}'
          answer: ${LB_GATEWAY}
          enabled: true
        - domain: '*.${PUBLIC_DOMAIN}'
          answer: ${LB_GATEWAY}
          enabled: true
        # The two exceptions to the wildcard above: the SFU is the only host in
        # this zone that does not live in the cluster, so pointing it at the
        # gateway breaks calls from the LAN while they work from outside. An
        # exact rewrite wins over the wildcard.
        - domain: 'livekit.${PUBLIC_DOMAIN}'
          answer: ${LIVEKIT_VM_IP}
          enabled: true
        - domain: 'livekit-turn.${PUBLIC_DOMAIN}'
          answer: ${LIVEKIT_VM_IP}
          enabled: true
      filtering_enabled: true
      rewrites_enabled: true
      protection_enabled: true
    log:
      enabled: true
      verbose: false
    schema_version: 32
