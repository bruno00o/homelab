apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  homelab.yaml: |
    version: 1
    metadata:
      name: Homelab Configuration
    entries:
      # =====================================================
      # SECTION 1: GROUPS
      # =====================================================
      - model: authentik_core.group
        id: group-homelab-admins
        state: present
        identifiers:
          name: homelab-admins
        attrs:
          is_superuser: false

      - model: authentik_core.group
        id: group-homelab-users
        state: present
        identifiers:
          name: homelab-users
        attrs:
          is_superuser: false

      - model: authentik_core.group
        id: group-homelab-friends
        state: present
        identifiers:
          name: homelab-friends
        attrs:
          is_superuser: false

      # =====================================================
      # SECTION 2: PROVIDERS
      # =====================================================

      # Scope mapping exposing Authentik group names in the `groups`
      # claim so downstream OIDC apps (Homarr) can sync membership.
      - model: authentik_providers_oauth2.scopemapping
        id: scope-mapping-groups
        state: present
        identifiers:
          managed: goauthentik.io/providers/oauth2/scope-groups
        attrs:
          name: "authentik default OAuth Mapping: OpenID 'groups'"
          scope_name: groups
          description: "Groups the user is a member of"
          expression: |
            return {"groups": [group.name for group in request.user.ak_groups.all()]}

      # Proxy Providers (forward_single)
      - model: authentik_providers_proxy.proxyprovider
        id: provider-hubble
        state: present
        identifiers:
          name: Hubble Proxy
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://hubble.${CLUSTER_DOMAIN}
          internal_host: http://hubble-ui.kube-system.svc.cluster.local:80
          internal_host_ssl_validation: false

      - model: authentik_providers_proxy.proxyprovider
        id: provider-longhorn
        state: present
        identifiers:
          name: Longhorn Proxy
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://longhorn.${CLUSTER_DOMAIN}
          internal_host: http://longhorn-frontend.longhorn-system.svc.cluster.local:80
          internal_host_ssl_validation: false

      - model: authentik_providers_proxy.proxyprovider
        id: provider-adguard
        state: present
        identifiers:
          name: AdGuard Proxy
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://adguard.${CLUSTER_DOMAIN}
          internal_host: http://adguard-web.adguard.svc.cluster.local:80
          internal_host_ssl_validation: false

      - model: authentik_providers_oauth2.oauth2provider
        id: provider-homarr-oidc
        state: present
        identifiers:
          name: Homarr OIDC
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: homarr
          client_secret: !Env AUTHENTIK_HOMARR_CLIENT_SECRET
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            - matching_mode: strict
              url: https://homarr.${CLUSTER_DOMAIN}/api/auth/callback/oidc
            - matching_mode: strict
              url: https://homarr.${PUBLIC_DOMAIN}/api/auth/callback/oidc
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]

      # Matrix Authentication Service (MAS) — replaces the old direct
      # Synapse-as-OIDC-client setup. MAS is the OAuth2 client of Authentik;
      # Synapse delegates auth to MAS (msc3861). slug "mas" must match the
      # MAS upstream_oauth2 issuer: /application/o/mas/. redirect_uri stays
      # permissive (regex) for the first iteration; tighten once the exact
      # MAS upstream callback path is confirmed in the logs.
      - model: authentik_providers_oauth2.oauth2provider
        id: provider-mas-oidc
        state: present
        identifiers:
          name: MAS OIDC
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: mas
          client_secret: !Env AUTHENTIK_MAS_CLIENT_SECRET
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: regex
              url: https://mas\.${PUBLIC_DOMAIN}/.*
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

      # Dawarich. The slug of its application below must stay "dawarich": the app's
      # OIDC_ISSUER points at /application/o/dawarich/, and discovery fails on a mismatch.
      - model: authentik_providers_oauth2.oauth2provider
        id: provider-dawarich-oidc
        state: present
        identifiers:
          name: Dawarich OIDC
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: dawarich
          client_secret: !Env AUTHENTIK_DAWARICH_CLIENT_SECRET
          # user_uuid from the start, for the reason spelled out on the Home Assistant
          # provider above: hashed_user_id moves with the Authentik database and every
          # rotation hands the app a brand new user.
          sub_mode: user_uuid
          # Mandatory, and the omission is silent: a provider created by a blueprint gets
          # an EMPTY grant_types list, not the model defaults the older providers here
          # carry. Every authorize request is then refused with "invalid_request / the
          # request is otherwise malformed", which names neither the field nor the grant.
          grant_types:
            - authorization_code
            - refresh_token
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            - matching_mode: strict
              url: https://dawarich.${PUBLIC_DOMAIN}/users/auth/openid_connect/callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

      # Paperless-ngx. The slug of its application below must stay "paperless": the app's
      # discovery URL points at /application/o/paperless/.well-known/openid-configuration.
      - model: authentik_providers_oauth2.oauth2provider
        id: provider-paperless-oidc
        state: present
        identifiers:
          name: Paperless OIDC
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: paperless
          client_secret: !Env AUTHENTIK_PAPERLESS_CLIENT_SECRET
          sub_mode: user_uuid
          # Mandatory, and the omission is silent — see the Dawarich provider above.
          grant_types:
            - authorization_code
            - refresh_token
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          # Two, and both needed. django-allauth builds the callback from the host the
          # browser actually used, so signing in from the LAN sends the .home.arpa one and
          # strict matching would refuse it.
          redirect_uris:
            - matching_mode: strict
              url: https://paperless.${PUBLIC_DOMAIN}/accounts/oidc/authentik/login/callback/
            - matching_mode: strict
              url: https://paperless.${CLUSTER_DOMAIN}/accounts/oidc/authentik/login/callback/
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

      - model: authentik_providers_proxy.proxyprovider
        id: provider-frigate
        state: present
        identifiers:
          name: Frigate Proxy
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://frigate.${CLUSTER_DOMAIN}
          internal_host: http://frigate.home-automation.svc.cluster.local:5000
          internal_host_ssl_validation: false

      - model: authentik_providers_proxy.proxyprovider
        id: provider-zigbee2mqtt
        state: present
        identifiers:
          name: Zigbee2MQTT Proxy
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://zigbee2mqtt.${CLUSTER_DOMAIN}
          internal_host: http://zigbee2mqtt.home-automation.svc.cluster.local:8080
          internal_host_ssl_validation: false

      # RustFS native OIDC (replaces the old proxy provider). Backchannel reaches
      # Authentik via an in-pod TLS sidecar (bypasses Cilium LB hairpin).
      # redirect_uri is a permissive regex for the first iteration — tighten once
      # the exact RustFS console callback path is confirmed.
      - model: authentik_providers_oauth2.oauth2provider
        id: provider-rustfs-oidc
        state: present
        identifiers:
          name: RustFS OIDC
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: rustfs
          client_secret: !Env AUTHENTIK_RUSTFS_CLIENT_SECRET
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            - matching_mode: regex
              url: https://rustfs\.${CLUSTER_DOMAIN}/.*
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

      # Hermes' dashboard authenticates itself since v2026.7.30 — it refuses to bind
      # on anything but loopback without a provider of its own, so proxy mode is no
      # longer an option. Public client: its built-in OIDC client is PKCE-only and
      # holds no secret.
      - model: authentik_providers_oauth2.oauth2provider
        id: provider-hermes
        state: present
        identifiers:
          name: Hermes
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: public
          client_id: hermes-dashboard
          # Explicit: a provider created by blueprint gets an empty grant_types, not
          # the defaults the UI fills in, and every authorization is then rejected
          # with "Invalid grant_type for provider".
          grant_types:
            - authorization_code
            - refresh_token
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            - matching_mode: strict
              url: https://hermes.${CLUSTER_DOMAIN}/auth/callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

      # Cloudflare Access (OIDC)
      - model: authentik_providers_oauth2.oauth2provider
        id: provider-cloudflare-access
        state: present
        identifiers:
          name: Cloudflare Access
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: cloudflare-access
          client_secret: !Env AUTHENTIK_CLOUDFLARE_ACCESS_CLIENT_SECRET
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            - matching_mode: strict
              url: https://bruno00o.cloudflareaccess.com/cdn-cgi/access/callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

      # OAuth2 Providers (OIDC)
      - model: authentik_providers_oauth2.oauth2provider
        id: provider-home-assistant-oidc
        state: present
        identifiers:
          name: Home Assistant OIDC
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: home-assistant
          client_secret: !Env AUTHENTIK_HA_CLIENT_SECRET
          # Not the default hashed_user_id: that one is sha256(user.id + install_id), so it
          # changes with the Authentik database and every app then sees a brand new user.
          # It drifted four times here and left five admin accounts in Home Assistant.
          sub_mode: user_uuid
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            - matching_mode: strict
              url: https://home-assistant.${CLUSTER_DOMAIN}/auth/oidc/callback
            - matching_mode: strict
              url: https://home-assistant.${PUBLIC_DOMAIN}/auth/oidc/callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

      - model: authentik_providers_oauth2.oauth2provider
        id: provider-grafana-oidc
        state: present
        identifiers:
          name: Grafana OIDC
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: grafana
          client_secret: !Env AUTHENTIK_GRAFANA_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.${CLUSTER_DOMAIN}/login/generic_oauth
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

      - model: authentik_providers_oauth2.oauth2provider
        id: provider-immich-oidc
        state: present
        identifiers:
          name: Immich OIDC
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: immich
          client_secret: !Env AUTHENTIK_IMMICH_CLIENT_SECRET
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            - matching_mode: strict
              url: https://immich.${CLUSTER_DOMAIN}/auth/login
            - matching_mode: strict
              url: https://immich.${CLUSTER_DOMAIN}/user-settings
            - matching_mode: strict
              url: https://immich.${PUBLIC_DOMAIN}/auth/login
            - matching_mode: strict
              url: https://immich.${PUBLIC_DOMAIN}/user-settings
            - matching_mode: strict
              url: app.immich:///oauth-callback
            # The mobile app does not send the custom scheme above: Immich's own config has
            # mobileOverrideEnabled, so it hands out this HTTPS endpoint instead and bounces
            # to app.immich:/// itself once it holds the code. Without it registered here,
            # signing in from the phone answers Redirect URI Error and nothing else breaks -
            # the web login keeps working, which is what makes it look like an app problem.
            - matching_mode: strict
              url: https://immich.${PUBLIC_DOMAIN}/api/oauth/mobile-redirect
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

      # =====================================================
      # SECTION 3: APPLICATIONS
      # =====================================================

      # Policy: require-homelab-admins
      - model: authentik_policies_expression.expressionpolicy
        id: policy-require-admins
        state: present
        identifiers:
          name: require-homelab-admins
        attrs:
          expression: |
            return ak_is_group_member(request.user, name="homelab-admins")

      # Policy: require-homelab-users
      - model: authentik_policies_expression.expressionpolicy
        id: policy-require-users
        state: present
        identifiers:
          name: require-homelab-users
        attrs:
          expression: |
            return ak_is_group_member(request.user, name="homelab-admins") or ak_is_group_member(request.user, name="homelab-users")

      # Policy: require-homelab-friends (admins + users + friends — for Matrix)
      - model: authentik_policies_expression.expressionpolicy
        id: policy-require-friends
        state: present
        identifiers:
          name: require-homelab-friends
        attrs:
          expression: |
            return ak_is_group_member(request.user, name="homelab-admins") or ak_is_group_member(request.user, name="homelab-users") or ak_is_group_member(request.user, name="homelab-friends")

      # Hubble (admins only)
      - model: authentik_core.application
        id: app-hubble
        state: present
        identifiers:
          slug: hubble
        attrs:
          name: Hubble
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, Hubble Proxy]]
          meta_launch_url: https://hubble.${CLUSTER_DOMAIN}
          policy_engine_mode: all

      - model: authentik_policies.policybinding
        id: binding-hubble-admin
        state: present
        identifiers:
          order: 0
          target: !Find [authentik_core.application, [slug, hubble]]
          policy: !Find [authentik_policies_expression.expressionpolicy, [name, require-homelab-admins]]
        attrs:
          enabled: true
          negate: false
          timeout: 30

      # Longhorn (admins only)
      - model: authentik_core.application
        id: app-longhorn
        state: present
        identifiers:
          slug: longhorn
        attrs:
          name: Longhorn
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, Longhorn Proxy]]
          meta_launch_url: https://longhorn.${CLUSTER_DOMAIN}
          policy_engine_mode: all

      - model: authentik_policies.policybinding
        id: binding-longhorn-admin
        state: present
        identifiers:
          order: 0
          target: !Find [authentik_core.application, [slug, longhorn]]
          policy: !Find [authentik_policies_expression.expressionpolicy, [name, require-homelab-admins]]
        attrs:
          enabled: true
          negate: false
          timeout: 30

      # RustFS (admins only)
      - model: authentik_core.application
        id: app-rustfs
        state: present
        identifiers:
          slug: rustfs
        attrs:
          name: RustFS
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, RustFS OIDC]]
          meta_launch_url: https://rustfs.${CLUSTER_DOMAIN}
          policy_engine_mode: all

      - model: authentik_policies.policybinding
        id: binding-rustfs-admin
        state: present
        identifiers:
          order: 0
          target: !Find [authentik_core.application, [slug, rustfs]]
          policy: !Find [authentik_policies_expression.expressionpolicy, [name, require-homelab-admins]]
        attrs:
          enabled: true
          negate: false
          timeout: 30

      # AdGuard (admins only)
      - model: authentik_core.application
        id: app-adguard
        state: present
        identifiers:
          slug: adguard
        attrs:
          name: AdGuard Home
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, AdGuard Proxy]]
          meta_launch_url: https://adguard.${CLUSTER_DOMAIN}
          policy_engine_mode: all

      - model: authentik_policies.policybinding
        id: binding-adguard-admin
        state: present
        identifiers:
          order: 0
          target: !Find [authentik_core.application, [slug, adguard]]
          policy: !Find [authentik_policies_expression.expressionpolicy, [name, require-homelab-admins]]
        attrs:
          enabled: true
          negate: false
          timeout: 30

      # Homarr (all users, OIDC)
      - model: authentik_core.application
        id: app-homarr
        state: present
        identifiers:
          slug: homarr
        attrs:
          name: Homarr
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Homarr OIDC]]
          meta_launch_url: https://homarr.${PUBLIC_DOMAIN}
          policy_engine_mode: all

      - model: authentik_policies.policybinding
        id: binding-homarr-users
        state: present
        identifiers:
          order: 0
          target: !Find [authentik_core.application, [slug, homarr]]
          policy: !Find [authentik_policies_expression.expressionpolicy, [name, require-homelab-users]]
        attrs:
          enabled: true
          negate: false
          timeout: 30

      # Home Assistant (all users, OIDC)
      - model: authentik_core.application
        id: app-home-assistant
        state: present
        identifiers:
          slug: home-assistant
        attrs:
          name: Home Assistant
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Home Assistant OIDC]]
          meta_launch_url: https://home-assistant.${PUBLIC_DOMAIN}/auth/oidc/redirect
          policy_engine_mode: all

      - model: authentik_policies.policybinding
        id: binding-home-assistant-users
        state: present
        identifiers:
          order: 0
          target: !Find [authentik_core.application, [slug, home-assistant]]
          policy: !Find [authentik_policies_expression.expressionpolicy, [name, require-homelab-users]]
        attrs:
          enabled: true
          negate: false
          timeout: 30

          timeout: 30

      # Frigate (admins only)
      - model: authentik_core.application
        id: app-frigate
        state: present
        identifiers:
          slug: frigate
        attrs:
          name: Frigate
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, Frigate Proxy]]
          meta_launch_url: https://frigate.${CLUSTER_DOMAIN}
          policy_engine_mode: all

      - model: authentik_policies.policybinding
        id: binding-frigate-admin
        state: present
        identifiers:
          order: 0
          target: !Find [authentik_core.application, [slug, frigate]]
          policy: !Find [authentik_policies_expression.expressionpolicy, [name, require-homelab-admins]]
        attrs:
          enabled: true
          negate: false
          timeout: 30

      # Zigbee2MQTT (admins only)
      - model: authentik_core.application
        id: app-zigbee2mqtt
        state: present
        identifiers:
          slug: zigbee2mqtt
        attrs:
          name: Zigbee2MQTT
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, Zigbee2MQTT Proxy]]
          meta_launch_url: https://zigbee2mqtt.${CLUSTER_DOMAIN}
          policy_engine_mode: all

      - model: authentik_policies.policybinding
        id: binding-zigbee2mqtt-admin
        state: present
        identifiers:
          order: 0
          target: !Find [authentik_core.application, [slug, zigbee2mqtt]]
          policy: !Find [authentik_policies_expression.expressionpolicy, [name, require-homelab-admins]]
        attrs:
          enabled: true
          negate: false
          timeout: 30

      # Hermes (admins only)
      - model: authentik_core.application
        id: app-hermes
        state: present
        identifiers:
          slug: hermes
        attrs:
          name: Hermes
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Hermes]]
          meta_launch_url: https://hermes.${CLUSTER_DOMAIN}
          policy_engine_mode: all

      # Deleted here, after the application stopped pointing at it: left in place the
      # embedded outpost would keep serving hermes.${CLUSTER_DOMAIN} alongside the
      # dashboard's own OIDC.
      - model: authentik_providers_proxy.proxyprovider
        id: provider-hermes-proxy-retired
        state: absent
        identifiers:
          name: Hermes Proxy

      - model: authentik_policies.policybinding
        id: binding-hermes-admin
        state: present
        identifiers:
          order: 0
          target: !Find [authentik_core.application, [slug, hermes]]
          policy: !Find [authentik_policies_expression.expressionpolicy, [name, require-homelab-admins]]
        attrs:
          enabled: true
          negate: false
          timeout: 30

      # Cloudflare Access (all users)
      - model: authentik_core.application
        id: app-cloudflare-access
        state: present
        identifiers:
          slug: cloudflare-access
        attrs:
          name: Cloudflare Access
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Cloudflare Access]]
          meta_launch_url: blank://blank
          policy_engine_mode: all

      - model: authentik_policies.policybinding
        id: binding-cloudflare-access-users
        state: present
        identifiers:
          order: 0
          target: !Find [authentik_core.application, [slug, cloudflare-access]]
          policy: !Find [authentik_policies_expression.expressionpolicy, [name, require-homelab-users]]
        attrs:
          enabled: true
          negate: false
          timeout: 30

      # Grafana (admins only, OIDC)
      - model: authentik_core.application
        id: app-grafana
        state: present
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Grafana OIDC]]
          meta_launch_url: https://grafana.${CLUSTER_DOMAIN}
          policy_engine_mode: all

      - model: authentik_policies.policybinding
        id: binding-grafana-admin
        state: present
        identifiers:
          order: 0
          target: !Find [authentik_core.application, [slug, grafana]]
          policy: !Find [authentik_policies_expression.expressionpolicy, [name, require-homelab-admins]]
        attrs:
          enabled: true
          negate: false
          timeout: 30

      # Immich (all users, OIDC)
      - model: authentik_core.application
        id: app-immich
        state: present
        identifiers:
          slug: immich
        attrs:
          name: Immich
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Immich OIDC]]
          meta_launch_url: https://immich.${PUBLIC_DOMAIN}
          policy_engine_mode: all

      - model: authentik_policies.policybinding
        id: binding-immich-users
        state: present
        identifiers:
          order: 0
          target: !Find [authentik_core.application, [slug, immich]]
          policy: !Find [authentik_policies_expression.expressionpolicy, [name, require-homelab-users]]
        attrs:
          enabled: true
          negate: false
          timeout: 30

      # Dawarich (all users). Each account only ever sees its own tracks, so opening this
      # shares no data between members — it just lets anyone who wants their own location
      # history have one. Access alone does nothing: the app stays empty until its owner
      # installs a background GPS collector.
      - model: authentik_core.application
        id: app-dawarich
        state: present
        identifiers:
          slug: dawarich
        attrs:
          name: Dawarich
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Dawarich OIDC]]
          meta_launch_url: https://dawarich.${PUBLIC_DOMAIN}
          policy_engine_mode: all

      # The policy is part of a binding's identifiers, so swapping it does not edit the
      # existing binding — it adds a second one. The application runs policy_engine_mode
      # "all", so leaving the admin binding in place would require being an admin AND a
      # user, locking out exactly the people this change is meant to let in.
      - model: authentik_policies.policybinding
        id: binding-dawarich-admin-removed
        state: absent
        identifiers:
          order: 0
          target: !Find [authentik_core.application, [slug, dawarich]]
          policy: !Find [authentik_policies_expression.expressionpolicy, [name, require-homelab-admins]]

      - model: authentik_policies.policybinding
        id: binding-dawarich-users
        state: present
        identifiers:
          order: 0
          target: !Find [authentik_core.application, [slug, dawarich]]
          policy: !Find [authentik_policies_expression.expressionpolicy, [name, require-homelab-users]]
        attrs:
          enabled: true
          negate: false
          timeout: 30

      # Paperless (all users). Access here is not the same thing as visibility: a document
      # belongs to whoever uploaded it and Paperless shows nothing else by default, so the
      # binding opens the door and the sharing stays a per-document decision inside the app.
      - model: authentik_core.application
        id: app-paperless
        state: present
        identifiers:
          slug: paperless
        attrs:
          name: Paperless
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Paperless OIDC]]
          meta_launch_url: https://paperless.${PUBLIC_DOMAIN}
          policy_engine_mode: all

      - model: authentik_policies.policybinding
        id: binding-paperless-users
        state: present
        identifiers:
          order: 0
          target: !Find [authentik_core.application, [slug, paperless]]
          policy: !Find [authentik_policies_expression.expressionpolicy, [name, require-homelab-users]]
        attrs:
          enabled: true
          negate: false
          timeout: 30

      # Matrix (admins + users + friends, OIDC via MAS)
      - model: authentik_core.application
        id: app-matrix
        state: present
        identifiers:
          slug: matrix
        attrs:
          name: Matrix
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, MAS OIDC]]
          meta_launch_url: https://element.${PUBLIC_DOMAIN}
          policy_engine_mode: all

      - model: authentik_policies.policybinding
        id: binding-matrix-friends
        state: present
        identifiers:
          order: 0
          target: !Find [authentik_core.application, [slug, matrix]]
          policy: !Find [authentik_policies_expression.expressionpolicy, [name, require-homelab-friends]]
        attrs:
          enabled: true
          negate: false
          timeout: 30

      # Cleanup: Synapse direct-OIDC replaced by MAS; drop old provider + app
      - model: authentik_core.application
        id: app-synapse
        state: absent
        identifiers:
          slug: synapse

      - model: authentik_providers_oauth2.oauth2provider
        id: provider-synapse-oidc
        state: absent
        identifiers:
          name: Synapse OIDC

      # Cleanup: RustFS migrated from proxy mode to native OIDC — drop old proxy provider
      - model: authentik_providers_proxy.proxyprovider
        id: provider-rustfs
        state: absent
        identifiers:
          name: RustFS Proxy

      # Cleanup: remove old orphaned bindings
      - model: authentik_policies.policybinding
        id: binding-homarr-admin
        state: absent
        identifiers:
          order: 0
          target: !Find [authentik_core.application, [slug, homarr]]
          policy: !Find [authentik_policies_expression.expressionpolicy, [name, require-homelab-admins]]

      - model: authentik_policies.policybinding
        id: binding-home-assistant-admin
        state: absent
        identifiers:
          order: 0
          target: !Find [authentik_core.application, [slug, home-assistant]]
          policy: !Find [authentik_policies_expression.expressionpolicy, [name, require-homelab-admins]]

      # =====================================================
      # SECTION 4: MFA ENFORCEMENT
      # =====================================================
      # Override the default MFA validation stage to force enrollment:
      # if user has no MFA device, redirect to TOTP setup at first login.
      - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        state: present
        identifiers:
          name: default-authentication-mfa-validation
        attrs:
          not_configured_action: configure
          device_classes:
            - totp
            - webauthn
            - static
          configuration_stages:
            - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
            - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]

      # =====================================================
      # SECTION 5: LOGIN-FAILURE NOTIFICATIONS
      # =====================================================
      # Detect bursts of failed logins and email homelab-admins via the
      # built-in default-email-transport (Resend SMTP).
      - model: authentik_policies_event_matcher.eventmatcherpolicy
        state: present
        identifiers:
          name: match-login-failed
        attrs:
          action: login_failed

      - model: authentik_events.notificationrule
        state: present
        identifiers:
          name: notify-login-failed
        attrs:
          severity: alert
          group: !Find [authentik_core.group, [name, homelab-admins]]
          transports:
            - !Find [authentik_events.notificationtransport, [name, default-email-transport]]

      - model: authentik_policies.policybinding
        state: present
        identifiers:
          order: 0
          target: !Find [authentik_events.notificationrule, [name, notify-login-failed]]
          policy: !Find [authentik_policies_event_matcher.eventmatcherpolicy, [name, match-login-failed]]
        attrs:
          enabled: true

      # =====================================================
      # SECTION 6: OUTPOST
      # =====================================================
      - model: authentik_outposts.outpost
        state: present
        identifiers:
          name: authentik Embedded Outpost
        attrs:
          type: proxy
          config:
            authentik_host: https://auth.${CLUSTER_DOMAIN}/
          providers:
            - !Find [authentik_providers_proxy.proxyprovider, [name, Hubble Proxy]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, Longhorn Proxy]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, AdGuard Proxy]]

            - !Find [authentik_providers_proxy.proxyprovider, [name, Frigate Proxy]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, Zigbee2MQTT Proxy]]
