---
# jinbe, the LLM machine, lives outside the cluster. Its llama-swap UI is reached through the
# embedded outpost, which signs in to it with the API key; the route therefore lives here,
# next to the Service it points at.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jinbe
  namespace: authentik
spec:
  parentRefs:
    - name: internal-gateway
      namespace: kube-system
      sectionName: https-internal-wildcard
  hostnames:
    - jinbe.${CLUSTER_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: authentik-server
          port: 80

---
# The machine itself rather than the UI: the UI only ever answers with a redirect to the
# login page, which would stay green with jinbe down.
apiVersion: autokuma.bigboot.dev/v1
kind: KumaEntity
metadata:
  name: jinbe
  namespace: authentik
spec:
  config:
    type: http
    name: Jinbe
    url: http://${JINBE_IP}:8080/health
    interval: 60
    accepted_statuscodes:
      - "200-299"
    notification_name_list:
      - discord

---
apiVersion: autokuma.bigboot.dev/v1
kind: KumaEntity
metadata:
  name: jinbe-mineru
  namespace: authentik
spec:
  config:
    type: http
    name: MinerU
    url: http://${JINBE_IP}:8000/v1/health
    interval: 60
    accepted_statuscodes:
      - "200-299"
    notification_name_list:
      - discord
