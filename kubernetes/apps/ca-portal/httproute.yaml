apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ca-portal
  namespace: ca-portal
spec:
  parentRefs:
    # Plain HTTP is the point: a client that comes to fetch the root CA does not trust it yet.
    - name: internal-gateway
      namespace: kube-system
      sectionName: http-ca-portal
    # And HTTPS alongside it, because browsers upgrade the scheme on their own and land on the
    # wildcard listener, which has no route for this host and answers 404.
    - name: internal-gateway
      namespace: kube-system
      sectionName: https-internal-wildcard
    # The public domain too: its certificate is signed by a public authority, so a device that
    # does not trust this CA yet can still fetch it over HTTPS. Safari upgrades the scheme and
    # refuses to download from behind its warning page, which leaves no way in on the internal
    # name. LAN-only all the same - the zone has no public wildcard record.
    - name: internal-gateway
      namespace: kube-system
      sectionName: https-app-wildcard
  hostnames:
    - ca.${CLUSTER_DOMAIN}
    - ca.${PUBLIC_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ca-portal
          port: 8080
