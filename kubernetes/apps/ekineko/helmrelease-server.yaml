apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ekineko-server
  namespace: ekineko
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  values:
    controllers:
      ekineko-server:
        annotations:
          reloader.stakater.com/auto: "true"
        # Never two at once: each would ingest against the same PRIM quota, and the second
        # would wait forever for a volume the first still holds.
        strategy: Recreate
        pod:
          # A Service named ekineko-server would inject EKINEKO_SERVER_* variables, inside
          # the app's own EKINEKO_ prefix.
          enableServiceLinks: false
          imagePullSecrets:
            - name: ghcr-pull
          terminationGracePeriodSeconds: 35
        containers:
          app:
            image:
              repository: ghcr.io/bruno00o/ekineko-server
              tag: sha-4780151
            env:
              TZ: ${TIMEZONE}
              EKINEKO_PORT: "8800"
              EKINEKO_DATA_DIR: /data
              EKINEKO_WEB_ORIGINS: https://ekineko.app,https://ekineko.${CLUSTER_DOMAIN}
              EKINEKO_GTFS_MOTIS: sidecar
              EKINEKO_MOTIS_URL: http://127.0.0.1:8080
              EKINEKO_CLIENT_IP_HEADER: cf-connecting-ip
              EKINEKO_DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: ekineko-postgres-app
                    key: uri
            envFrom:
              - secretRef:
                  name: ekineko-prim
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /api/health
                port: 8800
              readiness:
                enabled: true
                type: HTTP
                path: /api/health
                port: 8800
              startup:
                enabled: true
                type: HTTP
                path: /api/health
                port: 8800
                spec:
                  failureThreshold: 60
                  periodSeconds: 5
            # The limit covers the GTFS import too: it runs as a child process, inside this
            # container's memory.
            resources:
              requests:
                cpu: 50m
                memory: 1Gi
              limits:
                memory: 3584Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
          motis:
            image:
              repository: ghcr.io/bruno00o/ekineko-motis
              tag: sha-4780151
            env:
              TZ: ${TIMEZONE}
            # The supervisor answers while a build runs, so the pod stays ready through one;
            # the server returns 503 on journeys until MOTIS serves.
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /sidecar/health
                port: 8080
              readiness:
                enabled: true
                type: HTTP
                path: /sidecar/health
                port: 8080
              startup:
                enabled: true
                type: HTTP
                path: /sidecar/health
                port: 8080
                spec:
                  failureThreshold: 60
                  periodSeconds: 5
            # Sized for the street graph, built on an empty volume or after a MOTIS upgrade
            # that changes its format: far above what serving or a GTFS rebuild needs.
            resources:
              requests:
                cpu: 50m
                memory: 1536Mi
              limits:
                memory: 5Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        controller: ekineko-server
        ports:
          http:
            port: 8800

    persistence:
      # Downloaded and rebuilt from upstream, so no backup: see longhorn-no-backup.
      data:
        storageClass: longhorn-no-backup
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp
