apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ekineko-web
  namespace: ekineko
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      ekineko-web:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: RollingUpdate
        pod:
          enableServiceLinks: false
          imagePullSecrets:
            - name: ghcr-pull
        containers:
          app:
            image:
              repository: ghcr.io/bruno00o/ekineko-web
              tag: 1.2.0 # {"$imagepolicy": "flux-system:ekineko-web:tag"}
            env:
              TZ: ${TIMEZONE}
              NODE_ENV: production
              PORT: "3000"
              HOST: "0.0.0.0"
              EKINEKO_API_URL: http://ekineko-server:8800
              EKINEKO_CLIENT_IP_HEADER: cf-connecting-ip
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /
                port: 3000
              readiness:
                enabled: true
                type: HTTP
                path: /
                port: 3000
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: ekineko-web
        ports:
          http:
            port: 3000
    persistence:
      tmp:
        type: emptyDir
        sizeLimit: 64Mi
        globalMounts:
          - path: /tmp
