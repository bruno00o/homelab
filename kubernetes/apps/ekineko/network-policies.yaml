---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-gateway-server
  namespace: ekineko
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ekineko-server
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.0.20.0/24 }
      ports:
        - { protocol: TCP, port: 8800 }

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-gateway-proxy-ingress-server
  namespace: ekineko
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ekineko-server
  ingress:
    - fromEntities: [ingress]
      toPorts:
        - ports:
            - { port: "8800", protocol: TCP }

