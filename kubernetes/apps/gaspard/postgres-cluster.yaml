apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gaspard-postgres
  namespace: gaspard
spec:
  instances: 2

  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie

  # Required, not the default `preferred`: each volume has a single replica on its
  # instance's node (longhorn-cnpg), so two instances on one node would share one disk.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required

  storage:
    storageClass: longhorn-cnpg
    size: 5Gi

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"
      # Do not remove: an inactive replication slot makes Postgres retain WAL forever,
      # which filled a volume and crashlooped the instance on another cluster here.
      max_slot_wal_keep_size: "2GB"

  # No secret: the operator generates gaspard-postgres-app, whose `uri` the server reads.
  bootstrap:
    initdb:
      database: gaspard
      owner: gaspard

  monitoring:
    enablePodMonitor: true

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: gaspard-backups

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
---
# CREATE EXTENSION needs a superuser and the application owner is not one. The operator
# applies this as one, and keeps it applied on a cluster restored from backup.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: gaspard
  namespace: gaspard
spec:
  cluster:
    name: gaspard-postgres
  name: gaspard
  owner: gaspard
  extensions:
    # No version: the image tag is republished in place, so nodes can hold builds with
    # different pgvector releases, and a pinned one may not exist on the node.
    - name: vector
      ensure: present
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: gaspard-backups
  namespace: gaspard
spec:
  retentionPolicy: "30d"
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 384Mi
  configuration:
    destinationPath: s3://cnpg-gaspard/
    endpointURL: http://rustfs.rustfs.svc.cluster.local:9000
    s3Credentials:
      accessKeyId:
        name: rustfs-s3-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: rustfs-s3-credentials
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: gaspard-postgres-daily
  namespace: gaspard
spec:
  # Staggered from the other clusters so the backups do not all hit rustfs at once.
  schedule: "0 15 3 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: gaspard-postgres
