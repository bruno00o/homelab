---
# API (8642) and dashboard (9119), both reachable from the gateway on the LAN.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-gateway
  namespace: hermes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.0.20.0/24 }
      ports:
        - { protocol: TCP, port: 8642 }
        - { protocol: TCP, port: 9119 }

---
# Cross-node envoy proxy traffic (Cilium ingress identity) for both routes.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-gateway-proxy-ingress
  namespace: hermes
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hermes
  ingress:
    - fromEntities: [ingress]
      toPorts:
        - ports:
            - { port: "8642", protocol: TCP }
            - { port: "9119", protocol: TCP }

---
# OIDC backchannel: the sidecar proxies to Authentik, hermes itself only talks to
# it over loopback (hostAlias), which no policy governs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-authentik
  namespace: hermes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
      # 9000, the pod targetPort behind the service's port 80: Cilium matches egress
      # after DNAT, and written as 80 this rule lets nothing through (504 on discovery).
      ports:
        - { protocol: TCP, port: 9000 }

---
# Outbound to the internet for the LLM provider (OpenRouter, 443) and web tools.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-https
  namespace: hermes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.244.0.0/16
              - 10.96.0.0/12
      ports:
        - { protocol: TCP, port: 443 }

---
# Talk to the self-hosted Matrix homeserver (Synapse) in-cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-matrix
  namespace: hermes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: matrix
      ports:
        - { protocol: TCP, port: 8008 }
        - { protocol: TCP, port: 80 }
