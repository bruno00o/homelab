---
apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hermes
  ports:
    - name: api
      port: 8642
      targetPort: 8642
      protocol: TCP
    - name: dashboard
      port: 9119
      targetPort: 9119
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes
  namespace: hermes
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: hermes
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      # Root here, and only here: the image runs on s6-overlay, whose preinit chowns /run
      # before dropping to uid 10000 via suexec. Pinned to 10000 from the start it cannot
      # do that and refuses to boot ("/run belongs to uid 0 ... we're lacking the
      # privileges to fix it"). The hermes process still ends up non-root — s6 lowers it.
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Seed config.yaml into the PVC only if absent, so Hermes can still
        # own/modify it at runtime (the PVC is the source of truth for its state).
        - name: seed-config
          # renovate: datasource=docker depName=docker.io/nousresearch/hermes-agent
          image: docker.io/nousresearch/hermes-agent:v2026.7.30
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - test -f /opt/data/config.yaml || cp /config-seed/config.yaml /opt/data/config.yaml
          # Explicitly 10000, against the root the pod now defaults to: this container
          # creates config.yaml in the PVC, and root would leave it unwritable by the
          # hermes process that owns it at runtime.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: config-seed
              mountPath: /config-seed
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      containers:
        - name: hermes
          # renovate: datasource=docker depName=docker.io/nousresearch/hermes-agent
          image: docker.io/nousresearch/hermes-agent:v2026.7.30
          imagePullPolicy: IfNotPresent
          args: ["gateway", "run"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
              # The two s6 needs to hand the process over to uid 10000: without them
              # s6-applyuidgid fails on setgroups ("Operation not permitted") and the
              # container loops. They are what makes the drop possible, not a privilege.
              add: ["SETUID", "SETGID"]
          ports:
            - name: api
              containerPort: 8642
              protocol: TCP
            - name: dashboard
              containerPort: 9119
              protocol: TCP
          readinessProbe:
            tcpSocket: { port: 9119 }
            initialDelaySeconds: 10
            periodSeconds: 15
          env:
            - name: TZ
              value: ${TIMEZONE}
            - name: HERMES_HEADLESS
              value: "1"
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: 0.0.0.0
            - name: API_SERVER_CORS_ORIGINS
              value: "*"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: API_SERVER_KEY
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: 0.0.0.0
            - name: HERMES_DASHBOARD_PORT
              value: "9119"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: OPENROUTER_API_KEY
            # Matrix chat interface (in-cluster, outbound-only). Token from secret.
            - name: MATRIX_HOMESERVER
              value: http://synapse.matrix.svc.cluster.local:8008
            - name: MATRIX_USER_ID
              value: "@hermes:matrix.${PUBLIC_DOMAIN}"
            - name: MATRIX_ALLOWED_USERS
              value: "@bruno:matrix.${PUBLIC_DOMAIN}"
            - name: MATRIX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-matrix
                  key: MATRIX_ACCESS_TOKEN
            # E2EE: olm keys live on the PVC (/opt/data/crypto.db). The recovery
            # key is Hermes' OWN (bootstrapped at first encrypted boot, not bruno's
            # account key), so it lets the bot re-sign its own device after a key
            # rotation but cannot recover bruno's session.
            - name: MATRIX_ENCRYPTION
              value: "true"
            - name: MATRIX_RECOVERY_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-matrix
                  key: MATRIX_RECOVERY_KEY
          volumeMounts:
            - name: data
              mountPath: /opt/data
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 4Gi
      volumes:
        - name: config-seed
          configMap:
            name: hermes-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ${DEFAULT_STORAGE_CLASS}
        resources:
          requests:
            storage: 5Gi
