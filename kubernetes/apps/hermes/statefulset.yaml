---
apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hermes
  ports:
    - name: api
      port: 8642
      targetPort: 8642
      protocol: TCP
    - name: dashboard
      port: 9119
      targetPort: 9119
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes
  namespace: hermes
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: hermes
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      # The OIDC backchannel resolves to the sidecar below, never to the Cilium
      # LB-gateway: hairpinning back in through it does not work from a pod.
      hostAliases:
        - ip: "127.0.0.1"
          hostnames:
            - auth.${CLUSTER_DOMAIN}
      # Root at start, and only at start: the image runs on s6-overlay v3, whose init hook
      # remaps the uid, chowns /run and /opt/data, then hands the gateway to uid 10000 via
      # s6-setuidgid. Pinned to 10000 from the outset it cannot do any of that and refuses
      # to boot ("/run belongs to uid 0 ... we're lacking the privileges to fix it").
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Native sidecar (k8s 1.29+): passes its startupProbe before hermes starts,
        # so the dashboard's OIDC discovery at boot cannot race an unready nginx —
        # it refuses to bind at all when the provider fails to load. Config in
        # oidc-proxy.yaml.
        - name: oidc-proxy
          # renovate: datasource=docker depName=docker.io/nginxinc/nginx-unprivileged
          image: docker.io/nginxinc/nginx-unprivileged:1.31.5-alpine
          restartPolicy: Always
          # Explicitly 101 (the image's own user), against the root the pod defaults to.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          ports:
            - name: oidc-tls
              containerPort: 443
              protocol: TCP
          startupProbe:
            tcpSocket: { port: 443 }
            periodSeconds: 1
            failureThreshold: 30
          volumeMounts:
            - name: oidc-proxy-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: oidc-proxy-tls
              mountPath: /tls
              readOnly: true
            # nginx.conf points pid + temp paths here; needed under readOnlyRootFilesystem.
            - name: oidc-proxy-tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
        # Seed config.yaml into the PVC only if absent, so Hermes can still
        # own/modify it at runtime (the PVC is the source of truth for its state).
        - name: seed-config
          # renovate: datasource=docker depName=docker.io/nousresearch/hermes-agent
          image: docker.io/nousresearch/hermes-agent:v2026.8.31
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - test -f /opt/data/config.yaml || cp /config-seed/config.yaml /opt/data/config.yaml
          # Explicitly 10000, against the root the pod now defaults to: the file written
          # here belongs to the hermes process at runtime, and root would leave it unwritable.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: config-seed
              mountPath: /config-seed
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      containers:
        - name: hermes
          # renovate: datasource=docker depName=docker.io/nousresearch/hermes-agent
          image: docker.io/nousresearch/hermes-agent:v2026.8.31
          imagePullPolicy: IfNotPresent
          args: ["gateway", "run"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
              # What the s6 init hook needs to give the volume away and step down:
              # CHOWN/FOWNER/DAC_OVERRIDE to fix ownership of /run and /opt/data,
              # SETUID/SETGID for the s6-setuidgid that follows. Without them root is
              # root with no rights at all and the container loops on setgroups.
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
          ports:
            - name: api
              containerPort: 8642
              protocol: TCP
            - name: dashboard
              containerPort: 9119
              protocol: TCP
          readinessProbe:
            tcpSocket: { port: 9119 }
            initialDelaySeconds: 10
            periodSeconds: 15
          env:
            - name: TZ
              value: ${TIMEZONE}
            - name: HERMES_HEADLESS
              value: "1"
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: 0.0.0.0
            - name: API_SERVER_CORS_ORIGINS
              value: "*"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: API_SERVER_KEY
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: 0.0.0.0
            - name: HERMES_DASHBOARD_PORT
              value: "9119"
            # Since v2026.7.30 the dashboard refuses to bind anywhere but loopback
            # without an auth provider of its own — Authentik in front is no longer
            # enough. `self-hosted` is its built-in generic OIDC client: a public
            # PKCE client, no secret, everything else read from the issuer's
            # discovery document. PUBLIC_URL is what the callback is built from,
            # the forwarded headers alone would give the sidecar's view.
            - name: HERMES_DASHBOARD_OIDC_ISSUER
              value: https://auth.${CLUSTER_DOMAIN}/application/o/hermes/
            - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
              value: hermes-dashboard
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: https://hermes.${CLUSTER_DOMAIN}
            - name: SSL_CERT_FILE
              value: /etc/ssl/mugiwara/ca.crt
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: OPENROUTER_API_KEY
            # Matrix chat interface (in-cluster, outbound-only). Token from secret.
            - name: MATRIX_HOMESERVER
              value: http://synapse.matrix.svc.cluster.local:8008
            - name: MATRIX_USER_ID
              value: "@hermes:matrix.${PUBLIC_DOMAIN}"
            - name: MATRIX_ALLOWED_USERS
              value: "@bruno:matrix.${PUBLIC_DOMAIN}"
            - name: MATRIX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-matrix
                  key: MATRIX_ACCESS_TOKEN
            # E2EE: olm keys live on the PVC (/opt/data/crypto.db). The recovery
            # key is Hermes' OWN (bootstrapped at first encrypted boot, not bruno's
            # account key), so it lets the bot re-sign its own device after a key
            # rotation but cannot recover bruno's session.
            - name: MATRIX_ENCRYPTION
              value: "true"
            - name: MATRIX_RECOVERY_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-matrix
                  key: MATRIX_RECOVERY_KEY
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: mugiwara-ca
              mountPath: /etc/ssl/mugiwara
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 1536Mi
      volumes:
        - name: config-seed
          configMap:
            name: hermes-config
        - name: oidc-proxy-conf
          configMap:
            name: hermes-oidc-proxy
        - name: oidc-proxy-tmp
          emptyDir: {}
        - name: oidc-proxy-tls
          secret:
            secretName: auth-oidc-tls
        # ca.crt of the auth-oidc-tls secret = the mugiwara CA (see SSL_CERT_FILE).
        - name: mugiwara-ca
          secret:
            secretName: auth-oidc-tls
            items:
              - key: ca.crt
                path: ca.crt
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ${DEFAULT_STORAGE_CLASS}
        resources:
          requests:
            storage: 5Gi
