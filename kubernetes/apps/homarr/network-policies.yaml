---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-gateway
  namespace: homarr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: homarr
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.20.0/24
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 3001

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-cloudflare-tunnel
  namespace: homarr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: homarr
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 3001

---
# Renamed from allow-api-egress, which is what it was not: ports with no `to:` read as "to
# anywhere", so this has always been egress to the internet - which homarr does need, for
# widget integrations and icons. 6443 is gone, that port only ever meant the apiserver, and
# it is now named as such in the CiliumNetworkPolicy at the end of this file.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-https-egress
  namespace: homarr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: homarr
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-gateway-proxy-ingress
  namespace: homarr
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: homarr
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
            - port: "3001"
              protocol: TCP

---
# Homarr's Kubernetes integration lists workloads through the apiserver. Named as an entity
# because the apiserver is reached through a ClusterIP that DNATs to host-network endpoints,
# which no ipBlock can express.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-apiserver-egress
  namespace: homarr
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: homarr
  egress:
    - toEntities:
        - kube-apiserver
---
# The board pings every app it lists, straight at their ClusterIP services. Naming them one
# by one goes stale the first time a chart moves a targetPort - and homarr answers a dropped
# ping with a red dot, which reads as the app being down. Replaces the per-namespace rules
# this used to carry, same conclusion as uptime-kuma.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cluster-egress
  namespace: homarr
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: homarr
  egress:
    - toEntities:
        - cluster
