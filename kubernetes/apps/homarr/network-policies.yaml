---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-gateway
  namespace: homarr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: homarr
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.20.0/24
      ports:
        - protocol: TCP
          port: 3000

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-cloudflare-tunnel
  namespace: homarr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: homarr
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
      ports:
        - protocol: TCP
          port: 3000

---
# Renamed from allow-api-egress, which is what it was not: ports with no `to:` read as "to
# anywhere", so this has always been egress to the internet - which homarr does need, for
# widget integrations and icons. 6443 is gone, that port only ever meant the apiserver, and
# it is now named as such in the CiliumNetworkPolicy at the end of this file.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-https-egress
  namespace: homarr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: homarr
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-egress
  namespace: homarr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: homarr
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: valkey-system
      ports:
        - protocol: TCP
          port: 6379

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-gateway-proxy-ingress
  namespace: homarr
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: homarr
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-adguard
  namespace: homarr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: homarr
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: adguard
      ports:
        - protocol: TCP
          port: 80

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-authentik
  namespace: homarr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: homarr
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
      ports:
        - protocol: TCP
          port: 9000

---
# Homarr's Kubernetes integration lists workloads through the apiserver. Named as an entity
# because the apiserver is reached through a ClusterIP that DNATs to host-network endpoints,
# which no ipBlock can express.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-apiserver-egress
  namespace: homarr
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: homarr
  egress:
    - toEntities:
        - kube-apiserver
