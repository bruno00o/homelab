apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: homarr
  namespace: homarr
spec:
  # 1, not 0: with a single replica, maxUnavailable: 0 forbids every voluntary
  # eviction, so `kubectl drain` blocks forever.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homarr
