apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frigate
  namespace: home-automation
spec:
  interval: 30m
  timeout: 15m

  chart:
    spec:
      chart: frigate
      version: "7.8.0"
      sourceRef:
        kind: HelmRepository
        name: blakeshome
        namespace: flux-system
      interval: 1h

  dependsOn:
    - name: cilium
      namespace: kube-system
    - name: longhorn
      namespace: longhorn-system

  install:
    crds: CreateReplace

  upgrade:
    crds: CreateReplace

  # The chart hardcodes its `copyconfig` init container with neither securityContext nor
  # resources, and exposes no value for either - `securityContext` below reaches the main
  # container only. Merged by container name, not list index: `extraInitContainers` renders
  # ahead of this one.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: frigate
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: frigate
              spec:
                template:
                  spec:
                    initContainers:
                      - name: copyconfig
                        securityContext:
                          allowPrivilegeEscalation: false
                        resources:
                          requests:
                            cpu: 10m
                            memory: 32Mi
                          limits:
                            memory: 128Mi

  values:
    image:
      # renovate: datasource=docker depName=ghcr.io/blakeblackshear/frigate
      tag: "0.17.2"

    strategyType: Recreate

    podAnnotations:
      reloader.stakater.com/auto: "true"

    # The detection weights travel as an OCI image rather than as a file someone copied into
    # a volume: the kubelet pulls it, so this needs no NetworkPolicy, no registry credentials
    # inside the pod and no trust in the internal CA — the three things an oras sidecar would
    # have needed. No `# renovate:` comment: zot is LAN-only and Renovate cannot reach it.
    imagePullSecrets:
      - name: zot-pull

    extraInitContainers:
      - name: fetch-model
        image: zot.merry.home.arpa/frigate-models/yolov9-s-320:1.0.0
        command: ["cp", "/src/yolov9-s-320.onnx", "/models/yolov9-s-320.onnx"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
          - name: models
            mountPath: /models
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi

    extraVolumes:
      - name: models
        emptyDir: {}

    extraVolumeMounts:
      - name: models
        mountPath: /models
        readOnly: true

    securityContext:
      allowPrivilegeEscalation: false
      # intel_gpu_top reads the i915 PMU through perf_event_open, which is refused twice
      # over here: the node runs kernel.perf_event_paranoid=3, and the kubelet applies a
      # RuntimeDefault seccomp profile whose containerd rule only admits the syscall for a
      # container holding CAP_PERFMON. Granting it clears both — perfmon_capable() bypasses
      # the paranoid check, and the seccomp allowlist gains the syscall. Without it Frigate
      # logs "Failed to initialize PMU" once a minute and the GPU panel stays empty, while
      # OpenVINO detection itself is unaffected: that goes through /dev/dri, not perf.
      capabilities:
        add:
          - PERFMON

    shmSize: 1Gi

    env:
      TZ: ${TIMEZONE}
      LIBVA_DRIVER_NAME: iHD

    resources:
      requests:
        cpu: 500m
        memory: 1Gi
        gpu.intel.com/i915: "1"
      limits:
        memory: 4Gi
        gpu.intel.com/i915: "1"

    persistence:
      config:
        enabled: true
        storageClass: ${DEFAULT_STORAGE_CLASS}
        # 1Gi was enough until the embedding models landed here: /config/model_cache holds
        # 495Mi of ONNX next to a frigate.db that grows with the 14-day event retention.
        size: 2Gi
        skipuninstall: true
      media:
        enabled: true
        existingClaim: frigate-media-nfs

    probes:
      startup:
        enabled: true
        failureThreshold: 30
        periodSeconds: 10
      # No periodSeconds on liveness or readiness: the chart reads one only for startup.
      liveness:
        enabled: true
        initialDelaySeconds: 30
        failureThreshold: 5
      readiness:
        enabled: true
        initialDelaySeconds: 30
        failureThreshold: 3

    config: |
      auth:
        enabled: false
      proxy:
        header_map:
          user: X-authentik-username
        default_role: admin

      mqtt:
        host: mosquitto.home-automation.svc.cluster.local
        port: 1883
        topic_prefix: frigate
        client_id: frigate
        user: frigate
        password: ${FRIGATE_MQTT_PASSWORD}

      detectors:
        ov:
          type: openvino
          device: GPU

      # YOLOv9-s at 320, replacing the bundled SSDLite MobileNet v2. The size matters and
      # was chosen on measurement, not on the parameter count: scored against real snapshots
      # from these two cameras, on the exact motion region Frigate feeds the detector,
      #
      #                       ssdlite   yolov9-t   yolov9-s
      #   camera_2, night       0.93      0.202      0.727
      #   camera_1, day         0.90      0.891      0.896
      #   camera_1, day         0.88      0.933      0.936
      #   camera_1, day         0.99      0.900      0.926
      #
      # yolov9-t is the size Frigate's own docs reach for first, and on that night frame it
      # lands under the 0.5 min_score — it would have dropped a person SSDLite saw at 0.93.
      # The -s costs 16.3 ms against 10.0 ms on this iGPU, and the detector sits near 13% of
      # capacity, so the trade is one-sided. Re-measure before changing size again.
      #
      # No input_pixel_format here: SSDLite wanted bgr, YOLOv9 was trained on rgb, which is
      # the default. Setting it would silently swap the red and blue channels — the model
      # still runs and still returns boxes, just worse ones.
      #
      # The weights ship as an OCI image from zot and land on an emptyDir, so /models is
      # rebuilt from the registry on every start and holds no state. Deliberately not the
      # config PVC: a restore from a backup older than the model would leave this path empty
      # and stop Frigate at startup.
      model:
        model_type: yolo-generic
        width: 320
        height: 320
        input_tensor: nchw
        input_dtype: float
        path: /models/yolov9-s-320.onnx
        labelmap_path: /labelmap/coco-80.txt

      go2rtc:
        rtsp:
          listen: ":8554"
        streams:
          camera_1:
            - "ffmpeg:rtsp://admin:${FRIGATE_CAM1_PASSWORD}@10.0.30.2:554/H264/ch1/main/av_stream#video=copy#audio=copy"
          # Le canal 103 plutôt que le principal : go2rtc alimente le pont HomeKit, qui
          # n'accepte que du H.264, et le principal est passé en H.265. L'audio est repris
          # du 101, le troisième flux étant configuré en vidéo seule. Les deux connexions
          # ne s'ouvrent qu'à la demande d'un client.
          camera_2:
            - "ffmpeg:rtsp://admin:${FRIGATE_CAM2_PASSWORD}@10.0.30.3:554/Streaming/Channels/103#video=copy"
            - "ffmpeg:rtsp://admin:${FRIGATE_CAM2_PASSWORD}@10.0.30.3:554/Streaming/Channels/101#audio=copy"

      ffmpeg:
        hwaccel_args: preset-vaapi

      cameras:
        camera_1:
          enabled: true
          ffmpeg:
            inputs:
              - path: rtsp://admin:${FRIGATE_CAM1_PASSWORD}@10.0.30.2:554/H264/ch1/main/av_stream
                roles:
                  - detect
                  - record
                  - audio
          detect:
            width: 1280
            height: 720
            fps: 5
          onvif:
            host: 10.0.30.2
            port: 80
            user: admin
            password: ${FRIGATE_CAM1_PASSWORD}
            autotracking:
              enabled: true
              track:
                - person
              required_zones:
                - full_frame
              return_preset: "préréglage 1"
              timeout: 10
          zones:
            full_frame:
              coordinates: 0,0,1280,0,1280,720,0,720
        camera_2:
          enabled: true
          # Deux flux séparés, contrairement à camera_1 qui décode encore du 3072x1728 pour
          # détecter en 1280x720. Le canal 103 est le troisième profil de la caméra, réglé à
          # la résolution de détection exacte : même image qu'avant pour le détecteur, seize
          # fois moins de pixels à décoder. Le 101 reste en 3K et passe en H.265, copié tel
          # quel à l'enregistrement.
          # `/Streaming/Channels/1xx` et non `/H264/ch1/...` : cet alias retombe toujours sur
          # le canal principal quel que soit le segment qu'on lui donne, y compris `/third/`
          # ou `/H265/`. Les URL faisant foi sont celles que l'ONVIF renvoie.
          ffmpeg:
            inputs:
              - path: rtsp://admin:${FRIGATE_CAM2_PASSWORD}@10.0.30.3:554/Streaming/Channels/103
                roles:
                  - detect
              - path: rtsp://admin:${FRIGATE_CAM2_PASSWORD}@10.0.30.3:554/Streaming/Channels/101
                roles:
                  - record
                  - audio
          detect:
            width: 1280
            height: 720
            fps: 5
          onvif:
            host: 10.0.30.3
            port: 80
            user: admin
            password: ${FRIGATE_CAM2_PASSWORD}
            # autotracking:
            #   enabled: true
            #   track:
            #     - person
            #   required_zones:
            #     - zone_name

      record:
        enabled: true
        retain:
          days: 7
          mode: motion
        events:
          retain:
            default: 14
            mode: active_objects

      snapshots:
        enabled: true
        retain:
          default: 14

      semantic_search:
        enabled: true
        model_size: small

      face_recognition:
        enabled: true
        model_size: small

      classification:
        bird:
          enabled: true

      audio:
        enabled: true

      objects:
        track:
          - person
          - car
          - dog
          - cat
