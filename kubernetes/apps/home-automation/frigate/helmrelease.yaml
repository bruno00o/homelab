apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frigate
  namespace: home-automation
spec:
  interval: 30m
  timeout: 15m

  chart:
    spec:
      chart: frigate
      version: "7.8.0"
      sourceRef:
        kind: HelmRepository
        name: blakeshome
        namespace: flux-system
      interval: 1h

  dependsOn:
    - name: cilium
      namespace: kube-system
    - name: longhorn
      namespace: longhorn-system

  install:
    crds: CreateReplace

  upgrade:
    crds: CreateReplace

  # The chart hardcodes its `copyconfig` init container with neither securityContext nor
  # resources, and exposes no value for either - `securityContext` below reaches the main
  # container only. Merged by container name, not list index: `extraInitContainers` renders
  # ahead of this one.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: frigate
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: frigate
              spec:
                template:
                  spec:
                    initContainers:
                      - name: copyconfig
                        securityContext:
                          allowPrivilegeEscalation: false
                        resources:
                          requests:
                            cpu: 10m
                            memory: 32Mi
                          limits:
                            memory: 128Mi

  values:
    image:
      # renovate: datasource=docker depName=ghcr.io/blakeblackshear/frigate
      tag: "0.17.2"

    strategyType: Recreate

    podAnnotations:
      reloader.stakater.com/auto: "true"

    # The detection weights travel as an OCI image rather than as a file someone copied into
    # a volume: the kubelet pulls it, so this needs no NetworkPolicy, no registry credentials
    # inside the pod and no trust in the internal CA — the three things an oras sidecar would
    # have needed. No `# renovate:` comment: zot is LAN-only and Renovate cannot reach it.
    imagePullSecrets:
      - name: zot-pull

    extraInitContainers:
      - name: fetch-model
        image: zot.merry.home.arpa/frigate-models/yolov9-s-320:1.0.0
        command: ["cp", "/src/yolov9-s-320.onnx", "/models/yolov9-s-320.onnx"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
          - name: models
            mountPath: /models
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi

    extraVolumes:
      - name: models
        emptyDir: {}

    extraVolumeMounts:
      - name: models
        mountPath: /models
        readOnly: true

    securityContext:
      allowPrivilegeEscalation: false
      # intel_gpu_top reads the i915 PMU through perf_event_open, which is refused twice
      # over here: the node runs kernel.perf_event_paranoid=3, and the kubelet applies a
      # RuntimeDefault seccomp profile whose containerd rule only admits the syscall for a
      # container holding CAP_PERFMON. Granting it clears both — perfmon_capable() bypasses
      # the paranoid check, and the seccomp allowlist gains the syscall. Without it Frigate
      # logs "Failed to initialize PMU" once a minute and the GPU panel stays empty, while
      # OpenVINO detection itself is unaffected: that goes through /dev/dri, not perf.
      capabilities:
        add:
          - PERFMON

    shmSize: 1Gi

    env:
      TZ: ${TIMEZONE}
      LIBVA_DRIVER_NAME: iHD

    resources:
      requests:
        cpu: 500m
        memory: 1Gi
        gpu.intel.com/i915: "1"
      limits:
        memory: 4Gi
        gpu.intel.com/i915: "1"

    persistence:
      config:
        enabled: true
        storageClass: ${DEFAULT_STORAGE_CLASS}
        # 1Gi was enough until the embedding models landed here: /config/model_cache holds
        # 495Mi of ONNX next to a frigate.db that grows with the 14-day event retention.
        size: 2Gi
        skipuninstall: true
      media:
        enabled: true
        existingClaim: frigate-media-nfs

    probes:
      startup:
        enabled: true
        failureThreshold: 30
        periodSeconds: 10
      # No periodSeconds on liveness or readiness: the chart reads one only for startup.
      liveness:
        enabled: true
        initialDelaySeconds: 30
        failureThreshold: 5
      readiness:
        enabled: true
        initialDelaySeconds: 30
        failureThreshold: 3

    config: |
      auth:
        enabled: false
      proxy:
        header_map:
          user: X-authentik-username
        default_role: admin

      mqtt:
        host: mosquitto.home-automation.svc.cluster.local
        port: 1883
        topic_prefix: frigate
        client_id: frigate
        user: frigate
        password: ${FRIGATE_MQTT_PASSWORD}

      detectors:
        ov:
          type: openvino
          device: GPU

      # YOLOv9-s at 320, replacing the bundled SSDLite MobileNet v2. The size matters and
      # was chosen on measurement, not on the parameter count: scored against real snapshots
      # from these two cameras, on the exact motion region Frigate feeds the detector,
      #
      #                       ssdlite   yolov9-t   yolov9-s
      #   camera_2, night       0.93      0.202      0.727
      #   camera_1, day         0.90      0.891      0.896
      #   camera_1, day         0.88      0.933      0.936
      #   camera_1, day         0.99      0.900      0.926
      #
      # yolov9-t is the size Frigate's own docs reach for first, and on that night frame it
      # lands under the 0.5 min_score — it would have dropped a person SSDLite saw at 0.93.
      # The -s costs 16.3 ms against 10.0 ms on this iGPU, and the detector sits near 13% of
      # capacity, so the trade is one-sided. Re-measure before changing size again.
      #
      # No input_pixel_format here: SSDLite wanted bgr, YOLOv9 was trained on rgb, which is
      # the default. Setting it would silently swap the red and blue channels — the model
      # still runs and still returns boxes, just worse ones.
      #
      # The weights ship as an OCI image from zot and land on an emptyDir, so /models is
      # rebuilt from the registry on every start and holds no state. Deliberately not the
      # config PVC: a restore from a backup older than the model would leave this path empty
      # and stop Frigate at startup.
      model:
        model_type: yolo-generic
        width: 320
        height: 320
        input_tensor: nchw
        input_dtype: float
        path: /models/yolov9-s-320.onnx
        labelmap_path: /labelmap/coco-80.txt

      go2rtc:
        rtsp:
          listen: ":8554"
        # Channel 103 rather than the main one: go2rtc feeds the HomeKit bridge, which only
        # accepts H.264, and both main streams are now H.265 - leaving them here left the
        # garden cameras blank in the Home app. Audio comes from 101 because the third
        # stream is configured video-only. Both connections open on demand, only while a
        # client is watching.
        streams:
          camera_1:
            - "ffmpeg:rtsp://admin:${FRIGATE_CAM1_PASSWORD}@10.0.30.2:554/Streaming/Channels/103#video=copy"
            - "ffmpeg:rtsp://admin:${FRIGATE_CAM1_PASSWORD}@10.0.30.2:554/Streaming/Channels/101#audio=copy"
          camera_2:
            - "ffmpeg:rtsp://admin:${FRIGATE_CAM2_PASSWORD}@10.0.30.3:554/Streaming/Channels/103#video=copy"
            - "ffmpeg:rtsp://admin:${FRIGATE_CAM2_PASSWORD}@10.0.30.3:554/Streaming/Channels/101#audio=copy"
          # The Tapo needs no such split: stream1 is already H.264, so one source carries
          # both video and audio.
          camera_3:
            - "ffmpeg:rtsp://insidecam:${FRIGATE_CAM3_PASSWORD}@10.0.30.4:554/stream1#video=copy#audio=copy"

      ffmpeg:
        hwaccel_args: preset-vaapi

      cameras:
        camera_1:
          enabled: true
          # Detection and recording come from two different profiles. Channel 103 is the
          # camera's third stream, set to the exact detect resolution, so the detector sees
          # the same image as before with sixteen times fewer pixels to decode - measured at
          # 3.3% CPU against 7.0% when detection ran off the 3072x1728 main stream. Channel
          # 101 stays 3K, now H.265, and is copied straight to disk.
          # `/Streaming/Channels/1xx` and not `/H264/ch1/...`: that alias always falls back
          # to the main channel whatever segment it is given, `/third/` and `/H265/`
          # included, so it silently serves the wrong stream. ONVIF GetStreamUri returns the
          # authoritative URLs.
          # Keep the camera's I-frame interval equal to its frame rate. At the factory 50 it
          # emitted a keyframe every 3.3 seconds, which is where Frigate is forced to cut
          # its recording segments and the clips sent to the phone.
          ffmpeg:
            inputs:
              - path: rtsp://admin:${FRIGATE_CAM1_PASSWORD}@10.0.30.2:554/Streaming/Channels/103
                roles:
                  - detect
              - path: rtsp://admin:${FRIGATE_CAM1_PASSWORD}@10.0.30.2:554/Streaming/Channels/101
                roles:
                  - record
                  - audio
          detect:
            width: 1280
            height: 720
            fps: 5
          onvif:
            host: 10.0.30.2
            port: 80
            user: admin
            password: ${FRIGATE_CAM1_PASSWORD}
            autotracking:
              enabled: true
              track:
                - person
              required_zones:
                - full_frame
              return_preset: "préréglage 1"
              timeout: 10
          zones:
            full_frame:
              coordinates: 0,0,1280,0,1280,720,0,720
        camera_2:
          enabled: true
          # Same split as camera_1 above.
          ffmpeg:
            inputs:
              - path: rtsp://admin:${FRIGATE_CAM2_PASSWORD}@10.0.30.3:554/Streaming/Channels/103
                roles:
                  - detect
              - path: rtsp://admin:${FRIGATE_CAM2_PASSWORD}@10.0.30.3:554/Streaming/Channels/101
                roles:
                  - record
                  - audio
          detect:
            width: 1280
            height: 720
            fps: 5
          onvif:
            host: 10.0.30.3
            port: 80
            user: admin
            password: ${FRIGATE_CAM2_PASSWORD}
            # autotracking:
            #   enabled: true
            #   track:
            #     - person
            #   required_zones:
            #     - zone_name

        # Indoor camera, and the only one that films the family rather than the garden. It
        # ships with `detect` and `record` off: the streams are connected, nothing is
        # analysed or written. `switch.camera_3_detect` and `switch.camera_3_recordings`
        # are what the holiday mode turns on, so the camera is blind for the rest of the
        # year without anyone having to remember it.
        # Beware that these two switches are runtime state: a Frigate restart re-reads this
        # block and turns them back off, mid-holiday included.
        # No continuous recording either - three days of a living room is neither useful
        # nor wanted, and events alone answer the only question this camera is here for.
        # Detection runs off stream2 at 640x360, which would be far too coarse for a garden
        # but is not indoors, where a person fills a large part of the frame.
        camera_3:
          enabled: true
          ffmpeg:
            inputs:
              - path: rtsp://insidecam:${FRIGATE_CAM3_PASSWORD}@10.0.30.4:554/stream2
                roles:
                  - detect
              - path: rtsp://insidecam:${FRIGATE_CAM3_PASSWORD}@10.0.30.4:554/stream1
                roles:
                  - record
          detect:
            enabled: false
            width: 640
            height: 360
            fps: 5
          record:
            enabled: false
            continuous:
              days: 0
            alerts:
              retain:
                days: 7
            detections:
              retain:
                days: 7
          snapshots:
            enabled: false
          # `audio` is enabled globally, and Frigate refuses the whole config - not just this
          # camera - if a camera has audio events on without the `audio` role on an input.
          # It then starts with no cameras at all and a cpu detector, which is what happened
          # on 2026-08-02. Turning it off here is also the right call on its own: this is the
          # one camera pointed at the family.
          audio:
            enabled: false
          objects:
            track:
              - person

      # Written in the 0.17 schema rather than the pre-0.16 `retain`/`events` one, which
      # Frigate migrates on every start and whose meaning changed underneath us: the old
      # `retain: {days: 7, mode: motion}` became `motion: {days: 7}` and the recordings went
      # from 3 GB to 77 GB a day on 2026-07-26, with no commit touching this block.
      # Continuous rather than motion because measurement leaves little between them: on
      # these two garden cameras something moves 73% of the time, so motion saves 27% and
      # costs gaps when scrubbing. A better detector does not help here - Frigate's motion
      # detection is pixel-based and never consults it. Events, in contrast, run at 3.5% of
      # the time, which is why a month of clips costs about 1 GB per camera per day.
      # Measured at 2.6 Mbit/s per camera since the main stream moved to H.265: roughly
      # 230 GB for two cameras, 343 GB for three.
      record:
        enabled: true
        continuous:
          days: 3
        motion:
          days: 0
        alerts:
          retain:
            days: 30
        detections:
          retain:
            days: 14

      snapshots:
        enabled: true
        retain:
          default: 14

      semantic_search:
        enabled: true
        model_size: small

      face_recognition:
        enabled: true
        model_size: small

      classification:
        bird:
          enabled: true

      audio:
        enabled: true

      objects:
        track:
          - person
          - car
          - dog
          - cat
