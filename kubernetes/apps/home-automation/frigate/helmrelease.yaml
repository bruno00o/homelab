apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frigate
  namespace: home-automation
spec:
  interval: 30m
  timeout: 15m

  chart:
    spec:
      chart: frigate
      version: "7.8.0"
      sourceRef:
        kind: HelmRepository
        name: blakeshome
        namespace: flux-system
      interval: 1h

  dependsOn:
    - name: cilium
      namespace: kube-system
    - name: longhorn
      namespace: longhorn-system

  install:
    crds: CreateReplace

  upgrade:
    crds: CreateReplace

  # The chart hardcodes its `copyconfig` init container with neither securityContext nor
  # resources, and exposes no value for either - `securityContext` below reaches the main
  # container only. Merged by container name, not list index: `extraInitContainers` renders
  # ahead of this one.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: frigate
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: frigate
              spec:
                template:
                  spec:
                    initContainers:
                      - name: copyconfig
                        securityContext:
                          allowPrivilegeEscalation: false
                        resources:
                          requests:
                            cpu: 10m
                            memory: 32Mi
                          limits:
                            memory: 128Mi

  values:
    image:
      # renovate: datasource=docker depName=ghcr.io/blakeblackshear/frigate
      tag: "0.17.2"

    strategyType: Recreate

    podAnnotations:
      reloader.stakater.com/auto: "true"

    securityContext:
      allowPrivilegeEscalation: false
      # intel_gpu_top reads the i915 PMU through perf_event_open, which is refused twice
      # over here: the node runs kernel.perf_event_paranoid=3, and the kubelet applies a
      # RuntimeDefault seccomp profile whose containerd rule only admits the syscall for a
      # container holding CAP_PERFMON. Granting it clears both — perfmon_capable() bypasses
      # the paranoid check, and the seccomp allowlist gains the syscall. Without it Frigate
      # logs "Failed to initialize PMU" once a minute and the GPU panel stays empty, while
      # OpenVINO detection itself is unaffected: that goes through /dev/dri, not perf.
      capabilities:
        add:
          - PERFMON

    shmSize: 1Gi

    env:
      TZ: ${TIMEZONE}
      LIBVA_DRIVER_NAME: iHD

    resources:
      requests:
        cpu: 500m
        memory: 1Gi
        gpu.intel.com/i915: "1"
      limits:
        memory: 4Gi
        gpu.intel.com/i915: "1"

    persistence:
      config:
        enabled: true
        storageClass: ${DEFAULT_STORAGE_CLASS}
        # 1Gi was enough until the embedding models landed here: /config/model_cache holds
        # 495Mi of ONNX next to a frigate.db that grows with the 14-day event retention.
        size: 2Gi
        skipuninstall: true
      media:
        enabled: true
        existingClaim: frigate-media-nfs

    probes:
      startup:
        enabled: true
        failureThreshold: 30
        periodSeconds: 10
      # No periodSeconds on liveness or readiness: the chart reads one only for startup.
      liveness:
        enabled: true
        initialDelaySeconds: 30
        failureThreshold: 5
      readiness:
        enabled: true
        initialDelaySeconds: 30
        failureThreshold: 3

    config: |
      auth:
        enabled: false
      proxy:
        header_map:
          user: X-authentik-username
        default_role: admin

      mqtt:
        host: mosquitto.home-automation.svc.cluster.local
        port: 1883
        topic_prefix: frigate
        client_id: frigate
        user: frigate
        password: ${FRIGATE_MQTT_PASSWORD}

      detectors:
        ov:
          type: openvino
          device: GPU

      # YOLOv9-t at 320, which Frigate lists as its recommended model for an Intel GPU.
      # It replaces the bundled SSDLite MobileNet v2: same input resolution, far better on
      # partially hidden and distant people, and measured at 10.4 ms on this iGPU against
      # 8.4 ms for SSDLite — the detector runs at 8% of capacity, so the difference is free.
      #
      # No input_pixel_format here: SSDLite wanted bgr, YOLOv9 was trained on rgb, which is
      # the default. Setting it would silently swap the red and blue channels — the model
      # still runs and still returns boxes, just worse ones.
      #
      # The .onnx is NOT in git: it is 9 MB of weights sitting on the config PVC, exported
      # from the upstream yolov9-t checkpoint (see the Frigate docs, "Downloading YOLO
      # Models"). Restore that PVC from a backup taken before 2026-08-02 and this path is
      # empty, which stops Frigate at startup rather than falling back.
      model:
        model_type: yolo-generic
        width: 320
        height: 320
        input_tensor: nchw
        input_dtype: float
        path: /config/model_cache/yolov9-t-320.onnx
        labelmap_path: /labelmap/coco-80.txt

      go2rtc:
        rtsp:
          listen: ":8554"
        streams:
          camera_1:
            - "ffmpeg:rtsp://admin:${FRIGATE_CAM1_PASSWORD}@10.0.30.2:554/H264/ch1/main/av_stream#video=copy#audio=copy"
          camera_2:
            - "ffmpeg:rtsp://admin:${FRIGATE_CAM2_PASSWORD}@10.0.30.3:554/H264/ch1/main/av_stream#video=copy#audio=copy"

      ffmpeg:
        hwaccel_args: preset-vaapi

      cameras:
        camera_1:
          enabled: true
          ffmpeg:
            inputs:
              - path: rtsp://admin:${FRIGATE_CAM1_PASSWORD}@10.0.30.2:554/H264/ch1/main/av_stream
                roles:
                  - detect
                  - record
                  - audio
          detect:
            width: 1280
            height: 720
            fps: 5
          onvif:
            host: 10.0.30.2
            port: 80
            user: admin
            password: ${FRIGATE_CAM1_PASSWORD}
            autotracking:
              enabled: true
              track:
                - person
              required_zones:
                - full_frame
              return_preset: "préréglage 1"
              timeout: 10
          zones:
            full_frame:
              coordinates: 0,0,1280,0,1280,720,0,720
        camera_2:
          enabled: true
          ffmpeg:
            inputs:
              - path: rtsp://admin:${FRIGATE_CAM2_PASSWORD}@10.0.30.3:554/H264/ch1/main/av_stream
                roles:
                  - detect
                  - record
                  - audio
          detect:
            width: 1280
            height: 720
            fps: 5
          onvif:
            host: 10.0.30.3
            port: 80
            user: admin
            password: ${FRIGATE_CAM2_PASSWORD}
            # autotracking:
            #   enabled: true
            #   track:
            #     - person
            #   required_zones:
            #     - zone_name

      record:
        enabled: true
        retain:
          days: 7
          mode: motion
        events:
          retain:
            default: 14
            mode: active_objects

      snapshots:
        enabled: true
        retain:
          default: 14

      semantic_search:
        enabled: true
        model_size: small

      face_recognition:
        enabled: true
        model_size: small

      classification:
        bird:
          enabled: true

      audio:
        enabled: true

      objects:
        track:
          - person
          - car
          - dog
          - cat
