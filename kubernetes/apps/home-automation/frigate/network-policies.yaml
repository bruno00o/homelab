      app.kubernetes.io/name: frigate
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.30.0/24
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 554
        - protocol: TCP
          port: 8862
---
apiVersion: networking.k8s.io/v1
