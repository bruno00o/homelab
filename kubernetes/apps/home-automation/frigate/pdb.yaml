apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frigate
  namespace: home-automation
spec:
  # 1, not 0: with a single replica, maxUnavailable: 0 forbids every voluntary
  # eviction, so `kubectl drain` blocks forever (see AUDIT.md R12).
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frigate
