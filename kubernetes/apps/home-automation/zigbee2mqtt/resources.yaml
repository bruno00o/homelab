---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zigbee2mqtt-config
  namespace: home-automation
data:
  # The init container copies this over /app/data/configuration.yaml on every pod start, so
  # anything Zigbee2MQTT writes back into that file is lost at the next restart. It writes
  # two things there by default, and both were being erased: the `devices:` block holding
  # every friendly_name — eleven devices sat at their raw IEEE address because each rename
  # made in the frontend survived only until the next restart — and the `version:` marker,
  # whose loss made Z2M replay its four config migrations at every boot.
  # `devices:`/`groups:` as filenames move that mutable state to files on the PVC that the
  # init container never touches, which is upstream's own answer to this. Keep them, and
  # keep `version:` in sync when a migration bumps it (compare with the running
  # /app/data/configuration.yaml after an upgrade).
  # Nothing else Z2M persists lives here: the network key and PAN id come from
  # coordinator_backup.json, so the wipe never touched the network identity.
  configuration.yaml: |
    version: 5
    devices: devices.yaml
    groups: groups.yaml
    permit_join: false
    homeassistant:
      enabled: true
    mqtt:
      base_topic: zigbee2mqtt
      server: mqtt://mosquitto.home-automation.svc.cluster.local:1883
      user: zigbee2mqtt
      password: ${ZIGBEE2MQTT_MQTT_PASSWORD}
    serial:
      port: tcp://10.0.20.17:20108
      adapter: ember
    frontend:
      enabled: true
      port: 8080
    advanced:
      log_level: info
      last_seen: ISO_8601
      transmit_power: 20
      channel: 11
    # Without this a silent device keeps republishing its last state: two SNZB-04PR2 sat on
    # `contact: true` — door closed — for a month. 720 minutes rather than upstream's 1500,
    # the healthy contact sensors report every 25 minutes or so.
    availability:
      enabled: true
      active:
        timeout: 10
      passive:
        timeout: 720
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zigbee2mqtt-data
  namespace: home-automation
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    kustomize.toolkit.fluxcd.io/prune: Disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ${DEFAULT_STORAGE_CLASS}
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee2mqtt
  namespace: home-automation
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zigbee2mqtt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zigbee2mqtt
        app.kubernetes.io/instance: zigbee2mqtt
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: copy-config
          image: docker.io/library/busybox:1.38.0
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          command: ["sh", "-c", "cp /config/configuration.yaml /data/configuration.yaml"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
      containers:
        - name: zigbee2mqtt
          # renovate: datasource=docker depName=docker.io/koenkk/zigbee2mqtt
          image: docker.io/koenkk/zigbee2mqtt:2.13.0
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: config
          configMap:
            name: zigbee2mqtt-config
        - name: data
          persistentVolumeClaim:
            claimName: zigbee2mqtt-data
---
apiVersion: v1
kind: Service
metadata:
  name: zigbee2mqtt
  namespace: home-automation
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: zigbee2mqtt
  ports:
    - name: http
      port: 8080
      targetPort: 8080
