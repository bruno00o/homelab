apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homelab-docs
  namespace: homelab-docs
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      homelab-docs:
        containers:
          app:
            image:
              repository: ghcr.io/bruno00o/homelab-docs
              tag: 1.0.0 # {"$imagepolicy": "flux-system:homelab-docs:tag"}
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /health
                port: 3000
              readiness:
                enabled: true
                type: HTTP
                path: /health
                port: 3000
            resources:
              requests:
                cpu: 10m
                memory: 192Mi
              limits:
                memory: 384Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: homelab-docs
        ports:
          http:
            port: 3000
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
