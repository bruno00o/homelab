apiVersion: autokuma.bigboot.dev/v1
kind: KumaEntity
metadata:
  name: homelab-docs
  namespace: homelab-docs
spec:
  config:
    type: http
    name: Homelab Docs
    url: https://docs.${CLUSTER_DOMAIN}/health
    interval: 60
    ignore_tls: true
    # Not 200-299 wide: the gateway's own 403 would otherwise read as up.
    accepted_statuscodes:
      - "200-200"
    notification_name_list:
      - discord
