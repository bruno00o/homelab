apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ring
  namespace: kazimo
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  values:
    controllers:
      ring:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: RollingUpdate
        containers:
          app:
            # renovate: datasource=docker depName=ghcr.io/bruno00o/kazimo/ring
            image:
              repository: ghcr.io/bruno00o/kazimo/ring
              tag: "0.1.0"
            env:
              TZ: ${TIMEZONE}
              KAZIMO_RING_KEY_FILE: /etc/kazimo/apns/AuthKey.p8
              KAZIMO_RING_KEY_ID: XAR57M4J72
              KAZIMO_RING_TEAM_ID: 7G8GCY5LMH
              KAZIMO_RING_BUNDLE_ID: com.kazimo.family
              # A device token is only valid on the APNs environment that issued it, and a
              # development build gets a sandbox one. Production signing means flipping this.
              KAZIMO_RING_APNS_ENV: sandbox
              KAZIMO_RING_DEPLOYMENTS:
                valueFrom:
                  secretKeyRef:
                    name: ring-secrets
                    key: deployments
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /health
                port: 8089
              readiness:
                enabled: true
                type: HTTP
                path: /health
                port: 8089
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]

    defaultPodOptions:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        controller: ring
        ports:
          http:
            port: 8089

    persistence:
      apns-key:
        type: secret
        name: ring-secrets
        globalMounts:
          - path: /etc/kazimo/apns/AuthKey.p8
            subPath: AuthKey.p8
            readOnly: true
      tmp:
        type: emptyDir
        sizeLimit: 32Mi
        globalMounts:
          - path: /tmp
