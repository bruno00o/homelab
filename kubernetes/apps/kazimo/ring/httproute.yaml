apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ring
  namespace: kazimo
spec:
  parentRefs:
    - name: internal-gateway
      namespace: kube-system
      sectionName: https-app-wildcard
  # Synapse pushes to the URL the iPhone registered, so it resolves this public hostname
  # from inside the cluster — where the split-horizon answers with the gateway, not the
  # tunnel. Without this route the push gateway would only answer from the internet.
  hostnames:
    - ring.${PUBLIC_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ring
          port: 8089
