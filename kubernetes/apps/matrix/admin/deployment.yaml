---
apiVersion: v1
kind: Service
metadata:
  name: element-admin
  namespace: matrix
  labels:
    app.kubernetes.io/name: element-admin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: element-admin
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: element-admin
  namespace: matrix
  labels:
    app.kubernetes.io/name: element-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: element-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: element-admin
    spec:
      # Mirrored from oci.element.io, which Kyverno's registry allowlist does not
      # cover. Pushed with --platform linux/amd64: this Pi is arm64 and would
      # otherwise mirror an image no node can run.
      imagePullSecrets:
        - name: zot-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: element-admin
          image: zot.merry.home.arpa/element-admin:0.1.12
          env:
            # Skips the "which server?" prompt on every visit.
            - name: SERVER_NAME
              value: matrix.${PUBLIC_DOMAIN}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # The only writable path the image needs: both entrypoint scripts
            # write here (the rendered index and the listen directive), and the
            # unprivileged nginx base already keeps its pid and temp files here.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
