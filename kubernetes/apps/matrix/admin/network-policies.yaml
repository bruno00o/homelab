---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-element-admin-ingress-from-gateway
  namespace: matrix
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: element-admin
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.0.20.0/24 }
      ports:
        - { protocol: TCP, port: 8080 }

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-element-admin-gateway-ingress
  namespace: matrix
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: element-admin
  ingress:
    - fromEntities: [ingress]
      toPorts:
        - ports:
            - { port: "8080", protocol: TCP }
