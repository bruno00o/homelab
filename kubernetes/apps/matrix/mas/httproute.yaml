---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mas
  namespace: matrix
spec:
  parentRefs:
    - name: internal-gateway
      namespace: kube-system
      sectionName: https-app-wildcard
  hostnames:
    - mas.${PUBLIC_DOMAIN}
  rules:
    # The admin API has to answer on this hostname and no other: MAS builds the
    # admin console's URLs from public_base, so a separate hostname serves a page
    # that then looks for its spec and its OAuth callback here. Serving it from
    # the gateway keeps it LAN-only anyway — the tunnel routes straight to the
    # Service on 8080 and never crosses the gateway, so /api stays 404 publicly.
    - matches:
        - path:
            type: PathPrefix
            value: /api/
      backendRefs:
        - name: mas
          port: 8082
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: mas
          port: 8080
