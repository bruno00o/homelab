---
apiVersion: v1
kind: Service
metadata:
  name: lk-jwt-service
  namespace: matrix
  labels:
    app.kubernetes.io/name: lk-jwt-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lk-jwt-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lk-jwt-service
  namespace: matrix
  labels:
    app.kubernetes.io/name: lk-jwt-service
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lk-jwt-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lk-jwt-service
    spec:
      # Every setting this service reads is LIVEKIT_*, and a Service named after
      # LiveKit in this namespace would inject variables under the same prefix.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lk-jwt-service
          image: ghcr.io/element-hq/lk-jwt-service:0.6.0
          env:
            # The SFU lives outside the cluster: WebRTC media needs a public UDP
            # port range, which the Cloudflare tunnel cannot carry.
            - name: LIVEKIT_URL
              value: wss://livekit.${PUBLIC_DOMAIN}
            - name: LIVEKIT_FULL_ACCESS_HOMESERVERS
              value: matrix.${PUBLIC_DOMAIN}
          envFrom:
            - secretRef:
                name: lk-jwt-service-secrets
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
