apiVersion: v1
kind: ConfigMap
metadata:
  name: synapse-config
  namespace: matrix
data:
  homeserver.yaml: |
    server_name: "matrix.${PUBLIC_DOMAIN}"
    public_baseurl: "https://matrix.${PUBLIC_DOMAIN}/"
    pid_file: /data/homeserver.pid
    signing_key_path: "/data/signing.key"
    report_stats: false
    log_config: "/config/log.config"

    listeners:
      - port: 8008
        tls: false
        type: http
        x_forwarded: true
        bind_addresses: ['0.0.0.0']
        resources:
          # `openid` serves only the userinfo endpoint, not federation. MatrixRTC
          # validates users through it; without it Element Call fails client-side
          # with OPEN_ID_ERROR and nothing is logged server-side.
          - names: [client, openid]
            compress: false

    media_store_path: /data/media_store
    max_upload_size: "50M"

    # Federation OFF (empty whitelist = federate with nobody).
    federation_domain_whitelist: []

    # Advertises port 443 instead of the default 8448. MatrixRTC resolves the
    # homeserver the federation way to reach the userinfo endpoint, and without
    # this it dials 8448, which nothing here serves. Advertising is not
    # federating: the whitelist above still refuses every server, and the only
    # federation-path endpoint exposed is openid/userinfo.
    serve_server_wellknown: true
    trusted_key_servers: []
    suppress_key_server_warning: true

    # Closed registration: humans go through MAS (which itself delegates to
    # Authentik upstream OIDC). Local Synapse registration disabled.
    enable_registration: false

    # Delegate auth to MAS. Synapse no longer handles OIDC or passwords
    # directly — MAS is the OAuth2 client of Authentik and Synapse trusts MAS
    # via the shared secret. Endpoint is in-cluster (HTTP, behind netpol).
    matrix_authentication_service:
      enabled: true
      endpoint: http://mas.matrix.svc.cluster.local:8080/
      secret_path: /mas-secrets/matrix_shared_secret

    # MSC4108 (Sign in with QR code): Synapse runs the rendezvous server itself
    # (MAS' /link is a device-code consent page, NOT a rendezvous channel).
    experimental_features:
      msc4108_enabled: true
      # Both required by Element Call: the room summary decides what a
      # non-member is offered, and state_after is how it tracks who is
      # actually in the call.
      msc3266_enabled: true
      msc4222_enabled: true

    # MSC4140, the dead man's switch behind call participation: a client
    # schedules its own departure and refreshes it while alive, so a crash
    # cleans up instead of leaving a ghost in the call. Unset means delayed
    # events are refused outright, and calls stay stuck.
    max_event_delay_duration: 24h

    # How clients discover the call backend (MSC4143). Nothing else advertises
    # it, so a call falls back to no SFU at all if this block is missing.
    extra_well_known_client_content:
      org.matrix.msc4143.rtc_foci:
        - type: livekit
          livekit_service_url: "https://matrix-rtc.${PUBLIC_DOMAIN}"
  log.config: |
    version: 1
    formatters:
      precise:
        format: '%(asctime)s - %(name)s - %(lineno)d - %(levelname)s - %(request)s - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: precise
    loggers:
      synapse.storage.SQL:
        level: INFO
    root:
      level: INFO
      handlers: [console]
    disable_existing_loggers: false
