apiVersion: autokuma.bigboot.dev/v1
kind: KumaEntity
metadata:
  name: open-webui
  namespace: open-webui
spec:
  config:
    type: http
    name: Open WebUI
    url: https://chat.${CLUSTER_DOMAIN}/health
    interval: 60
    ignore_tls: true
    accepted_statuscodes:
      - "200-299"
    notification_name_list:
      - discord
