---
# Both halves of the gateway ingress: the ipBlock for same-node host traffic, the Cilium
# rule for the cross-node proxy identity an ipBlock cannot match.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-gateway
  namespace: paperless
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: paperless
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.0.20.0/24 }
      ports:
        - { protocol: TCP, port: 8000 }

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-gateway-proxy-ingress
  namespace: paperless
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: paperless
  ingress:
    - fromEntities: [ingress]
      toPorts:
        - ports:
            - { port: "8000", protocol: TCP }

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-cloudflare-tunnel
  namespace: paperless
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: paperless
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
      ports:
        - { protocol: TCP, port: 8000 }

---
# Three destinations and no internet. Paperless never has to leave the cluster: OCR is
# local, there is no update check and no AI backend enabled. If mail rules are ever set up
# to pull documents from an IMAP inbox, that is the moment this becomes too tight — the
# symptom will be a mail task timing out, not a policy error.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-egress
  namespace: paperless
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: paperless
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: paperless-postgres
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: valkey-system
      ports:
        - { protocol: TCP, port: 6379 }
    # OIDC discovery and the token exchange. Port 9000 is authentik's pod targetPort — the
    # Service's 80 would never match, Cilium evaluates egress after DNAT.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
      ports:
        - { protocol: TCP, port: 9000 }

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-cnpg-operator
  namespace: paperless
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: paperless-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 8000 }

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-ingress
  namespace: paperless
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: paperless-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: paperless
      ports:
        - { protocol: TCP, port: 5432 }
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: paperless-postgres
      ports:
        - { protocol: TCP, port: 5432 }
        # The instance manager status port the replicas poll each other on.
        - { protocol: TCP, port: 8000 }

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape-postgres
  namespace: paperless
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: paperless-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { protocol: TCP, port: 9187 }

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-egress
  namespace: paperless
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: paperless-postgres
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: paperless-postgres
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 8000 }
    # WAL archiving and base backups, through the barman sidecar.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rustfs
          podSelector:
            matchLabels:
              app.kubernetes.io/name: rustfs
      ports:
        - { protocol: TCP, port: 9000 }

---
# Deliberately not a `ports:` block with no `to:` — that reads as "to anywhere" and would
# open the database pods to the whole internet.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-apiserver-egress
  namespace: paperless
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: paperless-postgres
  egress:
    - toEntities:
        - kube-apiserver
