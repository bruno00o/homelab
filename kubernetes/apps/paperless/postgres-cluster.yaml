apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperless-postgres
  namespace: paperless
spec:
  # Two instances, same reasoning as dawarich: this one holds document metadata, not the
  # identity provider the whole cluster logs in through, and the workers are the tightest
  # node on memory.
  instances: 2

  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie

  storage:
    storageClass: ${DEFAULT_STORAGE_CLASS}
    size: 10Gi

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"
      # Do not remove: an inactive replication slot makes Postgres retain WAL forever,
      # which filled a volume and crashlooped the instance on another cluster here.
      max_slot_wal_keep_size: "2GB"

  bootstrap:
    initdb:
      database: paperless
      owner: paperless
      secret:
        name: paperless-postgres-credentials

  monitoring:
    enablePodMonitor: true

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: paperless-backups

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: paperless-backups
  namespace: paperless
spec:
  retentionPolicy: "30d"
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 384Mi
  configuration:
    destinationPath: s3://cnpg-paperless/
    endpointURL: http://rustfs.rustfs.svc.cluster.local:9000
    s3Credentials:
      accessKeyId:
        name: rustfs-s3-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: rustfs-s3-credentials
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: paperless-postgres-daily
  namespace: paperless
spec:
  # Staggered from the other clusters so the backups do not all hit rustfs at once.
  schedule: "0 45 3 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: paperless-postgres
