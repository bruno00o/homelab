---
# One input per open pull request on the repository carrying the `preview` label. The
# repository is private, so listing them takes a read-only token.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: portfolio-julia-pull-requests
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 5m
spec:
  type: GitHubPullRequest
  url: https://github.com/bruno00o/portfolio-julia
  secretRef:
    name: portfolio-julia-github
  filter:
    labels:
      - preview
# Read by flate only, which cannot list pull requests offline and would otherwise render the
# templates against no input at all. The API server drops a status sent through apply.
status:
  exportedInputs:
    - id: "0"
      sha: "0000000000000000000000000000000000000000"

---
# A release and a route per pull request, at the commit at its head, as for the portfolio.
# Each preview starts on an empty volume, which EmDash fills with its bundled seed: demo
# content is enough to review a branch, and nothing written there outlives the pod.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: portfolio-julia-previews
spec:
  serviceAccountName: previews
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: portfolio-julia-pull-requests
  resources:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: julia-pr-<< inputs.id >>
        namespace: portfolio-julia-previews
      spec:
        interval: 30m
        chartRef:
          kind: OCIRepository
          name: app-template
          namespace: flux-system
        values:
          controllers:
            portfolio-julia:
              strategy: Recreate
              containers:
                app:
                  image:
                    repository: ghcr.io/bruno00o/portfolio-julia
                    tag: sha-<< inputs.sha >>
                  env:
                    TZ: ${TIMEZONE}
                    HOST: 0.0.0.0
                    PORT: "4321"
                    EMDASH_SITE_URL: https://julia-pr-<< inputs.id >>.${CLUSTER_DOMAIN}
                    EMDASH_ENCRYPTION_KEY:
                      valueFrom:
                        secretKeyRef:
                          name: portfolio-julia-previews-secrets
                          key: EMDASH_ENCRYPTION_KEY
                  probes:
                    liveness:
                      enabled: true
                      type: HTTP
                      path: /health
                      port: 4321
                    readiness:
                      enabled: true
                      type: HTTP
                      path: /health
                      port: 4321
                  resources:
                    requests:
                      cpu: 10m
                      memory: 192Mi
                    limits:
                      memory: 512Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop: ["ALL"]
          defaultPodOptions:
            enableServiceLinks: false
            imagePullSecrets:
              - name: ghcr-pull
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              fsGroup: 1000
              seccompProfile:
                type: RuntimeDefault
          service:
            app:
              controller: portfolio-julia
              ports:
                http:
                  port: 4321
          persistence:
            data:
              type: emptyDir
              globalMounts:
                - path: /app/data
            tmp:
              type: emptyDir
              globalMounts:
                - path: /tmp
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: julia-pr-<< inputs.id >>
        namespace: portfolio-julia-previews
      spec:
        parentRefs:
          - name: internal-gateway
            namespace: kube-system
            sectionName: https-internal-wildcard
        hostnames:
          - julia-pr-<< inputs.id >>.${CLUSTER_DOMAIN}
        rules:
          - backendRefs:
              - name: julia-pr-<< inputs.id >>
                port: 4321
