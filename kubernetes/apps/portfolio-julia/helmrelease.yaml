apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: portfolio-julia
  namespace: portfolio-julia
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      portfolio-julia:
        annotations:
          reloader.stakater.com/auto: "true"
        # The SQLite file takes one writer: two pods on the volume during a rollout would
        # each think they own it.
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/bruno00o/portfolio-julia
              tag: 1.2.0 # {"$imagepolicy": "flux-system:portfolio-julia:tag"}
            env:
              TZ: ${TIMEZONE}
              HOST: 0.0.0.0
              PORT: "4321"
              # Passkeys are bound to the exact origin, scheme included.
              EMDASH_SITE_URL: https://julia.${CLUSTER_DOMAIN}
              EMDASH_ENCRYPTION_KEY:
                valueFrom:
                  secretKeyRef:
                    name: portfolio-julia-secrets
                    key: EMDASH_ENCRYPTION_KEY
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /health
                port: 4321
              readiness:
                enabled: true
                type: HTTP
                path: /health
                port: 4321
            resources:
              requests:
                cpu: 10m
                memory: 192Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: portfolio-julia
        ports:
          http:
            port: 4321
    persistence:
      # The database and the uploads share one volume, so a snapshot or a backup always
      # holds both at the same instant, never a page pointing at a missing file.
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: ${DEFAULT_STORAGE_CLASS}
        globalMounts:
          - path: /app/data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
