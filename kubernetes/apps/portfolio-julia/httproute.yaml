---
# Internal only for now: no DNSEndpoint and no tunnel route, so nothing outside the LAN
# resolves or reaches it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portfolio-julia
  namespace: portfolio-julia
spec:
  parentRefs:
    - name: internal-gateway
      namespace: kube-system
      sectionName: https-internal-wildcard
  hostnames:
    - julia.${CLUSTER_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: portfolio-julia
          port: 4321
