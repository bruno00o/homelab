---
# One input per open pull request on the portfolio repository carrying the `preview`
# label. The repository is public, so listing them needs no token.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: portfolio-pull-requests
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 5m
spec:
  type: GitHubPullRequest
  url: https://github.com/bruno00o/portfolio
  filter:
    labels:
      - preview
# Read by flate only, which cannot list pull requests offline and would otherwise render the
# templates against no input at all. The API server drops a status sent through apply.
status:
  exportedInputs:
    - id: "0"
      sha: "0000000000000000000000000000000000000000"

---
# A release and a route per pull request, at the commit at its head. The image is the one
# the portfolio CI builds for that commit; until it is pushed the pod waits in
# ImagePullBackOff and starts on its own once it is there. Closing the pull request, or
# removing the label, deletes the preview.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: portfolio-previews
spec:
  serviceAccountName: previews
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: portfolio-pull-requests
  resources:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: portfolio-pr-<< inputs.id >>
        namespace: portfolio-previews
      spec:
        interval: 30m
        chartRef:
          kind: OCIRepository
          name: app-template
          namespace: flux-system
        values:
          controllers:
            portfolio:
              containers:
                app:
                  image:
                    repository: ghcr.io/bruno00o/portfolio
                    tag: sha-<< inputs.sha >>
                  probes:
                    liveness:
                      enabled: true
                      type: HTTP
                      path: /
                      port: 8080
                    readiness:
                      enabled: true
                      type: HTTP
                      path: /
                      port: 8080
                  resources:
                    requests:
                      cpu: 10m
                      memory: 32Mi
                    limits:
                      memory: 128Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop: ["ALL"]
          defaultPodOptions:
            securityContext:
              runAsNonRoot: true
              runAsUser: 101
              runAsGroup: 101
              fsGroup: 101
              seccompProfile:
                type: RuntimeDefault
          service:
            app:
              controller: portfolio
              ports:
                http:
                  port: 8080
          persistence:
            nginx-cache:
              type: emptyDir
              globalMounts:
                - path: /var/cache/nginx
            nginx-run:
              type: emptyDir
              globalMounts:
                - path: /var/run
            tmp:
              type: emptyDir
              globalMounts:
                - path: /tmp
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: portfolio-pr-<< inputs.id >>
        namespace: portfolio-previews
      spec:
        parentRefs:
          - name: internal-gateway
            namespace: kube-system
            sectionName: https-internal-wildcard
        hostnames:
          - portfolio-pr-<< inputs.id >>.${CLUSTER_DOMAIN}
        rules:
          - backendRefs:
              - name: portfolio-pr-<< inputs.id >>
                port: 8080
