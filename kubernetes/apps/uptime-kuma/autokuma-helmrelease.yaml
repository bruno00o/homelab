apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: autokuma
  namespace: uptime-kuma
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  values:
    controllers:
      autokuma:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        serviceAccount:
          name: autokuma
        containers:
          app:
            # A release candidate on purpose: the stable release never reconnects once Uptime
            # Kuma restarts, and has no /health for the probes below.
            # renovate: datasource=docker depName=ghcr.io/bigboot/autokuma
            image:
              repository: ghcr.io/bigboot/autokuma
              tag: "2.1.0-rc.2"
            env:
              TZ: ${TIMEZONE}
              HOME: /tmp
              RUST_LOG: info
              AUTOKUMA__KUMA__URL: http://uptime-kuma:3001
              AUTOKUMA__KUBERNETES__ENABLED: "true"
              AUTOKUMA__DOCKER__ENABLED: "false"
              AUTOKUMA__FILES__ENABLED: "false"
              AUTOKUMA__KUMA__USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: autokuma-secrets
                    key: username
              AUTOKUMA__KUMA__PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: autokuma-secrets
                    key: password
            # /health fails once no sync has succeeded for three cycles. That also catches a
            # lost session, which its reconnect does not; the delay lets Uptime Kuma restart.
            probes:
              startup:
                enabled: true
                type: HTTP
                path: /health
                port: 8090
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
              liveness:
                enabled: true
                type: HTTP
                path: /health
                port: 8090
                spec:
                  failureThreshold: 10
                  periodSeconds: 30
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                # Peaked at 127Mi against 128Mi and was OOMKilled; it keeps every entity it
                # syncs in memory, so it grows with the number of monitors.
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      data:
        storageClass: ${DEFAULT_STORAGE_CLASS}
        accessMode: ReadWriteOnce
        size: 512Mi
        globalMounts:
          - path: /data

    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
