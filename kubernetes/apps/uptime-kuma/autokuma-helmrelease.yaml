apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: autokuma
  namespace: uptime-kuma
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  values:
    controllers:
      autokuma:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        serviceAccount:
          name: autokuma
        containers:
          app:
            # renovate: datasource=docker depName=ghcr.io/bigboot/autokuma
            image:
              repository: ghcr.io/bigboot/autokuma
              tag: "2.0.0"
            env:
              TZ: ${TIMEZONE}
              HOME: /tmp
              RUST_LOG: info
              # Also written to stderr, so Loki keeps every line; this copy is for the probe.
              AUTOKUMA__LOG_DIR: /tmp/log
              AUTOKUMA__KUMA__URL: http://uptime-kuma:3001
              AUTOKUMA__KUBERNETES__ENABLED: "true"
              AUTOKUMA__DOCKER__ENABLED: "false"
              AUTOKUMA__FILES__ENABLED: "false"
              AUTOKUMA__KUMA__USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: autokuma-secrets
                    key: username
              AUTOKUMA__KUMA__PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: autokuma-secrets
                    key: password
            # Once Uptime Kuma restarts, it can keep failing every sync without ever logging in
            # again, the socket reconnected or not. It has no health endpoint, so this reads its
            # own log: a full minute of failed syncs, still being written, calls for a restart.
            # The threshold leaves Uptime Kuma itself time to come back.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - sh
                      - -c
                      - >-
                        f=$(ls -t /tmp/log/*.log 2>/dev/null | head -n 1);
                        [ -n "$f" ] && [ -n "$(find "$f" -mmin -1)" ] || exit 0;
                        tail -n 12 "$f" | awk '/Encountered error during sync/ {e++} END {exit NR == 12 && e == 12}'
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  failureThreshold: 4
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                # Peaked at 127Mi against 128Mi and was OOMKilled; it keeps every entity it
                # syncs in memory, so it grows with the number of monitors.
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      data:
        storageClass: ${DEFAULT_STORAGE_CLASS}
        accessMode: ReadWriteOnce
        size: 512Mi
        globalMounts:
          - path: /data

    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
