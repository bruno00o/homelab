apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  parentRefs:
    - name: internal-gateway
      namespace: kube-system
      sectionName: https-internal-wildcard
    - name: internal-gateway
      namespace: kube-system
      sectionName: https-app-wildcard
  # The public hostname is the canonical one — it is what `domain` is set to and what the
  # clients are configured with. The internal one exists for /admin and for the health
  # probe: it never leaves the LAN, and neither needs the OIDC or mail paths that would
  # otherwise redirect to the canonical domain.
  hostnames:
    - vaultwarden.${CLUSTER_DOMAIN}
    - vaultwarden.${PUBLIC_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: vaultwarden
          port: 80
