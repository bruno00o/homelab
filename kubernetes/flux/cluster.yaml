---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-vars
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/flux/vars
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-notifications
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/flux/notifications
  prune: true
  wait: true
  dependsOn:
    - name: cluster-vars
  decryption:
    provider: sops
    secretRef:
      name: sops-age

---
# Upstream CRDs, from their own source. Own Kustomization rather than a directory of
# infrastructure-controllers so a failed fetch blocks the CRDs alone instead of the 40-odd
# resources next to them. No postBuild: substitution must not run over a foreign repo.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: gateway-api
  path: ./config/crd/standard
  prune: true
  wait: true

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-controllers
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/controllers
  prune: true
  wait: true
  dependsOn:
    - name: cluster-vars
    - name: gateway-api
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
        optional: true
  patches:
    # HelmRelease defaults, declared once instead of being repeated in every release.
    # `crds:` is deliberately absent: it is a per-chart decision (spegel and reloader use
    # Skip because their CRDs are managed elsewhere) and a patch would silently override
    # it. metadata.name is a placeholder — `target` is what selects.
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
      patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: _
        spec:
          install:
            remediation:
              retries: 3
          upgrade:
            cleanupOnFail: true
            remediation:
              retries: 3
              remediateLastFailure: true
          uninstall:
            keepHistory: false
  healthChecks:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: cilium
      namespace: kube-system
    - apiVersion: apps/v1
      kind: Deployment
      name: cilium-operator
      namespace: kube-system
    - apiVersion: apps/v1
      kind: Deployment
      name: cert-manager
      namespace: cert-manager
    - apiVersion: apps/v1
      kind: Deployment
      name: longhorn-driver-deployer
      namespace: longhorn-system
    - apiVersion: apps/v1
      kind: Deployment
      name: cloudnative-pg
      namespace: cnpg-system
    - apiVersion: apps/v1
      kind: Deployment
      name: valkey
      namespace: valkey-system
    - apiVersion: apps/v1
      kind: Deployment
      name: kube-prometheus-stack-grafana
      namespace: monitoring
    - apiVersion: apps/v1
      kind: Deployment
      name: reloader
      namespace: kube-system
    - apiVersion: apps/v1
      kind: DaemonSet
      name: spegel
      namespace: kube-system
    - apiVersion: apps/v1
      kind: StatefulSet
      name: loki
      namespace: loki-system
    - apiVersion: apps/v1
      kind: StatefulSet
      name: tempo
      namespace: tempo-system
    - apiVersion: apps/v1
      kind: Deployment
      name: trivy-operator
      namespace: trivy-system
    - apiVersion: apps/v1
      kind: Deployment
      name: kyverno-admission-controller
      namespace: kyverno-system
    - apiVersion: apps/v1
      kind: DaemonSet
      name: intel-gpu-plugin
      namespace: kube-system
    - apiVersion: apps/v1
      kind: Deployment
      name: cloudflare-tunnel
      namespace: cloudflare-tunnel
    - apiVersion: apps/v1
      kind: Deployment
      name: plugin-barman-cloud
      namespace: cnpg-system
    - apiVersion: apps/v1
      kind: StatefulSet
      name: rustfs
      namespace: rustfs

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-configs
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/configs
  prune: true
  wait: true
  dependsOn:
    - name: infrastructure-controllers
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
        optional: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cilium-gateway-internal-gateway
      namespace: kube-system
    - apiVersion: apps/v1
      kind: Deployment
      name: cilium-gateway-external-gateway
      namespace: kube-system

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps
  # This Kustomization now owns nothing but the 18 per-app Kustomizations. Beware when
  # moving resources out of it: pruning deletes whatever leaves its inventory, which is how
  # the random-gif pilot lost its Deployment and reinstalled its Helm release at v1. Set
  # prune: false for the reconcile that moves them, then turn it back on.
  prune: true
  wait: true
  dependsOn:
    - name: infrastructure-configs
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
        optional: true
  patches:
    # HelmRelease defaults, declared once instead of being repeated in every release.
    # `crds:` is deliberately absent: it is a per-chart decision (spegel and reloader use
    # Skip because their CRDs are managed elsewhere) and a patch would silently override
    # it. metadata.name is a placeholder — `target` is what selects.
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
      patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: _
        spec:
          install:
            remediation:
              retries: 3
          upgrade:
            cleanupOnFail: true
            remediation:
              retries: 3
              remediateLastFailure: true
          uninstall:
            keepHistory: false

    # Defaults for the per-app Kustomizations (the ks.yaml files). Each app declares only
    # its own `path`; the boilerplate below — including the HelmRelease patch again, since
    # a child Kustomization does its own build — is injected here.
    - target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: _
        spec:
          timeout: 15m
          retryInterval: 1m
          # interval, prune and sourceRef are absent on purpose: the CRD requires them, so
          # every ks.yaml declares them itself and keeps the freedom to differ.
          # wait: true replaces the per-app healthChecks this Kustomization used to carry:
          # Flux waits for every resource it applied, HelmReleases included, so a broken
          # app is reported as such instead of silently passing (AUDIT R4).
          wait: true
          dependsOn:
            - name: infrastructure-configs
          decryption:
            provider: sops
            secretRef:
              name: sops-age
          postBuild:
            substituteFrom:
              - kind: ConfigMap
                name: cluster-settings
              - kind: Secret
                name: cluster-secrets
                optional: true
          patches:
            - target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
              patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: _
                spec:
                  install:
                    remediation:
                      retries: 3
                  upgrade:
                    cleanupOnFail: true
                    remediation:
                      retries: 3
                      remediateLastFailure: true
                  uninstall:
                    keepHistory: false
