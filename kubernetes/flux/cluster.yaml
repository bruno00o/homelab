---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-vars
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/flux/vars
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-notifications
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/flux/notifications
  prune: true
  wait: true
  dependsOn:
    - name: cluster-vars
  decryption:
    provider: sops
    secretRef:
      name: sops-age

---
# Upstream CRDs, from their own source. Own Kustomization rather than a directory of
# infrastructure-controllers so a failed fetch blocks the CRDs alone instead of the 40-odd
# resources next to them. No postBuild: substitution must not run over a foreign repo.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: gateway-api
  path: ./config/crd/standard
  prune: true
  wait: true
  # Gateway API v1.6.1 graduated TLSRoute to v1 and stopped serving v1alpha2. Cilium 1.19.6
  # still asks the apiserver for `gateway.networking.k8s.io/v1alpha2, Kind=TLSRoute` when it
  # builds its Gateway API field indexer, so with v1alpha2 unserved cilium-operator refuses
  # to start at all: "no matches for kind TLSRoute". Nothing broke when the bump landed on
  # 2026-07-29 — a running operator keeps its open informers — and it only surfaced when the
  # nodes rebooted five days later, taking the operator down cluster-wide.
  # Re-serving the version costs nothing: all three share one schema, Gateway API declares
  # no conversion webhook, and v1 stays the storage version. This is a stopgap until Cilium
  # moves to 1.20, which reads TLSRoute at v1 — remove it then, not before.
  patches:
    - target:
        kind: CustomResourceDefinition
        name: tlsroutes.gateway.networking.k8s.io
      # The `test` op is the guard: a JSON6902 path is an index, and if upstream ever
      # reorders the versions this fails the Kustomization instead of quietly flipping
      # `served` on whichever version happens to sit at 1.
      patch: |
        - op: test
          path: /spec/versions/1/name
          value: v1alpha2
        - op: replace
          path: /spec/versions/1/served
          value: true

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-controllers
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/controllers
  prune: true
  # No healthChecks list here, and not by oversight: Flux ignores `.spec.healthChecks`
  # outright when `wait` is true. The 17 entries that used to sit below gated nothing, and
  # the proof they were never evaluated sat next to them — infrastructure-configs listed
  # two `cilium-gateway-*` Deployments that no longer exist (Cilium serves gateways from
  # the shared cilium-envoy DaemonSet) and its health check still reported success.
  #
  # Nor is anything lost by their absence, which is the part worth writing down: they were
  # redundant, not merely ignored. helm-controller waits for a release's resources to be
  # ready before reporting Ready, so a HelmRelease already implies its workloads. Measured
  # 2026-07-30 with a throwaway release pinned to a nonexistent image tag: the objects
  # applied cleanly and it still failed with `timeout waiting for: [Deployment/... status:
  # 'InProgress']`. Restoring the list would mean `wait: false`, which trades health checks
  # on every applied resource for health checks on a hand-written subset.
  wait: true
  dependsOn:
    - name: cluster-vars
    - name: gateway-api
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
        optional: true
  patches:
    # HelmRelease defaults, declared once instead of being repeated in every release.
    # `crds:` is deliberately absent: it is a per-chart decision (spegel and reloader use
    # Skip because their CRDs are managed elsewhere) and a patch would silently override
    # it. metadata.name is a placeholder — `target` is what selects.
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
      patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: _
        spec:
          install:
            remediation:
              retries: 3
          upgrade:
            cleanupOnFail: true
            remediation:
              retries: 3
              remediateLastFailure: true
          uninstall:
            keepHistory: false

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-configs
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/configs
  prune: true
  # Same as above: no healthChecks, `wait` makes Flux ignore them.
  wait: true
  dependsOn:
    - name: infrastructure-controllers
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
        optional: true

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps
  # This Kustomization now owns nothing but the 18 per-app Kustomizations. Beware when
  # moving resources out of it: pruning deletes whatever leaves its inventory, which is how
  # the random-gif pilot lost its Deployment and reinstalled its Helm release at v1. Set
  # prune: false for the reconcile that moves them, then turn it back on.
  prune: true
  wait: true
  dependsOn:
    - name: infrastructure-configs
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
        optional: true
  patches:
    # HelmRelease defaults, declared once instead of being repeated in every release.
    # `crds:` is deliberately absent: it is a per-chart decision (spegel and reloader use
    # Skip because their CRDs are managed elsewhere) and a patch would silently override
    # it. metadata.name is a placeholder — `target` is what selects.
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
      patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: _
        spec:
          install:
            remediation:
              retries: 3
          upgrade:
            cleanupOnFail: true
            remediation:
              retries: 3
              remediateLastFailure: true
          uninstall:
            keepHistory: false

    # Defaults for the per-app Kustomizations (the ks.yaml files). Each app declares only
    # its own `path`; the boilerplate below — including the HelmRelease patch again, since
    # a child Kustomization does its own build — is injected here.
    - target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: _
        spec:
          timeout: 15m
          retryInterval: 1m
          # interval, prune and sourceRef are absent on purpose: the CRD requires them, so
          # every ks.yaml declares them itself and keeps the freedom to differ.
          # wait: true replaces the per-app healthChecks this Kustomization used to carry:
          # Flux waits for every resource it applied, HelmReleases included, so a broken
          # app is reported as such instead of silently passing (AUDIT R4).
          wait: true
          dependsOn:
            - name: infrastructure-configs
          decryption:
            provider: sops
            secretRef:
              name: sops-age
          postBuild:
            substituteFrom:
              - kind: ConfigMap
                name: cluster-settings
              - kind: Secret
                name: cluster-secrets
                optional: true
          patches:
            - target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
              patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: _
                spec:
                  install:
                    remediation:
                      retries: 3
                  upgrade:
                    cleanupOnFail: true
                    remediation:
                      retries: 3
                      remediateLastFailure: true
                  uninstall:
                    keepHistory: false
