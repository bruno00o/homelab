---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-vars
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/flux/vars
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-notifications
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/flux/notifications
  prune: true
  wait: true
  dependsOn:
    - name: cluster-vars
  decryption:
    provider: sops
    secretRef:
      name: sops-age

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-controllers
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/controllers
  prune: true
  wait: true
  dependsOn:
    - name: cluster-vars
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
        optional: true
  patches:
    # HelmRelease defaults, declared once instead of being repeated in every release.
    # `crds:` is deliberately absent: it is a per-chart decision (spegel and reloader use
    # Skip because their CRDs are managed elsewhere) and a patch would silently override
    # it. metadata.name is a placeholder — `target` is what selects.
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
      patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: _
        spec:
          install:
            remediation:
              retries: 3
          upgrade:
            cleanupOnFail: true
            remediation:
              retries: 3
              remediateLastFailure: true
          uninstall:
            keepHistory: false
  healthChecks:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: cilium
      namespace: kube-system
    - apiVersion: apps/v1
      kind: Deployment
      name: cilium-operator
      namespace: kube-system
    - apiVersion: apps/v1
      kind: Deployment
      name: cert-manager
      namespace: cert-manager
    - apiVersion: apps/v1
      kind: Deployment
      name: longhorn-driver-deployer
      namespace: longhorn-system
    - apiVersion: apps/v1
      kind: Deployment
      name: cloudnative-pg
      namespace: cnpg-system
    - apiVersion: apps/v1
      kind: Deployment
      name: valkey
      namespace: valkey-system
    - apiVersion: apps/v1
      kind: Deployment
      name: kube-prometheus-stack-grafana
      namespace: monitoring
    - apiVersion: apps/v1
      kind: Deployment
      name: reloader
      namespace: kube-system
    - apiVersion: apps/v1
      kind: DaemonSet
      name: spegel
      namespace: kube-system
    - apiVersion: apps/v1
      kind: StatefulSet
      name: loki
      namespace: loki-system
    - apiVersion: apps/v1
      kind: StatefulSet
      name: tempo
      namespace: tempo-system
    - apiVersion: apps/v1
      kind: Deployment
      name: trivy-operator
      namespace: trivy-system
    - apiVersion: apps/v1
      kind: Deployment
      name: kyverno-admission-controller
      namespace: kyverno-system
    - apiVersion: apps/v1
      kind: DaemonSet
      name: intel-gpu-plugin
      namespace: kube-system
    - apiVersion: apps/v1
      kind: Deployment
      name: cloudflare-tunnel
      namespace: cloudflare-tunnel
    - apiVersion: apps/v1
      kind: Deployment
      name: plugin-barman-cloud
      namespace: cnpg-system
    - apiVersion: apps/v1
      kind: StatefulSet
      name: rustfs
      namespace: rustfs

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-configs
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/configs
  prune: true
  wait: true
  dependsOn:
    - name: infrastructure-controllers
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
        optional: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cilium-gateway-internal-gateway
      namespace: kube-system
    - apiVersion: apps/v1
      kind: Deployment
      name: cilium-gateway-external-gateway
      namespace: kube-system

---
