  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps
  prune: true
  wait: true
  dependsOn:
    - name: infrastructure-configs
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
        optional: true
  patches:
    # HelmRelease defaults, declared once instead of being repeated in every release.
    # `crds:` is deliberately absent: it is a per-chart decision (spegel and reloader use
    # Skip because their CRDs are managed elsewhere) and a patch would silently override
    # it. metadata.name is a placeholder — `target` is what selects.
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
      patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: _
        spec:
          install:
            remediation:
              retries: 3
          upgrade:
            cleanupOnFail: true
            remediation:
              retries: 3
              remediateLastFailure: true
          uninstall:
            keepHistory: false
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: adguard-home
      namespace: adguard
    - apiVersion: apps/v1
      kind: Deployment
      name: authentik-server
      namespace: authentik
    - apiVersion: apps/v1
      kind: Deployment
      name: authentik-worker
      namespace: authentik
    - apiVersion: apps/v1
      kind: Deployment
      name: mosquitto
      namespace: home-automation
    - apiVersion: apps/v1
      kind: Deployment
      name: frigate
      namespace: home-automation
    - apiVersion: apps/v1
      kind: Deployment
      name: homarr
      namespace: homarr
    - apiVersion: apps/v1
      kind: Deployment
      name: home-assistant
      namespace: home-automation
