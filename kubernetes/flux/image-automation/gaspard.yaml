# Releases only, as for ekineko.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: gaspard
  namespace: flux-system
spec:
  image: ghcr.io/bruno00o/gaspard
  interval: 5m
  secretRef:
    name: ghcr-pull
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: gaspard
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: gaspard
  policy:
    semver:
      range: ">=1.0.0"
