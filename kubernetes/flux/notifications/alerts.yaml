---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: flux-all
  namespace: flux-system
spec:
  providerRef:
    name: discord
  eventSeverity: info
  eventSources:
    - kind: Kustomization
      name: "*"
    - kind: HelmRelease
      name: "*"
    - kind: GitRepository
      name: "*"
  exclusionList:
    - ".*upgrade.*checksum.*"
    - ".*no changes.*"
    - "^Dependencies do not meet ready condition, retrying in.*"
    - "^unable to clone '.*': dial tcp: .*: server misbehaving$"
    - "^HelmChart '.*' is not ready$"
    # Drift detection runs in warn mode and would report the same drift at every
    # reconcile; each HelmRelease's Drifted condition carries it instead.
    - "^Cluster state of release .* has drifted from the desired state"
