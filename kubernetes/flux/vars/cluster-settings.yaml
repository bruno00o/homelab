---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  CLUSTER_DOMAIN: "merry.home.arpa"
  TIMEZONE: "Europe/Paris"
  DEFAULT_STORAGE_CLASS: "longhorn"
  CLUSTER_NAME: "going-merry"
  CLUSTER_VIP: "10.0.20.10"
  NODE_LUFFY: "10.0.20.11"
  NODE_ZORO: "10.0.20.12"
  NODE_NAMI: "10.0.20.13"
  NODE_USOPP: "10.0.20.14"
  NODE_SANJI: "10.0.20.15"
  NODE_CHOPPER: "10.0.20.16"
  LB_GATEWAY: "10.0.20.20"
  LB_ADGUARD: "10.0.20.24"
  LB_VALKEY: "10.0.20.27"
  LB_NTP: "10.0.20.28"
  LB_SEARXNG: "10.0.20.30"

  LB_POOL_START: "10.0.20.20"
  LB_POOL_END: "10.0.20.39"
  CLUSTER_ISSUER: "mugiwara-ca-issuer"
  NFS_BACKUP_TARGET: "nfs://10.0.20.51:/volume1/backups"
  # Three domains, on purpose — not a migration in progress.
  #   CLUSTER_DOMAIN   internal only, LAN, resolved by AdGuard
  #   PUBLIC_DOMAIN    family and personal apps published on the internet (immich, matrix,
  #                    home-assistant...), behind Authentik
  #   PROJECTS_DOMAIN  public projects, open to anyone (portfolio, aroma, doublons...)
  # Both public ones are served through the Cloudflare tunnel and managed by external-dns.
  # Beware the naming: PUBLIC_DOMAIN is the *less* open of the two.
  PUBLIC_DOMAIN: "seilliebert.app"
  PROJECTS_DOMAIN: "seilliebert.dev"
  CF_TUNNEL_HOSTNAME: "e314949b-7ce9-4ae0-aed6-eba2c82a8649.cfargotunnel.com"
  # The MatrixRTC SFU, the one service that cannot live in the cluster: WebRTC
  # media needs a public UDP range, which the tunnel does not carry.
  LIVEKIT_VM_IP: "51.15.252.124"
  # The LLM machine, outside the cluster: llama-swap serves an OpenAI-compatible API on
  # 8080, behind an API key.
  JINBE_IP: "10.0.20.50"
  # The Pi outside the cluster: secondary AdGuard, Thread and Matter, ser2net for the Zigbee dongle.
  FRANKY_IP: "10.0.20.17"
  # The Synology NAS outside the cluster: NFS for immich, frigate and the backups. A PersistentVolume cannot change server, so moving it means recreating them.
  ROBIN_IP: "10.0.20.51"
