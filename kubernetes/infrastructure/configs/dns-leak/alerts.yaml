---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dns-leak-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: dns-leak
      rules:
        # The Job exits non-zero on a leak and on a failed read, so one alert covers both.
        # Deliberately not distinguished: "the check found something" and "the check could
        # not run" both mean nobody knows whether something is exposed.
        - alert: PublicDnsLeakCheckFailed
          expr: kube_job_status_failed{namespace="monitoring", job_name=~"dns-leak-check.*"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Public DNS leak check failed"
            description: >-
              Job {{ $labels.job_name }} failed. Either a hostname resolves publicly
              without a Cloudflare tunnel entry, or a public record answers with a private
              address, or the check could not read the cluster. Run
              `task dns:leak-check` for the detail.

        # A CronJob that silently stops running looks exactly like one that keeps finding
        # nothing. 26 h covers the daily schedule plus a missed slot.
        #
        # Three clauses, because the staleness one alone is blind in the cases that matter
        # most: kube_cronjob_status_last_schedule_time only exists once the CronJob has run,
        # so a deleted or suspended CronJob produces no series at all and a single-clause
        # alert would stay silent forever. Deliberately not using absent() on the schedule
        # metric — it would fire between deploying this and the first run.
        - alert: PublicDnsLeakCheckStale
          expr: >-
            time() - kube_cronjob_status_last_schedule_time{namespace="monitoring", cronjob="dns-leak-check"} > 26 * 3600
            or absent(kube_cronjob_info{namespace="monitoring", cronjob="dns-leak-check"})
            or kube_cronjob_spec_suspend{namespace="monitoring", cronjob="dns-leak-check"} == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Public DNS leak check is not running"
            description: >-
              dns-leak-check has not run in over 26 hours, or the CronJob is gone or
              suspended. Nothing is verifying public exposure.
