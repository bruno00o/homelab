apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac.yaml
  - cronjob.yaml
  - network-policies.yaml
  - alerts.yaml

# No global `namespace:`: rbac.yaml deliberately puts a Role and RoleBinding in
# cloudflare-tunnel, and the transformer would move them to monitoring.

# The script is embedded from the file next to this one rather than pasted into a ConfigMap
# literal, so `task dns:leak-check` and the CronJob run the same bytes. The name hash makes
# a change to the script roll the CronJob's pod template on its own.
configMapGenerator:
  - name: dns-leak-script
    namespace: monitoring
    files:
      - dns-leak.sh
    options:
      annotations:
        # Without this the promise above is false: Flux's postBuild substitution reads
        # `${...}` inside the script too, and it was collapsing `${RESOLVER:-1.1.1.1}` to
        # `RESOLVER="1.1.1.1"` at build time. The deployed bytes differed from the repo's,
        # and the documented RESOLVER override did nothing in the CronJob.
        kustomize.toolkit.fluxcd.io/substitute: disabled
