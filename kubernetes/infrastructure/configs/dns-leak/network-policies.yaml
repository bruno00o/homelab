---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-leak-check-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dns-leak-check
  policyTypes: [Egress]
  egress:
    # The public resolver is the whole point: CoreDNS applies the split-horizon rewrites,
    # so asking it would return the internal view and the check would never see a leak.
    - to:
        - ipBlock:
            cidr: 1.1.1.1/32
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Cluster DNS, to resolve the apiserver Service name.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # The apiserver is the CiliumNetworkPolicy below: a bare `port: 6443` has no
    # destination, so it means every host on the internet that happens to listen there.

---
# Reads the DNSEndpoints and HTTPRoutes it checks.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns-leak-check-apiserver-egress
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: dns-leak-check
  egress:
    - toEntities:
        - kube-apiserver
