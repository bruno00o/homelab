---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dns-leak-check
  namespace: monitoring
automountServiceAccountToken: true

---
# Read-only, and only the two things the check needs: the hostnames the cluster serves,
# and the list the Cloudflare tunnel actually publishes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dns-leak-check
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dns-leak-check
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dns-leak-check
subjects:
  - kind: ServiceAccount
    name: dns-leak-check
    namespace: monitoring

---
# In cloudflare-tunnel rather than monitoring, and named: a ClusterRole on configmaps would
# hand this ServiceAccount every ConfigMap in the cluster for one file.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dns-leak-check
  namespace: cloudflare-tunnel
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cloudflare-tunnel-config"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dns-leak-check
  namespace: cloudflare-tunnel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dns-leak-check
subjects:
  - kind: ServiceAccount
    name: dns-leak-check
    namespace: monitoring
