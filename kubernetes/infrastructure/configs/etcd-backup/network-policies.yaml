# apid on the control planes, through the talos.default Service. Node addresses are not CIDR
# identities to Cilium, so an ipBlock would not match them.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-talos-api-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: etcd-backup
  egress:
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "50000"
              protocol: TCP
