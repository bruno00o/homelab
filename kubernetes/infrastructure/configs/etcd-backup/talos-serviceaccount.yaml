# Talos answers with a Secret of the same name holding a talosconfig for these roles only.
# Both the role and the namespace must be allowed by KubeTalosAPIAccessConfig on the control
# planes, or Talos refuses it.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-backup
spec:
  roles:
    - os:etcd:backup
