---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: flux
      rules:
        # The Flux events that reach Discord say what happened at one reconcile; this says
        # that something has stayed broken. Not Ready also covers a reconcile stuck in
        # progress, which never emits a failure event at all.
        - alert: FluxResourceNotReady
          expr: max by (customresource_kind, exported_namespace, name) (gotk_resource_info{ready!="True", suspended!="true"}) == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Flux resource not ready"
            description: "{{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} has not been Ready for 30 minutes."

        # Nothing else would notice: a suspended Kustomization or HelmRelease stops being
        # reconciled without failing, and is easy to forget after an intervention.
        - alert: FluxResourceSuspended
          expr: max by (customresource_kind, exported_namespace, name) (gotk_resource_info{suspended="true"}) == 1
          for: 24h
          labels:
            severity: info
          annotations:
            summary: "Flux resource suspended for a day"
            description: "{{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} has been suspended for more than 24 hours."
