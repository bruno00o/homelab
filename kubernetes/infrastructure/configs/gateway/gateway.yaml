---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal-gateway
  namespace: kube-system
spec:
  # The address has to be requested by the Gateway API field, not by an annotation. Cilium
  # dropped this into `spec.infrastructure.annotations` for a while and deprecates that path
  # since 1.20; a Gateway's own `metadata.annotations` never worked at all, since Cilium does
  # not copy them onto the Service it generates — LB-IPAM then serves the next free address
  # from the pool and nothing says so. The whole LAN resolves here, so it must not drift.
  addresses:
    - type: IPAddress
      value: ${LB_GATEWAY}
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    # Wildcard listener for the perso/family domain ${PUBLIC_DOMAIN}. Serves the
    # LAN split-horizon for *.seilliebert.app (AdGuard rewrites the hostnames to
    # LB_GATEWAY) using the LE wildcard cert; the external path bypasses the
    # gateway and goes via cloudflared tunnel directly to services.
    - name: https-app-wildcard
      protocol: HTTPS
      port: 443
      hostname: "*.${PUBLIC_DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-seilliebert-app-tls
            namespace: kube-system
      allowedRoutes:
        namespaces:
          from: All
    # One listener for every internal hostname. An app attaches to it with
    # `sectionName: https-internal-wildcard` and needs no Certificate of its own, and no
    # ReferenceGrant either since the secret lives here in kube-system.
    - name: https-internal-wildcard
      protocol: HTTPS
      port: 443
      hostname: "*.${CLUSTER_DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-internal-tls
            namespace: kube-system
      allowedRoutes:
        namespaces:
          from: All
    - name: http-ca-portal
      protocol: HTTP
      port: 80
      hostname: ca.${CLUSTER_DOMAIN}
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: internal-http-to-https-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: internal-gateway
      namespace: kube-system
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
