---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal-gateway
  namespace: kube-system
  annotations:
    io.cilium/lb-ipam-ips: ${LB_GATEWAY}
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    # Wildcard listener for the perso/family domain ${PUBLIC_DOMAIN}. Serves the
    # LAN split-horizon for *.seilliebert.app (AdGuard rewrites the hostnames to
    # LB_GATEWAY) using the LE wildcard cert; the external path bypasses the
    # gateway and goes via cloudflared tunnel directly to services.
    - name: https-app-wildcard
      protocol: HTTPS
      port: 443
      hostname: "*.${PUBLIC_DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-seilliebert-app-tls
            namespace: kube-system
      allowedRoutes:
        namespaces:
          from: All
    # One listener for every internal hostname. An app attaches to it with
    # `sectionName: https-internal-wildcard` and needs no Certificate of its own, and no
    # ReferenceGrant either since the secret lives here in kube-system.
    - name: https-internal-wildcard
      protocol: HTTPS
      port: 443
      hostname: "*.${CLUSTER_DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-internal-tls
            namespace: kube-system
      allowedRoutes:
        namespaces:
          from: All
    - name: http-ca-portal
      protocol: HTTP
      port: 80
      hostname: ca.${CLUSTER_DOMAIN}
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external-gateway
  namespace: kube-system
  annotations:
    # Measured 2026-07-30: this does not work. Cilium does not copy the annotation onto the
    # Service it generates for a Gateway — `cilium-gateway-external-gateway` carries no
    # annotations at all — so LB-IPAM ignores the request and serves the next free address
    # from the pool. The Service holds 10.0.20.21 while this asks for .23. Harmless today
    # (the tunnel targets ClusterIPs and LAN DNS points at the internal gateway), but do
    # not trust this address: `task inventory` reports the mismatch.
    io.cilium/lb-ipam-ips: ${LB_EXTERNAL_GATEWAY}
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    # Same wildcard as the internal gateway: the tunnel serves internal hostnames too.
    - name: https-internal-wildcard
      protocol: HTTPS
      port: 443
      hostname: "*.${CLUSTER_DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-internal-tls
            namespace: kube-system
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: internal-http-to-https-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: internal-gateway
      namespace: kube-system
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-http-to-https-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: external-gateway
      namespace: kube-system
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
