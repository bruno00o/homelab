---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-daily
  namespace: longhorn-system
spec:
  name: backup-daily
  task: backup
  cron: "0 2 * * *"
  # Same mechanism as the hourly snapshots below: the store keeps every block overwritten
  # since the oldest retained backup, so a volume that rewrites itself pays for the window
  # covered, not for what it holds. Shortened to the range actually worth restoring to.
  # Surplus backups are pruned on the job's next run, not when this is applied.
  retain: 14
  concurrency: 2
  groups:
    - default
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-hourly
  namespace: longhorn-system
spec:
  name: snapshot-hourly
  task: snapshot
  cron: "0 * * * *"
  # Retention here is a time span, not a count. A Longhorn chain keeps every block overwritten
  # since its oldest snapshot, so a volume that rewrites its whole dataset periodically — a
  # cache flushing to disk, a database checkpointing — pays for the retained span, not for the
  # data it holds. Keeping a day of it made replica rebuilds copy that history on every node
  # reboot, which is what makes a Talos upgrade wait on Longhorn. The daily backup covers
  # anything older; what this window is for is same-day rollback.
  retain: 6
  concurrency: 2
  groups:
    - default
