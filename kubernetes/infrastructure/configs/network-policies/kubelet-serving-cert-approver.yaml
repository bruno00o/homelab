---
# Installed by a Talos extraManifest, so its policies cannot live next to its manifests.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: kubelet-serving-cert-approver
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: kubelet-serving-cert-approver
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# It only talks to the apiserver: it watches kubelet CSRs and approves them.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-apiserver-egress
  namespace: kubelet-serving-cert-approver
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kubelet-serving-cert-approver
  egress:
    - toEntities:
        - kube-apiserver
