---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-egress-scrape
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 9090 # Prometheus / Spegel
        - protocol: TCP
          port: 9091 # Pushgateway
        - protocol: TCP
          port: 9093 # Alertmanager
        - protocol: TCP
          port: 9100 # Node exporter
        - protocol: TCP
          port: 9153 # CoreDNS
        - protocol: TCP
          port: 9187 # PostgreSQL exporter
        - protocol: TCP
          port: 9300 # Authentik
        - protocol: TCP
          port: 8080 # Various apps
        - protocol: TCP
          port: 8443 # Various apps HTTPS
        - protocol: TCP
          port: 2381 # etcd metrics
        - protocol: TCP
          port: 6379 # Valkey
        - protocol: TCP
          port: 9121 # Valkey metrics exporter
        - protocol: TCP
          port: 9402 # cert-manager
        - protocol: TCP
          port: 8081 # Longhorn
        - protocol: TCP
          port: 9500 # Longhorn manager
        - protocol: TCP
          port: 8000 # Kyverno metrics
        - protocol: TCP
          port: 9962 # Cilium agent
        - protocol: TCP
          port: 9963 # Cilium operator
        - protocol: TCP
          port: 9965 # Hubble
        - protocol: TCP
          port: 10250 # Kubelet metrics
        - protocol: TCP
          port: 3101 # Promtail metrics
        - protocol: TCP
          port: 3200 # Tempo
        - protocol: TCP
          port: 2000 # cloudflared metrics
    # Kubernetes API for service discovery: the CiliumNetworkPolicy at the end of this
    # file. Ports with no `to:` read as "to anywhere", so this block allowed the internet.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.20.0/24
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - protocol: TCP
          port: 9093
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9443
    # The apiserver - what the dashboard and datasource sidecars watch - is at the end of
    # this file. It used to be a `ports: 443, 6443` block with no destination, i.e. the
    # internet. Grafana needs nothing outside the cluster: its OAuth back-channel calls go
    # to authentik above, and no plugin is installed at runtime.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: loki-system
      ports:
        - protocol: TCP
          port: 3100
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tempo-system
      ports:
        - protocol: TCP
          port: 3200
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-monitoring
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alertmanager-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 587 # SMTP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-operator-webhook-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 10250
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-gateway-proxy-ingress
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
# Apiserver egress for everything in this namespace that talks to it: Prometheus for
# service discovery, kube-state-metrics for its whole dataset, the operator for the CRs it
# reconciles, Grafana's sidecars for the dashboard and datasource ConfigMaps, and the
# chart's Helm hook Jobs. Five NetworkPolicies used to say this with `ports: 443, 6443` and
# no `to:` - which is not the apiserver, it is every host on the internet. Only Cilium can
# name it: the apiserver is reached through a ClusterIP that DNATs to host-network
# endpoints, which no ipBlock can express.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-apiserver-egress
  namespace: monitoring
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
