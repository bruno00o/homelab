---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: policy-drift-check
spec:
  # Half an hour after dns-leak-check, so the two do not report at the same minute.
  schedule: "43 6 * * *"
  timeZone: ${TIMEZONE}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  # Kept at 3: the alert watches for a failed Job object, so deleting failures promptly
  # would clear the alert before anyone read it.
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A workload that violates a policy will violate it again on the next try. Retries
      # are here for a transient apiserver read, not to soften a finding.
      backoffLimit: 2
      template:
        metadata:
          # Selected by allow-policy-drift-egress; without it the pod falls under the
          # namespace default-deny and cannot reach the apiserver.
          labels:
            app.kubernetes.io/name: policy-drift
        spec:
          restartPolicy: Never
          serviceAccountName: policy-drift
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              # renovate: datasource=docker depName=alpine/k8s
              image: docker.io/alpine/k8s:1.37.0
              command: ["sh", "/opt/policy-drift.sh"]
              env:
                # kubectl writes its discovery cache under $HOME.
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: script
                  mountPath: /opt
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: policy-drift-script
            - name: tmp
              emptyDir: {}
