---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-policy-drift-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: policy-drift
  policyTypes: [Egress]
  egress:
    # Cluster DNS, to resolve the apiserver Service name.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # The apiserver, the only thing this check reads.
    - ports:
        - { protocol: TCP, port: 6443 }
