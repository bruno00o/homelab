---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: policy-drift
  namespace: monitoring
automountServiceAccountToken: true

---
# Read-only. pods/replicasets/jobs are read to walk a failing pod up to its controller:
# keying the accepted list on pod names would rot it at every rollout, so the check needs
# the Deployment, DaemonSet or CronJob behind the pod.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: policy-drift
rules:
  - apiGroups: ["wgpolicyk8s.io"]
    resources: ["policyreports"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: policy-drift
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: policy-drift
subjects:
  - kind: ServiceAccount
    name: policy-drift
    namespace: monitoring
