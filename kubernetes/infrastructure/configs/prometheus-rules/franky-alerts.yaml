apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: franky-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: franky
      rules:
        - alert: FrankyDown
          expr: up{job="franky"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Franky is down"
            description: "The Pi stopped answering. Zigbee, Thread, Matter and the secondary DNS all run on it."

        # A quick reboot never reaches FrankyDown's `for`.
        - alert: FrankyRebooted
          expr: node_time_seconds{job="franky"} - node_boot_time_seconds{job="franky"} < 3600
          labels:
            severity: warning
          annotations:
            summary: "Franky rebooted"
            description: "The Pi restarted less than an hour ago. If nobody did that, read its journal."

        - alert: FrankyServiceDown
          expr: node_systemd_unit_state{job="franky", name=~"docker.service|ser2net.service", state="active"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Service down on Franky"
            description: "{{ $labels.name }} is not active on the Pi."

        # The script writes this timestamp last, so a failed run leaves it to go stale. absent()
        # covers a metric that disappeared, which is also what a lost disk looks like.
        - alert: FrankyBackupStale
          expr: >-
            time() - franky_backup_last_success_timestamp_seconds > 26 * 3600
            or absent(franky_backup_last_success_timestamp_seconds)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "No recent Franky backup"
            description: "No archive has reached the NAS in over 26 hours. Run `journalctl -u franky-backup` on the Pi."
