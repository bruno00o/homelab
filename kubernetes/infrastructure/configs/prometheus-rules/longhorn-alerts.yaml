apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: longhorn-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: longhorn
      rules:
        # Volume health alerts
        - alert: LonghornVolumeDegraded
          expr: longhorn_volume_robustness == 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume degraded"
            description: "Volume {{ $labels.volume }} is degraded (insufficient replicas)."

        - alert: LonghornVolumeFaulted
          expr: longhorn_volume_robustness == 3
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn volume faulted"
            description: "Volume {{ $labels.volume }} has faulted (no healthy replicas). Data loss risk!"

        # Node health alerts
        - alert: LonghornNodeDown
          expr: longhorn_node_status{condition="ready"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn node unavailable"
            description: "Node {{ $labels.node }} is no longer available for Longhorn storage."

        # Storage alerts
        - alert: LonghornNodeStorageFull
          expr: (longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes) * 100 > 85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn storage almost full"
            description: "Node {{ $labels.node }} is using {{ $value | printf \"%.1f\" }}% of its Longhorn storage capacity."

        - alert: LonghornNodeStorageCritical
          expr: (longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes) * 100 > 95
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn storage critical"
            description: "Node {{ $labels.node }} is using {{ $value | printf \"%.1f\" }}% of storage. Immediate action required!"

        # The job fails if any volume fails, so its last success covers them all.
        - alert: LonghornBackupStale
          expr: >-
            time() - kube_cronjob_status_last_successful_time{namespace="longhorn-system", cronjob="backup-daily"} > 26 * 3600
            or absent(kube_cronjob_status_last_successful_time{namespace="longhorn-system", cronjob="backup-daily"})
            or kube_cronjob_spec_suspend{namespace="longhorn-system", cronjob="backup-daily"} == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "No recent Longhorn backup"
            description: >-
              The backup-daily job has not succeeded in over 26 hours, or the CronJob is gone or
              suspended. Read the last job's log in longhorn-system and check the NAS.

        - alert: LonghornBackupTargetUnavailable
          expr: max(longhorn_backup_target_status{condition="unavailable"}) == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn cannot reach its backup target"
            description: "Longhorn reports its backup target as unavailable. Check the NAS and its NFS export."
