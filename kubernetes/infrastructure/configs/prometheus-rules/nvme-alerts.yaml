apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nvme-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: nvme
      rules:
        # The drive's own verdict: spare, temperature, reliability or read-only mode.
        - alert: NvmeCriticalWarning
          expr: smartctl_device_critical_warning != 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "NVMe drive reports a critical warning"
            description: "{{ $labels.device }} on {{ $labels.node }} reports critical warning {{ $value }}. Plan its replacement."
        - alert: NvmeMediaErrors
          expr: smartctl_device_media_errors > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "NVMe drive has media errors"
            description: "{{ $labels.device }} on {{ $labels.node }} has {{ $value }} media errors. Data was unreadable: check the volumes on this node."
        - alert: NvmeWearHigh
          expr: smartctl_device_percentage_used >= 80
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "NVMe drive is nearing its rated endurance"
            description: "{{ $labels.device }} on {{ $labels.node }} has used {{ $value }}% of its rated endurance."
        - alert: NvmeTemperatureHigh
          expr: smartctl_device_temperature{temperature_type="current"} > 70
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "NVMe drive is running hot"
            description: "{{ $labels.device }} on {{ $labels.node }} has been at {{ $value }}°C for 30 minutes."
        # Otherwise a dead exporter reads as healthy drives.
        - alert: NvmeSmartDataMissing
          expr: >-
            count(smartctl_device_percentage_used) < count(kube_node_info)
            or absent(smartctl_device_percentage_used)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "SMART data is missing for some nodes"
            description: "smartctl-exporter does not report a drive on every node. Check its pods and the monitoring network policy."
