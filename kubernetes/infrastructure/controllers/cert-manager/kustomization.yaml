apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrelease.yaml
  # issuers.yaml is deliberately not listed here: `namespace:` below would stamp
  # cert-manager onto four cluster-scoped ClusterIssuers. It is pulled in one level up, by
  # controllers/kustomization.yaml, which applies no namespace transformer.
  - mugiwara-ca-secret.sops.yaml
  - cloudflare-api-token.sops.yaml
  - network-policies.yaml
components:
  - ../../../components/network-policies/base
  - ../../../components/network-policies/apiserver-egress
namespace: cert-manager
