apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  timeout: 15m

  chartRef:
    kind: OCIRepository
    name: cilium
    namespace: flux-system

  install:
    crds: CreateReplace

  upgrade:
    crds: CreateReplace

  values:
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    ipam:
      mode: kubernetes
    k8sServiceHost: localhost
    k8sServicePort: 7445
    kubeProxyReplacement: true
    socketLB:
      enabled: true
    hostServices:
      enabled: true
    l2announcements:
      enabled: true
    l2podAnnouncements:
      enabled: true
      interfacePattern: enp.*
    externalIPs:
      enabled: true
    devices: enp+
    bpf:
      vlanBypass:
        - 0
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        # Tells the chart the Prometheus Operator CRDs are present at runtime.
        # Required for flux-local (CI rendering without a real cluster).
        trustCRDsExist: true

    operator:
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
          trustCRDsExist: true
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi

    envoyConfig:
      enabled: true

    gatewayAPI:
      enabled: true

    hubble:
      enabled: true
      metrics:
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - icmp
          - http
        serviceMonitor:
          enabled: true
          trustCRDsExist: true
      relay:
        enabled: true
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
      ui:
        enabled: true
        # Per container and not under `ui` directly: the chart has no `hubble.ui.resources`,
        # only `frontend` and `backend`. Written one level up it was accepted in silence and
        # both containers ran with `resources: {}`. `hubble.relay.resources` just above does
        # exist, which is what made the mistake look like it worked.
        frontend:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        backend:
          # Higher than the frontend: it holds the flows it pulls from relay while a service
          # map is open, where the frontend is only an nginx serving static assets.
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
