apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflare-tunnel-config
  namespace: cloudflare-tunnel
data:
  config.yaml: |
    tunnel: e314949b-7ce9-4ae0-aed6-eba2c82a8649
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true

    # Nothing here can be tested by curling a ${PUBLIC_DOMAIN} hostname from the LAN: the
    # AdGuard split-horizon answers with the gateway address, so the request never leaves
    # the house and cloudflared never sees it. It looks like a successful external check —
    # same hostname, same 200 — and it measures the wrong path entirely. Force the edge
    # (`curl --resolve <host>:443:<cloudflare-ip>`) and confirm the reply carries
    # `server: cloudflare` rather than `server: envoy`.
    ingress:
      - hostname: auth.${PUBLIC_DOMAIN}
        service: http://authentik-server.authentik.svc.cluster.local:80
      - hostname: home-assistant.${PUBLIC_DOMAIN}
        service: http://home-assistant.home-automation.svc.cluster.local:8123
      - hostname: homarr.${PUBLIC_DOMAIN}
        service: http://homarr.homarr.svc.cluster.local:7575
      - hostname: random-gif.${PROJECTS_DOMAIN}
        service: http://random-gif.random-gif.svc.cluster.local:8080
      - hostname: umami.${PROJECTS_DOMAIN}
        service: http://umami.umami.svc.cluster.local:3000
      - hostname: aroma.${PROJECTS_DOMAIN}
        service: http://aroma-app.aroma.svc.cluster.local:3000
      - hostname: pb-aroma.${PROJECTS_DOMAIN}
        service: http://aroma-pocketbase.aroma.svc.cluster.local:8090
      - hostname: gaspard-mcp.${PROJECTS_DOMAIN}
        service: http://mcp.gaspard.svc.cluster.local:8000
        originRequest:
          httpHostHeader: localhost:8000
      - hostname: bruno.${PROJECTS_DOMAIN}
        service: http://portfolio.portfolio.svc.cluster.local:8080
      - hostname: doublons.${PROJECTS_DOMAIN}
        service: http://doublons.doublons.svc.cluster.local:3000
      - hostname: immich.${PUBLIC_DOMAIN}
        service: http://immich-server.immich.svc.cluster.local:2283
      - hostname: matrix.${PUBLIC_DOMAIN}
        service: http://synapse.matrix.svc.cluster.local:8008
      - hostname: mas.${PUBLIC_DOMAIN}
        service: http://mas.matrix.svc.cluster.local:8080
      - hostname: element.${PUBLIC_DOMAIN}
        service: http://element.matrix.svc.cluster.local:80
      - hostname: matrix-rtc.${PUBLIC_DOMAIN}
        service: http://lk-jwt-service.matrix.svc.cluster.local:8080
      - hostname: dawarich.${PUBLIC_DOMAIN}
        service: http://dawarich.dawarich.svc.cluster.local:3000
      # Two legs on one hostname: the VoIP ring called by kazimod, and the Matrix push
      # gateway Synapse posts to for messages.
      - hostname: ring.${PUBLIC_DOMAIN}
        service: http://ring.kazimo.svc.cluster.local:8089
      # /admin has to die here and nowhere else. The tunnel routes straight to the Service,
      # so it never crosses the gateway and no HTTPRoute filter can see this traffic; the
      # rules are first-match-wins, so a 404 rule has to precede its own catch-all. Both
      # pages stay reachable on ${CLUSTER_DOMAIN}, which is LAN-only.
      - hostname: vaultwarden.${PUBLIC_DOMAIN}
        path: ^/admin
        service: http_status:404
      - hostname: vaultwarden.${PUBLIC_DOMAIN}
        service: http://vaultwarden.vaultwarden.svc.cluster.local:80
      # Django's own admin, and the only login Paperless leaves open once
      # PAPERLESS_DISABLE_REGULAR_LOGIN is set — so the local superuser's password is
      # never offered to the internet.
      - hostname: paperless.${PUBLIC_DOMAIN}
        path: ^/admin
        service: http_status:404
      - hostname: paperless.${PUBLIC_DOMAIN}
        service: http://paperless.paperless.svc.cluster.local:8000
      - service: http_status:404
