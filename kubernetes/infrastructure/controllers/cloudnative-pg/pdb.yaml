apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  # 1, not 0: maxUnavailable: 0 forbids every voluntary eviction, so `kubectl drain`
  # blocks forever.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
