---
# Leader election and watching CRs, i.e. the apiserver and nothing else. Label-scoped
# because cnpg-system also holds the operator, so the shared apiserver-egress component
# (which selects every pod in its namespace) does not apply. A CiliumNetworkPolicy because
# the apiserver is only reachable as an entity: the standard policy this replaces named
# ports 443 and 6443 with no destination, which is every host on the internet.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-barman-plugin-apiserver-egress
  namespace: cnpg-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: plugin-barman-cloud
  egress:
    - toEntities:
        - kube-apiserver
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-barman-plugin-ingress
  namespace: cnpg-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: plugin-barman-cloud
  policyTypes:
    - Ingress
  ingress:
    # gRPC from CNPG operator
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 9090
