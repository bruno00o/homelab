apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 30m
  timeout: 10m

  chart:
    spec:
      chart: external-dns
      version: "1.21.1"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      interval: 1h

  install:
    crds: CreateReplace

  upgrade:
    crds: CreateReplace

  values:
    fullnameOverride: external-dns

    provider:
      name: cloudflare

    sources:
      - crd

    policy: sync

    txtOwnerId: going-merry
    txtPrefix: "_externaldns."

    domainFilters:
      - ${PROJECTS_DOMAIN}
      - ${PUBLIC_DOMAIN}

    extraArgs:
      - --cloudflare-proxied

    interval: 1m
    triggerLoopOnEvent: true

    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: api-token

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65534
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault

    podSecurityContext:
      fsGroup: 65534
      runAsNonRoot: true
      runAsUser: 65534

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

    # external-dns is the sole writer of the public records, and it fails silently: an
    # expired Cloudflare token leaves the pod Running and Ready while every reconcile
    # errors, so hostnames drift with nothing to say so. Scraped like every other
    # controller, external_dns_registry_errors_total can carry an alert.
    serviceMonitor:
      enabled: true
