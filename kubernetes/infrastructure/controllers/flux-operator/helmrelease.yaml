---
# Runs Flux through kubernetes/flux/flux-instance.yaml, and serves its web UI. Installed by
# bootstrap/helmfile.yaml before Flux exists, then adopted here.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: flux-operator
    namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: flux-web-oidc
      valuesKey: client-secret
      targetPath: web.config.authentication.oauth2.clientSecret
  values:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 512Mi
    web:
      config:
        baseURL: https://flux.${CLUSTER_DOMAIN}
        authentication:
          type: OAuth2
          oauth2:
            provider: OIDC
            clientID: flux-web
            issuerURL: https://auth.${PUBLIC_DOMAIN}/application/o/flux/
            autoLogin: true
