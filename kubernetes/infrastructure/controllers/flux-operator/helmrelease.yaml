---
# flux-operator for its web UI only. No FluxInstance exists, so it does not manage Flux:
# it reads the bootstrap-installed controllers and reports on them. A FluxInstance would
# take Flux over, and deleting it would then uninstall Flux, CRDs and objects included.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: flux-operator
    namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: flux-web-oidc
      valuesKey: client-secret
      targetPath: web.config.authentication.oauth2.clientSecret
  values:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 512Mi
    web:
      config:
        baseURL: https://flux.${CLUSTER_DOMAIN}
        authentication:
          type: OAuth2
          oauth2:
            provider: OIDC
            clientID: flux-web
            issuerURL: https://auth.${PUBLIC_DOMAIN}/application/o/flux/
            autoLogin: true
