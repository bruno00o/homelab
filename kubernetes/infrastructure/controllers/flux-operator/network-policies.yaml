---
# flux-system only admits traffic from its own namespace, plus metrics and webhooks. The
# chart's own policy opens the UI port to in-cluster pods; the gateway needs these two.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-flux-web-from-gateway
  namespace: flux-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flux-operator
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.0.20.0/24 }
      ports:
        - { protocol: TCP, port: 9080 }

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-flux-web-gateway-proxy
  namespace: flux-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: flux-operator
  ingress:
    - fromEntities: [ingress]
      toPorts:
        - ports:
            - { port: "9080", protocol: TCP }
