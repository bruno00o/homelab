---
# The UI acts as the signed-in user (impersonation), with the groups from the Authentik
# token: this binding is what lets the homelab admins reconcile and suspend from it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-web-homelab-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-web-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: homelab-admins
