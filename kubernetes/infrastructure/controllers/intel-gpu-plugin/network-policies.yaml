---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: intel-gpu-plugin-deny-ingress
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: intel-gpu-plugin
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: intel-gpu-plugin-allow-dns-egress
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: intel-gpu-plugin
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Label-scoped because kube-system is shared, so the apiserver-egress component (which
# selects every pod in its namespace) does not apply. The plugin talks to the apiserver and
# to nothing else; its predecessor opened 443 to the whole internet.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: intel-gpu-plugin-allow-apiserver-egress
  namespace: kube-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: intel-gpu-plugin
  egress:
    - toEntities:
        - kube-apiserver
