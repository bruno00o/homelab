apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privilege-escalation
  annotations:
    policies.kyverno.io/title: Disallow Privilege Escalation
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: privilege-escalation
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno-system
                - longhorn-system
                - cilium
                - trivy-system
                - authentik
                - monitoring
      validate:
        message: "Privilege escalation is not allowed."
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
            # `=()` is Kyverno's "validate only if present" anchor - most pods have no init
            # containers, and a bare `initContainers:` would reject every one of them. Without
            # this block the rule saw `containers` alone: frigate's copyconfig ran with an
            # unset allowPrivilegeEscalation under an Enforce policy, and the audit mirror,
            # sharing the same pattern, reported the cluster clean.
            # ephemeralContainers is deliberately not covered: it would break `kubectl debug`,
            # which is a human action on an already-running pod, not a deployed workload.
            =(initContainers):
              - securityContext:
                  allowPrivilegeEscalation: false
