apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The four enforced policies. Kept in their own directory so audit/ can build a mirror of
# them from the same files instead of a copy — kustomize refuses to load a file above an
# overlay's root, but a sibling kustomization is fair game.
resources:
  - disallow-latest-tag.yaml
  - require-resource-limits.yaml
  - disallow-privilege-escalation.yaml
  - restrict-registries.yaml
