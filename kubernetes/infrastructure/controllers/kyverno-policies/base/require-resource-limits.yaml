apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Memory Limits and CPU Requests
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Memory is not compressible: without a limit one container can drive a node into
      OOM and take its neighbours with it, so a memory limit is required.
      CPU is compressible. A CPU limit does not protect anything — the scheduler already
      shares CPU by requests — it only throttles the container once it reaches the cap,
      even on an idle node. Measured on this cluster over 7 days: 17 pods throttled above
      5%, matrix/element at 78%, the cert-manager webhook at 6%, and the trivy scan jobs
      above 99%. A CPU request is therefore required, a CPU limit is not.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno-system
                - longhorn-system
                - monitoring
                - trivy-system
      validate:
        message: "A memory limit and a CPU request are required (CPU limits are not, they only throttle)."
        pattern:
          spec:
            containers:
              - resources:
                  limits:
                    memory: "?*"
                  requests:
                    cpu: "?*"
                    memory: "?*"
            # `=()` validates only when the key is present: most pods have no init containers.
            # An init container is short-lived but not free - it can still drive a node into
            # OOM while it runs. Two charts hardcode one with no resources and expose no value
            # for it (frigate, home-assistant); both are given resources by a postRenderer on
            # their HelmRelease rather than exempted here.
            =(initContainers):
              - resources:
                  limits:
                    memory: "?*"
                  requests:
                    cpu: "?*"
                    memory: "?*"
