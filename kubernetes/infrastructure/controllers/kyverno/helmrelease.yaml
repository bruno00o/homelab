apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno-system
spec:
  interval: 30m
  timeout: 15m

  dependsOn:
    - name: cilium
      namespace: kube-system

  chartRef:
    kind: OCIRepository
    name: kyverno
    namespace: flux-system

  install:
    crds: CreateReplace

  upgrade:
    crds: CreateReplace

  values:
    admissionController:
      # 2, not 1: the resource webhook is failurePolicy: Fail, so while this pod is
      # unavailable every matching resource creation is rejected cluster-wide — which
      # happens on each node reboot. See AUDIT.md R9.
      # The chart already sets a preferred podAntiAffinity, so both replicas spread.
      replicas: 2
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

    backgroundController:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 256Mi

    cleanupController:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 256Mi

    reportsController:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 256Mi

    serviceMonitor:
      enabled: true
