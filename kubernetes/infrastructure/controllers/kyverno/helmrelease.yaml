apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno-system
spec:
  interval: 30m
  timeout: 15m

  dependsOn:
    - name: cilium
      namespace: kube-system

  chartRef:
    kind: OCIRepository
    name: kyverno
    namespace: flux-system

  install:
    crds: CreateReplace

  upgrade:
    crds: CreateReplace

  values:
    admissionController:
      # 2, not 1: the resource webhook is failurePolicy: Fail, so while this pod is
      # unavailable every matching resource creation is rejected cluster-wide — which
      # happens on each node reboot.
      # The chart already sets a preferred podAntiAffinity, so both replicas spread.
      replicas: 2
      # Under `container`, unlike the three controllers below which take `resources`
      # directly — this one is the exception in the chart. Written flat it was ignored and
      # the pod ran on the chart's own defaults.
      container:
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 256Mi
      serviceMonitor:
        enabled: true

    # A ServiceMonitor per controller: the chart has no global `serviceMonitor` key, so the
    # single one written here used to create nothing and Kyverno was not scraped at all.
    backgroundController:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
      serviceMonitor:
        enabled: true

    cleanupController:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
      serviceMonitor:
        enabled: true

    reportsController:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          # Twice its peak, which is higher than the other three: this one holds a report per
          # workload, so it grows with the cluster rather than with traffic.
          memory: 512Mi
      serviceMonitor:
        enabled: true
