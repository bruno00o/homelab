---
# Alerts on what only shows in the logs: the failures below leave every pod Ready. Loki reads
# this file itself and sends to Alertmanager, so the routing is the same as Prometheus alerts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-alert-rules
  namespace: loki-system
data:
  homelab.yaml: |
    groups:
      - name: silent-failures
        rules:
          # Sustained, so that a short network cut on its own does not fire.
          - alert: FrigateCameraCrashLoop
            expr: |
              sum by (camera) (count_over_time({namespace="home-automation", container="frigate"}
                |= "Ffmpeg process crashed unexpectedly"
                | regexp "for (?P<camera>camera_[0-9]+)" [15m])) > 1
            for: 30m
            labels:
              severity: warning
              namespace: home-automation
            annotations:
              description: >-
                {{ $labels.camera }}: ffmpeg keeps crashing. Detection or recording is degraded.
                Read the ffmpeg message: a decoding error or a network one.
          # Its liveness probe restarts it on the same signal, so this firing means that did
          # not help. Both a dead socket and a lost login show as a failed sync.
          - alert: AutokumaDisconnected
            expr: |
              sum(count_over_time({namespace="uptime-kuma", pod=~"autokuma.*"}
                |= "Encountered error during sync" [5m])) > 10
            for: 10m
            labels:
              severity: warning
              namespace: uptime-kuma
            annotations:
              description: >-
                autokuma keeps failing to sync with uptime-kuma despite its liveness probe,
                monitors no longer sync. Read its log, then delete the autokuma pod.
          # Right after a reboot, the evacuation left a volume attached; otherwise a disk or a
          # Longhorn volume failing mid-write. The window is long because a node going down
          # ships its last kernel lines only once it is back.
          - alert: NodeWritesLost
            expr: |
              sum by (node_name) (count_over_time({job="talos", service="kernel"}
                |~ "EXT4-fs error|lost (a)?sync page write|Data will be lost|potential data loss|op 0x[0-9a-f]+:\\(WRITE\\)" [30m])) > 0
            labels:
              severity: warning
            annotations:
              description: >-
                {{ $labels.node_name }}: the kernel lost writes on a disk or a Longhorn volume.
                Read its kernel log in Loki around this time to see which device.
