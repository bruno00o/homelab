apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: loki-system
spec:
  interval: 30m
  timeout: 10m

  dependsOn:
    - name: cilium
      namespace: kube-system
    - name: loki
      namespace: loki-system

  chart:
    spec:
      chart: alloy
      version: "1.15.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1h

  values:
    crds:
      create: false

    alloy:
      enableReporting: false
      # Positions on the node, or every restart would resend what the logs still hold. Not
      # under /var/lib/alloy: root without capabilities cannot enter the image's own directory.
      storagePath: /positions
      mounts:
        varlog: true
        extra:
          - name: positions
            mountPath: /positions
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi
      configMap:
        # Same labels as promtail's chart defaults, so existing queries keep working.
        content: |
          discovery.kubernetes "pods" {
            role = "pod"
            selectors {
              role  = "pod"
              field = "spec.nodeName=" + sys.env("HOSTNAME")
            }
          }

          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_pod_controller_name"]
              regex         = "([0-9a-z-.]+?)(-[0-9a-f]{8,10})?"
              target_label  = "__tmp_controller_name"
            }
            rule {
              source_labels = [
                "__meta_kubernetes_pod_label_app_kubernetes_io_name",
                "__meta_kubernetes_pod_label_app",
                "__tmp_controller_name",
                "__meta_kubernetes_pod_name",
              ]
              regex        = "^;*([^;]+)(;.*)?$"
              target_label = "app"
            }
            rule {
              source_labels = [
                "__meta_kubernetes_pod_label_app_kubernetes_io_instance",
                "__meta_kubernetes_pod_label_instance",
              ]
              regex        = "^;*([^;]+)(;.*)?$"
              target_label = "instance"
            }
            rule {
              source_labels = [
                "__meta_kubernetes_pod_label_app_kubernetes_io_component",
                "__meta_kubernetes_pod_label_component",
              ]
              regex        = "^;*([^;]+)(;.*)?$"
              target_label = "component"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node_name"
            }
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["namespace", "app"]
              separator     = "/"
              target_label  = "job"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              replacement   = "/var/log/pods/*$1/*.log"
              target_label  = "__path__"
            }
            // Static pods log under their config hash, not their UID.
            rule {
              source_labels = [
                "__meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash",
                "__meta_kubernetes_pod_annotation_kubernetes_io_config_hash",
                "__meta_kubernetes_pod_container_name",
              ]
              separator    = "/"
              regex        = "true/(.*)"
              replacement  = "/var/log/pods/*$1/*.log"
              target_label = "__path__"
            }
          }

          local.file_match "pods" {
            path_targets = discovery.relabel.pods.output
          }

          loki.source.file "pods" {
            targets       = local.file_match.pods.targets
            forward_to    = [loki.process.pods.receiver]
            tail_from_end = true
          }

          loki.process "pods" {
            forward_to = [loki.write.default.receiver]

            stage.cri {}
          }

          loki.write "default" {
            endpoint {
              url = "http://loki:3100/loki/api/v1/push"
            }
          }

    configReloader:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

    controller:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      volumes:
        extra:
          - name: positions
            hostPath:
              path: /var/lib/alloy
              type: DirectoryOrCreate

    serviceMonitor:
      enabled: true
