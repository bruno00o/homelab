apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: loki-system
spec:
  interval: 30m
  timeout: 15m

  dependsOn:
    - name: cilium
      namespace: kube-system
    - name: longhorn
      namespace: longhorn-system

  chart:
    spec:
      chart: loki
      version: "7.5.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1h

  values:
    deploymentMode: SingleBinary

    loki:
      # Pinned here: this chart is now kept for the enterprise edition, and the image it pins
      # lags behind the Loki releases it names.
      image:
        # renovate: datasource=docker depName=docker.io/grafana/loki
        tag: 3.7.9
      analytics:
        reporting_enabled: false
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      limits_config:
        retention_period: 168h  # 7 days
      # retention_period above is only a declaration: Loki deletes nothing unless the
      # compactor is told to enforce it, and the chart ships `compactor: {}`. It was inert
      # from the start - the PVC held 133 days of logs under a 7-day policy and was on
      # course to fill, at which point Loki stops accepting pushes and logging stops.
      # delete_request_store is required as soon as retention_enabled is true.
      compactor:
        working_directory: /var/loki/compactor
        retention_enabled: true
        delete_request_store: filesystem
        retention_delete_delay: 2h
      structuredConfig:
        ruler:
          enable_api: true
          # Every replica, as Prometheus does: the Service would pick one per send, and replicas
          # do not share alerts.
          enable_alertmanager_discovery: true
          alertmanager_url: http://_http-web._tcp.alertmanager-operated.monitoring.svc.cluster.local
          # Not the default, /rules: the ruler rewrites its rules there, over the ones it reads.
          rule_path: /var/loki/ruler-scratch
          storage:
            type: local
            local:
              directory: /rules

    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        # Same reasoning as the Prometheus TSDB: the compactor enforces a week, so there is
        # no history a restore could give back.
        storageClass: longhorn-no-backup
        size: 10Gi
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 768Mi
      # `fake` is the tenant Loki uses when auth is off.
      extraVolumes:
        - name: alert-rules
          configMap:
            name: loki-alert-rules
      extraVolumeMounts:
        - name: alert-rules
          mountPath: /rules/fake
          readOnly: true

    # A mounted ConfigMap needs no watch on the apiserver, and this sidecar stopped without
    # a sign while its pod stayed Ready.
    sidecar:
      rules:
        enabled: false

    # Disable components not needed in SingleBinary mode
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0

    # Disable gateway (optional, we access directly)
    gateway:
      enabled: false

    # Disable test
    test:
      enabled: false

    # Disable caches (not needed for SingleBinary)
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false

    # Disable self-monitoring. Scraping stays on: nothing else says that the ruler is failing.
    monitoring:
      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false
      serviceMonitor:
        enabled: true

    # Loki canary DaemonSet configuration. Top level, which is where the chart reads it — a
    # second copy under `monitoring` above did nothing.
    lokiCanary:
      enabled: false
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
