apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: loki-system
spec:
  interval: 30m
  timeout: 15m

  dependsOn:
    - name: cilium
      namespace: kube-system
    - name: longhorn
      namespace: longhorn-system

  chart:
    spec:
      chart: loki
      version: "7.1.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1h

  values:
    deploymentMode: SingleBinary

    loki:
      analytics:
        reporting_enabled: false
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      limits_config:
        retention_period: 168h  # 7 days
      # retention_period above is only a declaration: Loki deletes nothing unless the
      # compactor is told to enforce it, and the chart ships `compactor: {}`. It was inert
      # from the start - the PVC held 133 days of logs under a 7-day policy and was on
      # course to fill, at which point Loki stops accepting pushes and logging stops.
      # delete_request_store is required as soon as retention_enabled is true.
      compactor:
        working_directory: /var/loki/compactor
        retention_enabled: true
        delete_request_store: filesystem
        retention_delete_delay: 2h

    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        storageClass: ${DEFAULT_STORAGE_CLASS}
        size: 10Gi
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 768Mi

    # Sidecar for rules (k8s-sidecar)
    sidecar:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi

    # Disable components not needed in SingleBinary mode
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0

    # Disable gateway (optional, we access directly)
    gateway:
      enabled: false

    # Disable test
    test:
      enabled: false

    # Disable caches (not needed for SingleBinary)
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false

    # Disable self-monitoring
    monitoring:
      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false

    # Loki canary DaemonSet configuration. Top level, which is where the chart reads it — a
    # second copy under `monitoring` above did nothing.
    lokiCanary:
      enabled: false
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
