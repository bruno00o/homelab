---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-communication
  namespace: loki-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-promtail-ingress
  namespace: loki-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: promtail
      ports:
        - protocol: TCP
          port: 3100

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-ingress
  namespace: loki-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 3100

---
# Both were NetworkPolicies naming ports 443 and 6443 with no `to:`, which reads as "to
# anywhere" - the whole internet, not the apiserver. Only Cilium can name the apiserver: it
# is reached through a ClusterIP that DNATs to host-network endpoints, which no ipBlock can
# express.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-promtail-apiserver-egress
  namespace: loki-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: promtail
  egress:
    - toEntities:
        - kube-apiserver

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-loki-apiserver-egress
  namespace: loki-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  egress:
    - toEntities:
        - kube-apiserver

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: loki-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 3100
        - protocol: TCP
          port: 3101
