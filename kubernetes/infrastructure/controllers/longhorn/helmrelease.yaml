apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  timeout: 15m

  chart:
    spec:
      chart: longhorn
      version: "1.12.0"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      interval: 1h

  dependsOn:
    - name: cilium
      namespace: kube-system
    - name: cert-manager
      namespace: cert-manager

  install:
    crds: CreateReplace

  upgrade:
    crds: CreateReplace

  values:
    preUpgradeChecker:
      jobEnabled: false
    defaultSettings:
      defaultReplicaCount: 2
      defaultDataPath: /var/mnt/longhorn
      createDefaultDiskLabeledNodes: true
      # `ignored` is a per-volume value; as a global setting longhorn-manager rejects it
      # (`value ignored is not a valid choice`) and silently keeps its own default. Written
      # here since the bootstrap, these eight lines configured nothing. Below is what the
      # cluster was actually running, stated instead of implied. The two soft-anti-affinity
      # ones stay true deliberately: no zone topology and one disk per node, so false would
      # leave replicas unschedulable. Note that `task validate` cannot catch this — it checks
      # that a key exists in the chart, never that the value is one the component accepts.
      replicaAutoBalance: disabled
      replicaSoftAntiAffinity: false
      replicaZoneSoftAntiAffinity: true
      replicaDiskSoftAntiAffinity: true
      backupCompressionMethod: lz4
      snapshotDataIntegrity: fast-check
      freezeFilesystemForSnapshot: false
      restoreVolumeRecurringJobs: false
      offlineReplicaRebuilding: false
      backupConcurrentLimit: 2
      # Longhorn ships this at 0, which means volumes never leave the engine image they
      # were created with. Each Longhorn upgrade then adds an engine DaemonSet and keeps
      # every older one alive: v1.11.0, v1.11.1 and v1.11.2 were still serving 31 of 38
      # volumes under a v1.12.0 cluster, three privileged DaemonSets carrying CVEs that
      # no image bump could reach. 1 = one volume per node at a time, live upgrade.
      # It does not make the pileup impossible: only healthy attached volumes migrate, so a
      # volume left degraded keeps its engine image alive along with its DaemonSet.
      concurrentAutomaticEngineUpgradePerNodeLimit: 1

    # The backup target is no longer a default setting: the chart moved it to its own block,
    # which renders the BackupTarget resource instead of a line in the settings ConfigMap.
    # Written under defaultSettings it was dropped, and the target survived only as cluster
    # state left by an older chart — a rebuilt cluster would have come up with no backup
    # destination at all.
    defaultBackupStore:
      backupTarget: ${NFS_BACKUP_TARGET}
      pollInterval: 300

    persistence:
      defaultClass: true
      defaultClassReplicaCount: 2
      defaultFsType: ext4
      reclaimPolicy: Delete

    longhornManager:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi

    # No longhornDriver.resources or longhornUI.resources: longhornManager above is the only
    # component whose resources the chart exposes. Both blocks used to sit here and were
    # ignored, which is why the two Deployments show up unbounded in `task policy:drift`.

    metrics:
      serviceMonitor:
        enabled: true
