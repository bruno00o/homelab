apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  timeout: 15m

  chart:
    spec:
      chart: longhorn
      version: "1.12.0"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      interval: 1h

  dependsOn:
    - name: cilium
      namespace: kube-system
    - name: cert-manager
      namespace: cert-manager

  install:
    crds: CreateReplace

  upgrade:
    crds: CreateReplace

  values:
    preUpgradeChecker:
      jobEnabled: false
    defaultSettings:
      defaultReplicaCount: 2
      defaultDataPath: /var/mnt/longhorn
      createDefaultDiskLabeledNodes: true
      replicaAutoBalance: ignored
      replicaSoftAntiAffinity: ignored
      replicaZoneSoftAntiAffinity: ignored
      replicaDiskSoftAntiAffinity: ignored
      backupCompressionMethod: lz4
      snapshotDataIntegrity: ignored
      freezeFilesystemForSnapshot: ignored
      restoreVolumeRecurringJobs: ignored
      offlineReplicaRebuilding: ignored
      backupConcurrentLimit: 2

    # The backup target is no longer a default setting: the chart moved it to its own block,
    # which renders the BackupTarget resource instead of a line in the settings ConfigMap.
    # Written under defaultSettings it was dropped, and the target survived only as cluster
    # state left by an older chart — a rebuilt cluster would have come up with no backup
    # destination at all.
    defaultBackupStore:
      backupTarget: ${NFS_BACKUP_TARGET}
      pollInterval: 300

    persistence:
      defaultClass: true
      defaultClassReplicaCount: 2
      defaultFsType: ext4
      reclaimPolicy: Delete

    longhornManager:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi

    # No longhornDriver.resources or longhornUI.resources: longhornManager above is the only
    # component whose resources the chart exposes. Both blocks used to sit here and were
    # ignored, which is why the two Deployments show up unbounded in `task policy:drift`.

    metrics:
      serviceMonitor:
        enabled: true
