---
# Storage for data that rebuilds itself: caches, indexes, downloaded models.
#
# Declaring no recurring job does not opt a volume out. longhorn-manager adds any volume
# that has none to the `default` group, which is where the hourly snapshot and the nightly
# backup come from - the default StorageClass names no selector and every volume created
# through it is in that group. Opting out means naming a group no job belongs to.
#
# Both jobs go, not just the backup: the snapshot chain is what a volume that rewrites
# itself pays for on disk, and none of this is worth a restore.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-no-backup
  annotations:
    # StorageClass parameters are immutable: without this, a changed parameter fails the
    # apply instead of recreating the class. Existing volumes are not affected.
    kustomize.toolkit.fluxcd.io/force: enabled
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: "ext4"
  dataLocality: "best-effort"
  unmapMarkSnapChainRemoved: "ignored"
  disableRevisionCounter: "true"
  dataEngine: "v1"
  backupTargetName: "default"
  recurringJobSelector: '[{"name":"no-recurring-job","isGroup":true}]'

---
# Storage for CloudNativePG instances. Postgres already replicates between instances, so
# Longhorn replicas only multiplied every write, synchronously and over the network; both
# projects recommend a single replica, kept on the instance's own node.
#
# strict-local places the replica when the volume is first attached, then pins the PV to
# that node: an instance whose node is down stays Pending while CNPG fails over, and one on
# a node lost for good is recreated elsewhere with `kubectl cnpg destroy`. Each Cluster
# requires its instances on distinct nodes, or two copies would share a disk.
#
# No recurring job: barman already keeps base backups and WAL in rustfs.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-cnpg
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  dataLocality: "strict-local"
  staleReplicaTimeout: "30"
  fsType: "ext4"
  disableRevisionCounter: "true"
  dataEngine: "v1"
  recurringJobSelector: '[{"name":"no-recurring-job","isGroup":true}]'
