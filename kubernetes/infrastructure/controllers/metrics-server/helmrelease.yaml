---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  interval: 30m
  timeout: 10m

  chart:
    spec:
      chart: metrics-server
      version: "3.14.0"
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: flux-system
      interval: 1h

  install:
    crds: CreateReplace

  upgrade:
    crds: CreateReplace

  values:
    fullnameOverride: metrics-server

    image:
      # renovate: datasource=docker depName=registry.k8s.io/metrics-server/metrics-server
      tag: v0.9.0

    replicas: 1

    # Kubelet serving certificates are signed on demand and approved by
    # kubelet-serving-cert-approver (Talos extraManifest), so the kubelet TLS
    # chain validates and --kubelet-insecure-tls is not needed.
    defaultArgs:
      - --cert-dir=/tmp
      - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
      - --kubelet-use-node-status-port
      - --metric-resolution=15s

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL

    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        memory: 256Mi
