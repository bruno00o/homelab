---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  timeout: 20m

  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.1.4"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1h

  dependsOn:
    - name: longhorn
      namespace: longhorn-system

  install:
    crds: CreateReplace

  upgrade:
    crds: CreateReplace

  values:
    prometheusOperator:
      admissionWebhooks:
        patch:
          ttlSecondsAfterFinished: 60
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 256Mi

    grafana:
      enabled: true
      assertNoLeakedSecrets: false
      # On the Deployment, which is what Reloader watches. The same annotation used to sit
      # on the HelmRelease, an object Reloader has never looked at, and the chart does not
      # copy HelmRelease annotations onto what it renders - so it did nothing. The OAuth
      # client secret is injected through envValueFrom and resolved once at pod start:
      # rotating it in Authentik left Grafana on the stale value, and with the login form
      # disabled that locks everyone out until a manual rollout restart.
      annotations:
        reloader.stakater.com/auto: "true"
      deploymentStrategy:
        type: Recreate
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        storageClassName: ${DEFAULT_STORAGE_CLASS}
        size: 5Gi
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          # Was 512Mi and peaked at 497Mi over 7 days — 97% of its own limit, one dashboard
          # render away from being killed.
          memory: 1Gi

      # Its own key: `resources` above is the grafana container only, and the chown init
      # container renders with `resources: {}`. Invisible until the audit mirrors started
      # looking at init containers.
      initChownData:
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
        securityContext:
          readOnlyRootFilesystem: false
          runAsNonRoot: false
          runAsUser: 0
          allowPrivilegeEscalation: false

      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef:
            name: grafana-oauth
            key: client-secret

      grafana.ini:
        server:
          root_url: https://grafana.${CLUSTER_DOMAIN}
        auth:
          disable_login_form: true
          oauth_allow_insecure_email_lookup: true
        auth.generic_oauth:
          enabled: true
          name: Authentik
          allow_sign_up: true
          client_id: grafana
          scopes: openid profile email
          auth_url: https://auth.${CLUSTER_DOMAIN}/application/o/authorize/
          token_url: http://authentik-server.authentik.svc/application/o/token/
          api_url: http://authentik-server.authentik.svc/application/o/userinfo/
          email_attribute_path: email
          login_attribute_path: preferred_username
          name_attribute_path: name
          role_attribute_path: contains(groups[*], 'homelab-admins') && 'Admin' || 'Viewer'

      sidecar:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            # Both sidecars sat at 71% and 76% of 128Mi; they load every matching ConfigMap
            # in the cluster, so they grow with the number of dashboards.
            memory: 256Mi
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          folderAnnotation: grafana_folder
          searchNamespace: ALL
          # folderAnnotation only tells the sidecar which subdirectory to write into; the
          # Grafana file provisioner ignores subdirectories unless this is on. Without it
          # the annotation carried by every repo dashboard did nothing and all five landed
          # in General among the thirty the chart ships.
          provider:
            foldersFromFilesStructure: true
        datasources:
          enabled: true
          label: grafana_datasource
          labelValue: "1"

      defaultDashboardsEnabled: true
      defaultDashboardsTimezone: Europe/Paris

      additionalDataSources:
        # Both need an explicit uid. Without one Grafana generates a random one at
        # provisioning, and the Tempo -> Loki correlation below pointed at a datasource
        # called `loki` that did not exist: "Logs for this span" answered `Datasource loki
        # was not found`. The chart's own Prometheus and Alertmanager entries set a uid,
        # which is what made the cross-reference look like it resolved.
        - name: Loki
          type: loki
          uid: loki
          url: http://loki.loki-system.svc:3100
          access: proxy
          isDefault: false
        - name: Tempo
          type: tempo
          uid: tempo
          url: http://tempo.tempo-system.svc:3200
          access: proxy
          isDefault: false
          jsonData:
            tracesToLogsV2:
              datasourceUid: loki
              tags: ["job", "namespace", "pod"]
            nodeGraph:
              enabled: true

    prometheus:
      prometheusSpec:
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        retention: 7d
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            # Peaked at 1988Mi against a 2Gi limit — 97%. Go sizes its heap to the limit, so
            # this was not "using what it needs" but "running as close to the wall as it
            # dared": raised to 3Gi it immediately settled at 2378Mi, which is what it
            # actually wanted. 4Gi is that figure with the same headroom every other limit
            # here gets. Prometheus memory tracks active series, which only grows.
            memory: 4Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ${DEFAULT_STORAGE_CLASS}
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi
        additionalScrapeConfigs:
          - job_name: etcd
            static_configs:
              - targets:
                  - ${NODE_LUFFY}:2381
                  - ${NODE_ZORO}:2381
                  - ${NODE_NAMI}:2381

    alertmanager:
      config:
        global:
          resolve_timeout: 5m
        route:
          group_by: ["alertname", "namespace"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: "discord"
          routes:
            - receiver: "null"
              matchers:
                - alertname = "InfoInhibitor"
            # Watchdog fires permanently by design. Sent outside the cluster so that its
            # *silence* is the alert: every Discord notification needs the cluster alive
            # enough to send it, so nothing in here can report its own death.
            - receiver: "heartbeat"
              matchers:
                - alertname = "Watchdog"
              group_wait: 0s
              group_interval: 1m
              repeat_interval: 1m
        receivers:
          - name: "null"
          - name: "heartbeat"
            webhook_configs:
              - url: ${HEARTBEAT_URL}
                send_resolved: false
          - name: "discord"
            discord_configs:
              - webhook_url: ${DISCORD_WEBHOOK_URL}
                title: "{{ .GroupLabels.alertname }}"
                message: |
                  {{ range .Alerts }}
                  **{{ .Labels.alertname }}** - {{ .Labels.severity }}
                  {{ .Annotations.description }}
                  {{ end }}
      alertmanagerSpec:
        # 2, not 1: a single Alertmanager means every alert is lost while its node reboots,
        # and the failure is silent by nature — nothing alerts about the alerting being
        # down. The two gossip their state, so a notification is not sent twice.
        replicas: 2
        # This chart sets no anti-affinity, so without a spread both replicas can land on
        # the same node and the second one buys nothing.
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: alertmanager
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ${DEFAULT_STORAGE_CLASS}
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 5Gi

    nodeExporter:
      enabled: true

    # The parent chart's `nodeExporter` key only turns the subchart on; anything else has to
    # be addressed to the subchart by name. The resources below used to sit under
    # `nodeExporter` and were dropped, which is why the DaemonSet ran unbounded.
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 256Mi

    kubeStateMetrics:
      enabled: true

    kubeControllerManager:
      enabled: false

    kubeScheduler:
      enabled: false

    kubeProxy:
      enabled: false

    kubeEtcd:
      enabled: false
