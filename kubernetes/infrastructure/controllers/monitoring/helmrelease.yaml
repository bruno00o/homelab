---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  timeout: 20m

  chart:
    spec:
      chart: kube-prometheus-stack
      version: "91.8.2"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1h

  dependsOn:
    - name: longhorn
      namespace: longhorn-system

  install:
    crds: CreateReplace

  upgrade:
    crds: CreateReplace

  values:
    prometheusOperator:
      admissionWebhooks:
        patch:
          ttlSecondsAfterFinished: 60
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 256Mi

    grafana:
      enabled: true
      assertNoLeakedSecrets: false
      # On the Deployment, which is what Reloader watches. The same annotation used to sit
      # on the HelmRelease, an object Reloader has never looked at, and the chart does not
      # copy HelmRelease annotations onto what it renders - so it did nothing. The OAuth
      # client secret is injected through envValueFrom and resolved once at pod start:
      # rotating it in Authentik left Grafana on the stale value, and with the login form
      # disabled that locks everyone out until a manual rollout restart.
      annotations:
        reloader.stakater.com/auto: "true"
      deploymentStrategy:
        type: Recreate
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        storageClassName: ${DEFAULT_STORAGE_CLASS}
        size: 5Gi
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          # Was 512Mi and peaked at 497Mi over 7 days — 97% of its own limit, one dashboard
          # render away from being killed.
          memory: 1Gi

      # Its own key: `resources` above is the grafana container only, and the chown init
      # container renders with `resources: {}`. Invisible until the audit mirrors started
      # looking at init containers.
      initChownData:
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
        securityContext:
          readOnlyRootFilesystem: false
          runAsNonRoot: false
          runAsUser: 0
          allowPrivilegeEscalation: false

      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef:
            name: grafana-oauth
            key: client-secret

      grafana.ini:
        server:
          root_url: https://grafana.${CLUSTER_DOMAIN}
        # monitoring has no egress to the internet, so these calls to grafana.com can only
        # time out. They retry on a ten-minute ticker and every SYN is a POLICY_DENIED
        # drop, which is what kept CiliumDroppedPackets flapping in and out of firing.
        analytics:
          check_for_updates: false
          check_for_plugin_updates: false
          reporting_enabled: false
        auth:
          disable_login_form: true
          oauth_allow_insecure_email_lookup: true
        auth.generic_oauth:
          enabled: true
          name: Authentik
          allow_sign_up: true
          client_id: grafana
          scopes: openid profile email
          auth_url: https://auth.${CLUSTER_DOMAIN}/application/o/authorize/
          token_url: http://authentik-server.authentik.svc/application/o/token/
          api_url: http://authentik-server.authentik.svc/application/o/userinfo/
          email_attribute_path: email
          login_attribute_path: preferred_username
          name_attribute_path: name
          role_attribute_path: contains(groups[*], 'homelab-admins') && 'Admin' || 'Viewer'
        # Grafana preinstalls a list of plugins at every start and re-checks each one
        # against grafana.com. They already ship in the image, and monitoring has no
        # egress, so every check can only time out. Same dead end as analytics above,
        # but a different code path — those settings do not cover it.
        plugins:
          preinstall_disabled: true
          # Falls back to the signing key embedded in the image, the one the bundled
          # plugins are signed with.
          public_key_retrieval_disabled: true

      sidecar:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            # Both sidecars sat at 71% and 76% of 128Mi; they load every matching ConfigMap
            # in the cluster, so they grow with the number of dashboards.
            memory: 256Mi
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          folderAnnotation: grafana_folder
          searchNamespace: ALL
          # folderAnnotation only tells the sidecar which subdirectory to write into; the
          # Grafana file provisioner ignores subdirectories unless this is on. Without it
          # the annotation carried by every repo dashboard did nothing and all five landed
          # in General among the thirty the chart ships.
          provider:
            foldersFromFilesStructure: true
        datasources:
          enabled: true
          label: grafana_datasource
          labelValue: "1"

      defaultDashboardsEnabled: true
      defaultDashboardsTimezone: Europe/Paris

      additionalDataSources:
        # An explicit uid: without one Grafana generates a random one at provisioning, and
        # anything referring to the datasource by `loki` finds nothing ("Datasource loki was
        # not found"), as the Tempo correlation did before Tempo was removed, unused.
        - name: Loki
          type: loki
          uid: loki
          url: http://loki.loki-system.svc:3100
          access: proxy
          isDefault: false

    prometheus:
      prometheusSpec:
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        retention: 7d
        resources:
          requests:
            cpu: 100m
            memory: 2Gi
          limits:
            # Peaked at 1988Mi against a 2Gi limit — 97%. Go sizes its heap to the limit, so
            # this was not "using what it needs" but "running as close to the wall as it
            # dared": raised to 3Gi it immediately settled at 2378Mi, which is what it
            # actually wanted. 4Gi is that figure with the same headroom every other limit
            # here gets. Prometheus memory tracks active series, which only grows.
            memory: 4Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              # retention above is a week, so a restore returns metrics that expire within
              # the week - and the nightly backup is a day behind, so it would not even hold
              # the incident. Compaction rewrites whole block ranges, which made this the
              # largest thing on the backup target by far, several times its own size.
              storageClassName: longhorn-no-backup
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi
        additionalScrapeConfigs:
          - job_name: etcd
            static_configs:
              - targets:
                  - ${NODE_LUFFY}:2381
                  - ${NODE_ZORO}:2381
                  - ${NODE_NAMI}:2381

    alertmanager:
      config:
        global:
          resolve_timeout: 5m
        route:
          group_by: ["alertname", "namespace"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: "discord"
          routes:
            - receiver: "null"
              matchers:
                - alertname = "InfoInhibitor"
            # Watchdog fires permanently by design. Sent outside the cluster so that its
            # *silence* is the alert: every Discord notification needs the cluster alive
            # enough to send it, so nothing in here can report its own death.
            - receiver: "heartbeat"
              matchers:
                - alertname = "Watchdog"
              group_wait: 0s
              group_interval: 1m
              repeat_interval: 1m
        receivers:
          - name: "null"
          - name: "heartbeat"
            webhook_configs:
              - url: ${HEARTBEAT_URL}
                send_resolved: false
          - name: "discord"
            discord_configs:
              - webhook_url: ${DISCORD_WEBHOOK_URL}
                title: "{{ .GroupLabels.alertname }}"
                message: |
                  {{ range .Alerts }}
                  **{{ .Labels.alertname }}** - {{ .Labels.severity }}
                  {{ .Annotations.description }}
                  {{ end }}
      alertmanagerSpec:
        # 2, not 1: a single Alertmanager means every alert is lost while its node reboots,
        # and the failure is silent by nature — nothing alerts about the alerting being
        # down. The two gossip their state, so a notification is not sent twice.
        replicas: 2
        # This chart sets no anti-affinity, so without a spread both replicas can land on
        # the same node and the second one buys nothing.
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: alertmanager
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ${DEFAULT_STORAGE_CLASS}
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 5Gi

    nodeExporter:
      enabled: true

    # The parent chart's `nodeExporter` key only turns the subchart on; anything else has to
    # be addressed to the subchart by name. The resources below used to sit under
    # `nodeExporter` and were dropped, which is why the DaemonSet ran unbounded.
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 256Mi
      # Flux objects as gotk_resource_info, the metric the Flux dashboards and the Flux
      # alerts read. Taken from fluxcd/flux2-monitoring-example, without its `collectors: []`
      # and --custom-resource-state-only: those turn off every standard metric, which the
      # other dashboards and alerts of this stack depend on.
      rbac:
        extraRules:
          - apiGroups:
              - helm.toolkit.fluxcd.io
              - kustomize.toolkit.fluxcd.io
              - source.toolkit.fluxcd.io
            resources:
              - gitrepositories
              - helmcharts
              - helmreleases
              - helmrepositories
              - kustomizations
              - ocirepositories
            verbs:
              - list
              - watch
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux Kustomization resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name:
                            - metadata
                            - name
                    labelsFromPath:
                      exported_namespace:
                        - metadata
                        - namespace
                      ready:
                        - status
                        - conditions
                        - '[type=Ready]'
                        - status
                      suspended:
                        - spec
                        - suspend
                      revision:
                        - status
                        - lastAppliedRevision
                      source_name:
                        - spec
                        - sourceRef
                        - name
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux HelmRelease resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name:
                            - metadata
                            - name
                    labelsFromPath:
                      exported_namespace:
                        - metadata
                        - namespace
                      ready:
                        - status
                        - conditions
                        - '[type=Ready]'
                        - status
                      suspended:
                        - spec
                        - suspend
                      revision:
                        - status
                        - history
                        - '0'
                        - chartVersion
                      chart_name:
                        - status
                        - history
                        - '0'
                        - chartName
                      chart_app_version:
                        - status
                        - history
                        - '0'
                        - appVersion
                      chart_ref_name:
                        - spec
                        - chartRef
                        - name
                      chart_source_name:
                        - spec
                        - chart
                        - spec
                        - sourceRef
                        - name
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux GitRepository resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name:
                            - metadata
                            - name
                    labelsFromPath:
                      exported_namespace:
                        - metadata
                        - namespace
                      ready:
                        - status
                        - conditions
                        - '[type=Ready]'
                        - status
                      suspended:
                        - spec
                        - suspend
                      revision:
                        - status
                        - artifact
                        - revision
                      url:
                        - spec
                        - url
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux HelmRepository resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name:
                            - metadata
                            - name
                    labelsFromPath:
                      exported_namespace:
                        - metadata
                        - namespace
                      ready:
                        - status
                        - conditions
                        - '[type=Ready]'
                        - status
                      suspended:
                        - spec
                        - suspend
                      revision:
                        - status
                        - artifact
                        - revision
                      url:
                        - spec
                        - url
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmChart
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux HelmChart resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name:
                            - metadata
                            - name
                    labelsFromPath:
                      exported_namespace:
                        - metadata
                        - namespace
                      ready:
                        - status
                        - conditions
                        - '[type=Ready]'
                        - status
                      suspended:
                        - spec
                        - suspend
                      revision:
                        - status
                        - artifact
                        - revision
                      chart_name:
                        - spec
                        - chart
                      chart_version:
                        - spec
                        - version
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: OCIRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux OCIRepository resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name:
                            - metadata
                            - name
                    labelsFromPath:
                      exported_namespace:
                        - metadata
                        - namespace
                      ready:
                        - status
                        - conditions
                        - '[type=Ready]'
                        - status
                      suspended:
                        - spec
                        - suspend
                      revision:
                        - status
                        - artifact
                        - revision
                      url:
                        - spec
                        - url

    kubeStateMetrics:
      enabled: true

    kubeControllerManager:
      enabled: false

    kubeScheduler:
      enabled: false

    kubeProxy:
      enabled: false

    kubeEtcd:
      enabled: false
