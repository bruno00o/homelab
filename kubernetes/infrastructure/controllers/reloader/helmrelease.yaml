---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: kube-system
spec:
  interval: 30m
  timeout: 10m

  dependsOn:
    - name: cilium
      namespace: kube-system

  chart:
    spec:
      chart: reloader
      version: "2.2.16"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
      interval: 1h

  install:
    crds: Skip

  values:
    # Everything below sits under reloader.deployment because that is where this chart
    # reads it. It used to be written one level up, which Helm accepts in silence: the
    # container ran with `securityContext: {}` and `resources: {}` for months, and no
    # ServiceMonitor was ever created. kube-system is excluded from the Kyverno policies
    # that would have caught it, so nothing complained.
    reloader:
      watchGlobally: true
      isArgoRollouts: false
      isOpenshift: false
      ignoreSecrets: false
      ignoreConfigMaps: false
      reloadOnCreate: true
      syncAfterRestart: false
      logLevel: info
      logFormat: json
      # The chart flag rather than containerSecurityContext.readOnlyRootFilesystem: it
      # also mounts the emptyDir on /tmp the binary needs to keep working.
      readOnlyRootFileSystem: true

      deployment:
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault

        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]

        # GOMEMLIMIT is derived from limits.memory by the chart, so the limit is what tells
        # the Go runtime when to collect rather than only what kills the pod.
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 256Mi

      # podMonitor and not serviceMonitor: the chart deprecates the latter and it needs a
      # Service this release does not create. reloader-allow-prometheus-scrape already
      # opens 9090 for it.
      podMonitor:
        enabled: true
