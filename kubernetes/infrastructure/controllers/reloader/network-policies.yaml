---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reloader-deny-ingress
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: reloader
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reloader-allow-dns-egress
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: reloader
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# A CiliumNetworkPolicy and not the shared apiserver-egress component: this namespace is
# kube-system, shared with everything else, so the rule has to stay label-scoped. Its
# predecessor opened 443 and 6443 with no destination at all, which is unrestricted HTTPS
# to the internet, not apiserver access.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: reloader-allow-apiserver-egress
  namespace: kube-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: reloader
  egress:
    - toEntities:
        - kube-apiserver
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reloader-allow-prometheus-scrape
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: reloader
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
