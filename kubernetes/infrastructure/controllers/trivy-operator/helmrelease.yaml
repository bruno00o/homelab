apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: trivy-system
spec:
  interval: 30m
  timeout: 15m

  dependsOn:
    - name: cilium
      namespace: kube-system

  chart:
    spec:
      chart: trivy-operator
      version: "0.35.0"
      sourceRef:
        kind: HelmRepository
        name: aquasecurity
        namespace: flux-system
      interval: 1h

  install:
    crds: CreateReplace

  upgrade:
    crds: CreateReplace

  values:
    operator:
      # This is what disables the node-collector, which Talos cannot run (no systemd). The
      # chart has no `nodeCollector.enabled`; a block by that name used to sit above and did
      # nothing — verified on the cluster, OPERATOR_CONCURRENT_NODE_COLLECTOR_LIMIT is 0 and
      # no node-collector job has ever run.
      scanNodeCollectorLimit: 0
      builtInTrivyServer: true
      vulnerabilityScannerScanOnlyCurrentRevisions: true
      configAuditScannerScanOnlyCurrentRevisions: true
      # One series per (image, package, CVE), carrying a `fixed_version` label. This is
      # what splits "vulnerable" from "actionable" without touching the scan itself:
      # trivy.ignoreUnfixed would give the same split by deleting the unfixed findings
      # from the reports, and there is then no way back to the full picture.
      metricsVulnIdEnabled: true

    trivy:
      # Scans of the two first-party images produced no report at all. Two blockers, both
      # measured: the scan pods carry no CA for zot's mugiwara certificate, and - the real
      # one - a pod under a network policy cannot reach the internal gateway. Cilium
      # redirects it to the gateway's L7 proxy, which drops the HTTP request and answers
      # `403 Access denied` without ever forwarding to zot (hubble: `http-request DROPPED`).
      # An unpoliced namespace reaches the same URL fine, which is what made this look like
      # a registry problem. rustfs, MAS and hermes each work around it with an in-pod nginx
      # sidecar and a hostAlias to 127.0.0.1; that is not available here, because the scan
      # Jobs are built by the operator, not by us.
      #
      # So the scanner is pointed at the Service instead, which stays inside the cluster and
      # needs neither the gateway nor TLS. The credentials still come from the workload's
      # own imagePullSecret, which trivy-operator resolves from the image reference.
      registry:
        mirror:
          "zot.merry.home.arpa": zot.zot.svc.cluster.local:5000
      nonSslRegistries:
        zot: zot.zot.svc.cluster.local:5000
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 256Mi

    serviceMonitor:
      enabled: true
      endpointAdditionalProperties:
        metricRelabelings:
          # metricsVulnIdEnabled above is all-or-nothing: 21k series cluster-wide, of
          # which only the 2.6k Critical/High ones get looked at. Dropped at ingest,
          # not at query time — Prometheus pays for a series it stores either way.
          - sourceLabels: [__name__, severity]
            regex: trivy_vulnerability_id;(Low|Medium|Unknown|None)
            action: drop
          # Free-text and redundant labels on that same metric. vuln_title is a full
          # sentence; the dates and pkg_path are never queried. Nothing else exposes
          # them, so dropping them cluster-wide is safe.
          - regex: vuln_title|pkg_path|target|class|published_date|last_modified_date
            action: labeldrop
