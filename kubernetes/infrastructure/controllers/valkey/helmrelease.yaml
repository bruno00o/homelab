apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey
  namespace: valkey-system
spec:
  interval: 30m
  timeout: 10m
  dependsOn:
    - name: cilium
      namespace: kube-system
    - name: longhorn
      namespace: longhorn-system
  chart:
    spec:
      chart: valkey
      version: "0.11.0"
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: flux-system
      interval: 1h
  values:
    auth:
      enabled: true
      usersExistingSecret: valkey-auth
      aclUsers:
        default:
          permissions: "~* &* +@all"
          passwordKey: default
    service:
      type: LoadBalancer
      annotations:
        lbipam.cilium.io/ips: ${LB_VALKEY}
    deploymentStrategy: Recreate
    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
    dataStorage:
      enabled: true
      requestedSize: 2Gi
      className: ${DEFAULT_STORAGE_CLASS}
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        # 415Mi peak against 512Mi. A cache has no natural ceiling other than the one set
        # here, so the headroom is deliberate rather than generous.
        memory: 768Mi
    # Separate key: `resources` above reaches the valkey container only, and the chart's
    # init container renders with `resources: {}` otherwise.
    initResources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi
    metrics:
      enabled: true
      exporter:
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
      service:
        enabled: true
      serviceMonitor:
        enabled: true
