# =============================================================================
# Control Plane patches
# =============================================================================
controlPlane:
  patches:
    - |-
      cluster:
        proxy:
          disabled: true
        etcd:
          extraArgs:
            listen-metrics-urls: http://0.0.0.0:2381
        apiServer:
          admissionControl:
            - name: PodSecurity
              configuration:
                apiVersion: pod-security.admission.config.k8s.io/v1beta1
                kind: PodSecurityConfiguration
                exemptions:
                  namespaces:
                    - longhorn-system
                    - monitoring
        # Applying a config only *creates* extraManifests resources; it never
        # updates one that already exists. Anything that needs to be upgradable
        # belongs in Flux instead (metrics-server moved there). Keep this list to
        # what has to exist before Flux does: the CSR approver that signs the
        # kubelet serving certificates enabled by rotate-server-certificates below.
        # A bump here is therefore inert until applied by hand, and check the image
        # first — upstream has shipped that manifest pointing at a floating tag.
        # `upgrade-k8s` is the exception: it reconciles this list, so it reverts a
        # hand-applied version back to the URL the node config holds, and it deletes
        # what has left the list — that is what removed metrics-server after the
        # move to Flux, without Flux noticing its own objects were gone.
        extraManifests:
          # renovate: datasource=github-releases depName=alex1989hu/kubelet-serving-cert-approver
          - https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/v0.11.1/deploy/standalone-install.yaml
    - |-
      machine:
        kubelet:
          extraMounts:
            - destination: /var/lib/longhorn
              type: bind
              source: /var/lib/longhorn
              options:
                - bind
                - rshared
                - rw
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/intel-ucode
          - siderolabs/i915
          - siderolabs/iscsi-tools
          - siderolabs/util-linux-tools

# =============================================================================
# Worker patches
# =============================================================================
worker:
  patches:
    - |-
      machine:
        sysctls:
          net.ipv6.conf.enp1s0.accept_ra_rt_info_max_plen: "64"
    - |-
      machine:
        nodeLabels:
          # "config" tells Longhorn to read the default-disks-config annotation
          # below instead of auto-creating a default disk at /var/lib/longhorn.
          node.longhorn.io/create-default-disk: "config"
        nodeAnnotations:
          node.longhorn.io/default-disks-config: |
            [{"name":"longhorn-data","path":"/var/mnt/longhorn","allowScheduling":true,"storageReserved":0,"tags":[]}]
    - |-
      apiVersion: v1alpha1
      kind: VolumeConfig
      name: EPHEMERAL
      provisioning:
        maxSize: 100GiB
    - |-
      apiVersion: v1alpha1
      kind: UserVolumeConfig
      name: longhorn
      provisioning:
        diskSelector:
          match: system_disk
        minSize: 200GiB
        grow: true
    - |-
      machine:
        kubelet:
          extraMounts:
            - destination: /var/lib/longhorn
              type: bind
              source: /var/lib/longhorn
              options:
                - bind
                - rshared
                - rw
            - destination: /var/mnt/longhorn
              type: bind
              source: /var/mnt/longhorn
              options:
                - bind
                - rshared
                - rw
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/intel-ucode
          - siderolabs/i915
          - siderolabs/iscsi-tools
          - siderolabs/util-linux-tools
