---
clusterName: going-merry
endpoint: https://10.0.20.10:6443
talosVersion: v1.13.9
kubernetesVersion: v1.36.4
cniConfig:
  name: none
allowSchedulingOnControlPlanes: false

additionalApiServerCertSans:
  - 10.0.20.10
additionalMachineCertSans:
  - 10.0.20.10
  - 10.0.20.11
  - 10.0.20.12
  - 10.0.20.13
  - 10.0.20.14
  - 10.0.20.15
  - 10.0.20.16

nodes:
  # --- Control Plane ---
  - hostname: luffy
    ipAddress: 10.0.20.11
    controlPlane: true
    installDiskSelector:
      model: CT500P310SSD8
    networkInterfaces:
      - interface: enp1s0
        dhcp: true
        vip:
          ip: 10.0.20.10

  - hostname: zoro
    ipAddress: 10.0.20.12
    controlPlane: true
    installDiskSelector:
      model: CT500P310SSD8
    networkInterfaces:
      - interface: enp1s0
        dhcp: true
        vip:
          ip: 10.0.20.10

  - hostname: nami
    ipAddress: 10.0.20.13
    controlPlane: true
    installDiskSelector:
      model: CT500P310SSD8
    networkInterfaces:
      - interface: enp1s0
        dhcp: true
        vip:
          ip: 10.0.20.10

  # --- Workers ---
  - hostname: usopp
    ipAddress: 10.0.20.14
    controlPlane: false
    installDiskSelector:
      model: CT2000T500SSD8
    networkInterfaces:
      - interface: enp1s0
        dhcp: true

  - hostname: sanji
    ipAddress: 10.0.20.15
    controlPlane: false
    installDiskSelector:
      model: CT2000T500SSD8
    networkInterfaces:
      - interface: enp1s0
        dhcp: true

  - hostname: chopper
    ipAddress: 10.0.20.16
    controlPlane: false
    installDiskSelector:
      model: CT2000T500SSD8
    networkInterfaces:
      - interface: enp1s0
        dhcp: true

# =============================================================================
# Global patches (all nodes)
# =============================================================================
patches:
  - |-
    machine:
      network:
        nameservers:
          - 1.1.1.1
          - 9.9.9.9
      features:
        hostDNS:
          enabled: true
          forwardKubeDNSToHost: false
  - |-
    machine:
      kubelet:
        extraArgs:
          rotate-server-certificates: true
        extraConfig:
          serializeImagePulls: false
  - |-
    machine:
      files:
        - path: /etc/cri/conf.d/20-customization.part
          op: create
          content: |
            [plugins."io.containerd.cri.v1.images"]
              discard_unpacked_layers = false
  - |-
    machine:
      network:
        extraHostEntries:
          - ip: 10.0.20.20
            aliases:
              - zot.merry.home.arpa
      registries:
        config:
          "zot.merry.home.arpa":
            tls:
              insecureSkipVerify: true
  - |-
    machine:
      files:
        # Trust the internal CA at the node level so containerd can verify zot over TLS.
        # The `insecureSkipVerify` above no longer reaches containerd: Spegel owns
        # /etc/cri/conf.d/hosts, and on startup it moves every host config it does not
        # mirror into hosts/_backup/ — zot among them, since it is not in Spegel's
        # mirroredRegistries. The setting stays in this file and is silently inert, which
        # is why an image that is not already cached on the node fails to pull with
        # `x509: certificate signed by unknown authority`. Measured on all six nodes.
