---
version: "3"

vars:
  TALOS_DIR: talos
  TALOS_CONFIG: "{{.TALOS_DIR}}/clusterconfig/talosconfig"
  CLUSTER_NAME: going-merry
  NODES: "10.0.20.11,10.0.20.12,10.0.20.13,10.0.20.14,10.0.20.15,10.0.20.16"
  CP_NODES: "10.0.20.11,10.0.20.12,10.0.20.13"
  WORKER_NODES: "10.0.20.14,10.0.20.15,10.0.20.16"
  NODE_LUFFY: "10.0.20.11"
  NODE_ZORO: "10.0.20.12"
  NODE_NAMI: "10.0.20.13"
  NODE_USOPP: "10.0.20.14"
  NODE_SANJI: "10.0.20.15"
  NODE_CHOPPER: "10.0.20.16"
  CILIUM_VERSION: "1.19.6"

env:
  TALOSCONFIG: "{{.TALOS_CONFIG}}"

tasks:
  # =============================================================================
  # Default
  # =============================================================================
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # =============================================================================
  # Validation - mirrors .github/workflows/ci.yaml
  # =============================================================================
  validate:
    desc: Run the CI checks locally, before pushing
    cmds:
      - task: validate:yaml
      - task: validate:manifests
      - task: validate:talos
      - task: validate:workflows
      - task: validate:renovate

  validate:yaml:
    desc: Lint YAML (same paths as CI)
    cmds:
      - yamllint -c .yamllint.yaml .

  validate:manifests:
    desc: Schema-validate all manifests, CRDs included
    preconditions:
      - sh: command -v kubeconform
        msg: "kubeconform not found. Run 'task deps:install'."
    cmds:
      - ./scripts/kubeconform.sh

  validate:talos:
    desc: Validate talconfig.yaml
    dir: "{{.TALOS_DIR}}"
    cmds:
      - talhelper validate talconfig talconfig.yaml

  validate:workflows:
    desc: Audit the GitHub Actions workflows with zizmor
    preconditions:
      - sh: command -v pipx
        msg: "pipx not found (needed to run zizmor)."
    # Keep the version in step with .github/workflows/ci.yaml.
    sources:
      - .github/workflows/*.yaml
    cmds:
      - pipx run zizmor==1.28.0 --format plain --offline .github/workflows/

  validate:renovate:
    desc: Validate the Renovate config
    # npx pulls the whole renovate package, so skip it unless the config changed.
    sources:
      - .github/renovate.json
    cmds:
      - npx -y -p renovate -- renovate-config-validator .github/renovate.json

  # =============================================================================
  # Talos - Configuration
  # =============================================================================
  talos:genconfig:
    desc: Generate Talos configs from talconfig.yaml
    dir: "{{.TALOS_DIR}}"
    cmds:
      - talhelper genconfig
    sources:
      - talconfig.yaml
      - talsecret.sops.yaml
    generates:
      - clusterconfig/*.yaml

  # =============================================================================
  # Talos - Fresh Install (insecure mode)
  # =============================================================================
  talos:apply-insecure:
    desc: Apply config to a node in insecure mode (fresh install)
    requires:
      vars: [NODE]
    vars:
      NODE_IP:
        sh: |
          case "{{.NODE}}" in
            luffy) echo "10.0.20.11" ;;
            zoro) echo "10.0.20.12" ;;
            nami) echo "10.0.20.13" ;;
            usopp) echo "10.0.20.14" ;;
            sanji) echo "10.0.20.15" ;;
            chopper) echo "10.0.20.16" ;;
            *) echo "{{.NODE}}" ;;
          esac
      NODE_NAME:
        sh: |
          case "{{.NODE}}" in
            10.0.20.11) echo "luffy" ;;
            10.0.20.12) echo "zoro" ;;
            10.0.20.13) echo "nami" ;;
            10.0.20.14) echo "usopp" ;;
            10.0.20.15) echo "sanji" ;;
            10.0.20.16) echo "chopper" ;;
            *) echo "{{.NODE}}" ;;
          esac
    cmds:
      - echo "Applying config to {{.NODE_NAME}} ({{.NODE_IP}}) in insecure mode..."
      - talosctl apply-config --nodes {{.NODE_IP}} --file {{.TALOS_DIR}}/clusterconfig/{{.CLUSTER_NAME}}-{{.NODE_NAME}}.yaml --insecure

  talos:apply-insecure-all:
    desc: Apply config to ALL nodes in insecure mode (fresh install)
    cmds:
      - task: talos:apply-insecure
        vars: { NODE: luffy }
      - task: talos:apply-insecure
        vars: { NODE: zoro }
      - task: talos:apply-insecure
        vars: { NODE: nami }
      - task: talos:apply-insecure
        vars: { NODE: usopp }
      - task: talos:apply-insecure
        vars: { NODE: sanji }
      - task: talos:apply-insecure
        vars: { NODE: chopper }
      - echo "Config applied to all nodes. Wait for them to reboot and install."

  # =============================================================================
  # Talos - Normal Operations
  # =============================================================================
  talos:apply:
    desc: Apply config to a node (e.g. task talos:apply NODE=luffy)
    requires:
      vars: [NODE]
    vars:
      NODE_IP:
        sh: |
          case "{{.NODE}}" in
            luffy) echo "10.0.20.11" ;;
            zoro) echo "10.0.20.12" ;;
            nami) echo "10.0.20.13" ;;
            usopp) echo "10.0.20.14" ;;
            sanji) echo "10.0.20.15" ;;
            chopper) echo "10.0.20.16" ;;
            *) echo "{{.NODE}}" ;;
          esac
      NODE_NAME:
        sh: |
          case "{{.NODE}}" in
            10.0.20.11) echo "luffy" ;;
            10.0.20.12) echo "zoro" ;;
            10.0.20.13) echo "nami" ;;
            10.0.20.14) echo "usopp" ;;
            10.0.20.15) echo "sanji" ;;
            10.0.20.16) echo "chopper" ;;
            *) echo "{{.NODE}}" ;;
          esac
    cmds:
      - talosctl apply-config --nodes {{.NODE_IP}} --file {{.TALOS_DIR}}/clusterconfig/{{.CLUSTER_NAME}}-{{.NODE_NAME}}.yaml

  talos:apply-all:
    desc: Apply config to all nodes
    cmds:
      - task: talos:apply
        vars: { NODE: luffy }
      - task: talos:apply
        vars: { NODE: zoro }
      - task: talos:apply
        vars: { NODE: nami }
      - task: talos:apply
        vars: { NODE: usopp }
      - task: talos:apply
        vars: { NODE: sanji }
      - task: talos:apply
        vars: { NODE: chopper }

  # =============================================================================
  # Talos - Bootstrap
  # =============================================================================
  talos:bootstrap:
    desc: Bootstrap the Kubernetes cluster (run once on first node)
    prompt: "Bootstrap Kubernetes cluster on luffy ({{.NODE_LUFFY}})? This should only be done ONCE."
    cmds:
      - echo "Bootstrapping Kubernetes cluster..."
      - talosctl bootstrap --nodes {{.NODE_LUFFY}}
      - echo "Kubernetes bootstrapped. Run 'task talos:kubeconfig' to get credentials."

  talos:kubeconfig:
    desc: Fetch kubeconfig from the cluster
    cmds:
      - talosctl kubeconfig --nodes {{.NODE_LUFFY}} --force
      - echo "Kubeconfig saved to ~/.kube/config"

  # =============================================================================
  # Talos - Reset
  # =============================================================================
  talos:reset-soft:
    desc: Reset cluster state but keep Talos installed (wipe Kubernetes only)
    prompt: "SOFT RESET - This will wipe Kubernetes state but keep Talos installed. Continue?"
    cmds:
      - echo "Resetting cluster state (keeping Talos)..."
      - talosctl reset --nodes {{.NODES}} --system-labels-to-wipe=STATE --system-labels-to-wipe=EPHEMERAL --graceful=false --reboot
      - echo ""
      - echo "Reset initiated. Nodes will reboot."
      - echo "After reboot run 'task bootstrap:cluster'"

  talos:reset-hard:
    desc: Full reset - wipes everything including Talos (requires USB reinstall)
    prompt: "HARD RESET - This will COMPLETELY WIPE all disks including Talos. You will need USB reinstall. Continue?"
    cmds:
      - echo "Performing HARD reset (wiping everything)..."
      - talosctl reset --nodes {{.NODES}} --graceful=false --reboot
      - echo ""
      - echo "Nodes will boot to UEFI shell."
      - echo "Boot each node from Talos USB, then run the bootstrap tasks."

  # =============================================================================
  # Talos - Upgrades
  # =============================================================================
  talos:upgrade:
    desc: Upgrade Talos on a node (e.g. task talos:upgrade NODE=luffy)
    requires:
      vars: [NODE]
    vars:
      NODE_IP:
        sh: |
          case "{{.NODE}}" in
            luffy) echo "10.0.20.11" ;;
            zoro) echo "10.0.20.12" ;;
            nami) echo "10.0.20.13" ;;
            usopp) echo "10.0.20.14" ;;
            sanji) echo "10.0.20.15" ;;
            chopper) echo "10.0.20.16" ;;
            *) echo "{{.NODE}}" ;;
          esac
      TALOS_VERSION:
        sh: yq '.talosVersion' {{.TALOS_DIR}}/talconfig.yaml
      INSTALLER_IMAGE:
        sh: yq '.machine.install.image' {{.TALOS_DIR}}/clusterconfig/going-merry-{{.NODE}}.yaml | head -1
    preconditions:
      - sh: test -n "{{.INSTALLER_IMAGE}}"
        msg: "Cannot read installer image. Run 'task talos:genconfig' first."
    prompt: "Upgrade {{.NODE}} ({{.NODE_IP}}) to Talos {{.TALOS_VERSION}}?"
    cmds:
      - echo "Upgrading {{.NODE}} to Talos {{.TALOS_VERSION}}..."
      # Cordon manually and skip talosctl's drain: the kubectl-based drain
      # deadlocks on Longhorn (evicting instance-manager vs. unmounting volumes).
      # instance-manager pods are owned by an InstanceManager CRD, not a DaemonSet, so
      # --ignore-daemonsets does not spare them, and their PDB allows no disruption.
      # --preserve keeps replica data across the reboot, so pods are simply
      # rescheduled and volumes reattach when the node returns.
      - kubectl cordon {{.NODE}}
      - talosctl upgrade --nodes {{.NODE_IP}} --image {{.INSTALLER_IMAGE}} --preserve --drain=false --talosconfig {{.TALOS_DIR}}/clusterconfig/talosconfig
      # Uncordon BEFORE the health check: talosctl 1.13.4+ added a
      # "all k8s nodes schedulable" check, which deadlocks against our own
      # cordon (health never passes -> wait-healthy loops forever).
      - kubectl uncordon {{.NODE}}
      - task: talos:wait-healthy
        vars: { NODE_IP: "{{.NODE_IP}}" }

  talos:upgrade-all:
    desc: Upgrade Talos on all nodes sequentially
    prompt: "Upgrade ALL nodes to the new Talos version?"
    cmds:
      - task: talos:upgrade
        vars: { NODE: luffy }
      - task: talos:upgrade
        vars: { NODE: zoro }
      - task: talos:upgrade
        vars: { NODE: nami }
      - task: talos:upgrade
        vars: { NODE: usopp }
      - task: talos:upgrade
        vars: { NODE: sanji }
      - task: talos:upgrade
        vars: { NODE: chopper }

  talos:upgrade-k8s:
    desc: Upgrade Kubernetes version
    vars:
      K8S_VERSION:
        sh: yq '.kubernetesVersion' {{.TALOS_DIR}}/talconfig.yaml
    prompt: "Upgrade Kubernetes to {{.K8S_VERSION}}?"
    cmds:
      - echo "Upgrading Kubernetes to {{.K8S_VERSION}}..."
      - talosctl upgrade-k8s --nodes {{.NODE_LUFFY}} --to {{.K8S_VERSION}}
      # talosctl upgrade-k8s re-applies its bootstrap manifests and reverts the
      # Flux-managed CoreDNS ConfigMap to the Talos default. Reconcile it back.
      - flux reconcile kustomization infrastructure-configs --with-source

  # =============================================================================
  # Talos - Status & Monitoring
  # =============================================================================
  talos:status:
    desc: Show Talos cluster status
    cmds:
      - echo "=== Talos Members ==="
      - talosctl get members --nodes {{.NODE_LUFFY}} 2>/dev/null || echo "Cannot reach cluster"
      - echo ""
      - echo "=== Kubernetes Nodes ==="
      - kubectl get nodes -o wide 2>/dev/null || echo "Cannot reach Kubernetes API"

  talos:health:
    desc: Check cluster health
    cmds:
      - talosctl health --nodes {{.NODES}}

  talos:dashboard:
    desc: Open interactive Talos dashboard
    cmds:
      - talosctl dashboard --nodes {{.NODES}}

  talos:wait-healthy:
    desc: Wait for a node to become healthy
    internal: true
    vars:
      NODE_IP: "{{.NODE_IP | default .NODE_LUFFY}}"
    cmds:
      - echo "Waiting for node {{.NODE_IP}} to be healthy..."
      - |
        until talosctl health --nodes {{.NODE_LUFFY}} \
          --control-plane-nodes {{.NODE_LUFFY}},{{.NODE_ZORO}},{{.NODE_NAMI}} \
          --worker-nodes {{.NODE_USOPP}},{{.NODE_SANJI}},{{.NODE_CHOPPER}} 2>/dev/null; do
          sleep 5
        done
      - echo "Node {{.NODE_IP}} is healthy"

  talos:wait-ready:
    desc: Wait for all nodes to be Ready in Kubernetes
    cmds:
      - echo "Waiting for all nodes to be Ready..."
      - kubectl wait --for=condition=ready node --all --timeout=300s
      - echo "All nodes are Ready"

  # =============================================================================
  # Bootstrap - Fresh Cluster Setup
  # =============================================================================
  bootstrap:helmfile:
    desc: Install Cilium CNI + Prometheus CRDs via helmfile (required before Flux)
    dir: bootstrap
    cmds:
      - echo "Updating Helm repositories..."
      - helm repo update
      - echo "Installing Cilium + Prometheus CRDs via helmfile..."
      - helmfile apply
      # Wait for the DaemonSet to exist rather than sleeping: helmfile returns before the
      # API server has the object, and a fixed sleep is either too short or wasted time.
      - kubectl -n kube-system wait --for=create daemonset/cilium --timeout=120s
      - kubectl -n kube-system rollout status daemonset/cilium --timeout=5m
      # Talos nodes only go Ready once the CNI is up, so this is the real gate.
      - kubectl wait --for=condition=ready node --all --timeout=300s
      - echo "Bootstrap complete - Cilium CNI + Prometheus CRDs installed"

  bootstrap:sops-secret:
    desc: Create SOPS Age secret for Flux
    cmds:
      - kubectl create namespace flux-system --dry-run=client -o yaml | kubectl apply -f -
      - |
        if kubectl -n flux-system get secret sops-age &>/dev/null; then
          echo "SOPS secret already exists"
          exit 0
        fi
        AGE_KEY=""
        if [ -f "$HOME/Library/Application Support/sops/age/keys.txt" ]; then
          AGE_KEY="$HOME/Library/Application Support/sops/age/keys.txt"
        elif [ -f "$HOME/.config/sops/age/keys.txt" ]; then
          AGE_KEY="$HOME/.config/sops/age/keys.txt"
        fi
        if [ -z "$AGE_KEY" ]; then
          echo "Age key not found. Create SOPS secret manually."
          exit 1
        fi
        echo "Creating SOPS Age secret..."
        cat "$AGE_KEY" | kubectl create secret generic sops-age --namespace=flux-system --from-file=age.agekey=/dev/stdin
        echo "SOPS secret created"

  bootstrap:deploy-key:
    desc: Install the Flux git deploy key from its encrypted copy
    cmds:
      - kubectl create namespace flux-system --dry-run=client -o yaml | kubectl apply -f -
      - sops --decrypt bootstrap/deploy-key.sops.yaml | kubectl apply -f -

  bootstrap:flux:
    desc: Install Flux and point it at this repo (after Cilium)
    preconditions:
      - sh: kubectl get nodes -o jsonpath='{.items[0].status.conditions[?(@.type=="Ready")].status}' 2>/dev/null | grep -q True
        msg: "Nodes are not Ready. Run 'task bootstrap:helmfile' first."
    cmds:
      - task: bootstrap:sops-secret
      - task: bootstrap:deploy-key
      # No `flux bootstrap github`: it needs a PAT with admin rights, writes to the repo
      # and creates the deploy key. Everything it would generate is already committed, so
      # a disaster recovery needs the Age key and nothing else.
      # --force-conflicts so a re-run is idempotent: on a cluster where Flux is already
      # installed the fields are owned by the "flux" field manager and a plain apply fails.
      - kubectl apply --server-side --force-conflicts -f kubernetes/flux/flux-system/gotk-components.yaml
      - kubectl wait --for=condition=established crd/kustomizations.kustomize.toolkit.fluxcd.io --timeout=120s
      - kubectl -n flux-system rollout status deploy/source-controller --timeout=5m
      - kubectl -n flux-system rollout status deploy/kustomize-controller --timeout=5m
      - kubectl apply --server-side --force-conflicts -f kubernetes/flux/flux-system/gotk-sync.yaml
      - echo "Flux installed. Watch with 'flux get kustomizations -w'"

  bootstrap:full:
    desc: Bootstrap on an already-running Kubernetes (Helmfile + Flux)
    cmds:
      - task: bootstrap:helmfile
      - task: bootstrap:flux
      - echo ""
      - echo "Cluster fully bootstrapped!"
      - echo "Watch progress with 'flux get kustomizations -w'"

  bootstrap:cluster:
    desc: Single entry point from bare Talos nodes to a reconciling cluster
    prompt: "Bootstrap the WHOLE cluster from bare Talos nodes? Only for a new or reset cluster."
    cmds:
      # clusterconfig/ is gitignored, so a recovery machine has to regenerate it first.
      - task: talos:genconfig
      - task: talos:apply-insecure-all
      - task: talos:bootstrap
      - task: talos:kubeconfig
      - task: bootstrap:full

  # =============================================================================
  # Flux
  # =============================================================================
  flux:reconcile:
    desc: Force Flux reconciliation
    cmds:
      - flux reconcile source git flux-system
      - flux reconcile kustomization flux-system --with-source
      - flux reconcile kustomization cluster-vars --with-source
      - flux reconcile kustomization infrastructure-controllers --with-source
      - flux reconcile kustomization infrastructure-configs --with-source
      - flux reconcile kustomization apps --with-source

  flux:status:
    desc: Show Flux status
    cmds:
      - flux get all -A

  flux:logs:
    desc: Show Flux controller logs
    cmds:
      - flux logs --all-namespaces --since=10m

  flux:hr:
    desc: List all HelmReleases
    cmds:
      - kubectl get helmreleases -A

  flux:suspend:
    desc: Suspend all Flux reconciliation
    prompt: "Suspend all Flux kustomizations?"
    cmds:
      - flux suspend kustomization --all -n flux-system

  flux:resume:
    desc: Resume all Flux reconciliation
    cmds:
      - flux resume kustomization --all -n flux-system

  # =============================================================================
  # SOPS
  # =============================================================================
  sops:encrypt:
    desc: Encrypt a secret file (e.g. task sops:encrypt FILE=kubernetes/apps/myapp/secret.sops.yaml)
    requires:
      vars: [FILE]
    cmds:
      - sops --encrypt --in-place {{.FILE}}

  sops:decrypt:
    desc: Decrypt a file for reading
    requires:
      vars: [FILE]
    cmds:
      - sops --decrypt {{.FILE}}

  sops:edit:
    desc: Edit an encrypted file
    requires:
      vars: [FILE]
    cmds:
      - sops {{.FILE}}

  sops:age-show:
    desc: Print an Age private key for backup (KEY=main|breakglass)
    silent: true
    vars:
      KEY: '{{.KEY | default "main"}}'
    cmds:
      - |
        case "{{.KEY}}" in
          main)       NAME="keys.txt" ;;
          breakglass) NAME="breakglass.txt" ;;
          *) echo "KEY must be main or breakglass" >&2; exit 1 ;;
        esac
        AGE_KEY=""
        if [ -f "$HOME/Library/Application Support/sops/age/$NAME" ]; then
          AGE_KEY="$HOME/Library/Application Support/sops/age/$NAME"
        elif [ -f "$HOME/.config/sops/age/$NAME" ]; then
          AGE_KEY="$HOME/.config/sops/age/$NAME"
        fi
        if [ -z "$AGE_KEY" ]; then
          echo "Age key '$NAME' not found under ~/.config/sops/age/" >&2
          exit 1
        fi
        # .sops.yaml carries two recipients now, so check membership rather than equality.
        ACTUAL=$(grep -oE 'age1[a-z0-9]+' "$AGE_KEY" | tail -1)
        if ! yq '.creation_rules[0].age' .sops.yaml | grep -q "$ACTUAL"; then
          echo "WARNING: $ACTUAL is not listed as a recipient in .sops.yaml" >&2
          echo "" >&2
        fi
        cat "$AGE_KEY"

  # =============================================================================
  # Kubernetes - Quick Commands
  # =============================================================================
  k:pods:
    desc: List all pods
    cmds:
      - kubectl get pods -A

  k:events:
    desc: Show recent cluster events
    cmds:
      - kubectl get events -A --sort-by='.lastTimestamp' | tail -30

  k:top:
    desc: Show resource usage
    cmds:
      - echo "=== Nodes ==="
      - kubectl top nodes
      - echo ""
      - echo "=== Top Pods by Memory ==="
      - kubectl top pods -A --sort-by=memory | head -15

  k:errors:
    desc: Show pods with errors
    cmds:
      - kubectl get pods -A | grep -v Running | grep -v Completed

  k:prune-pods:
    desc: Delete terminated pods left behind by hard node reboots
    silent: true
    cmds:
      - |
        # Job-owned pods are skipped: a completed Job pod is history, not a tombstone.
        TARGETS=$(for PHASE in Succeeded Failed; do
          kubectl get pods -A --field-selector=status.phase==$PHASE -o json \
            | jq -r '.items[]
                     | select((.metadata.ownerReferences[0].kind // "") != "Job")
                     | "\(.metadata.namespace) \(.metadata.name)"'
        done)
        if [ -z "$TARGETS" ]; then
          echo "No terminated pods to prune"
          exit 0
        fi
        echo "$TARGETS" | awk '{print "  " $1 "/" $2}'
        echo "Pruning $(echo "$TARGETS" | wc -l) pod(s)..."
        echo "$TARGETS" | awk '{print $1}' | sort -u | while read -r NS; do
          PODS=$(echo "$TARGETS" | awk -v ns="$NS" '$1 == ns { printf "%s ", $2 }')
          kubectl -n "$NS" delete pod $PODS --wait=false
        done

  # =============================================================================
  # Dependencies
  # =============================================================================
  deps:check:
    desc: Check if required tools are installed
    cmds:
      - |
        echo "Checking dependencies..."
        MISSING=""
        command -v talosctl >/dev/null || MISSING="$MISSING talosctl"
        command -v talhelper >/dev/null || MISSING="$MISSING talhelper"
        command -v kubectl >/dev/null || MISSING="$MISSING kubectl"
        command -v flux >/dev/null || MISSING="$MISSING flux"
        command -v helm >/dev/null || MISSING="$MISSING helm"
        command -v helmfile >/dev/null || MISSING="$MISSING helmfile"
        command -v sops >/dev/null || MISSING="$MISSING sops"
        command -v yq >/dev/null || MISSING="$MISSING yq"
        command -v jq >/dev/null || MISSING="$MISSING jq"
        command -v kubeconform >/dev/null || MISSING="$MISSING kubeconform"
        command -v lefthook >/dev/null || MISSING="$MISSING lefthook"
        if [ -n "$MISSING" ]; then
          echo "Missing:$MISSING"
          echo "Run 'task deps:install'"
          exit 1
        fi
        echo "All dependencies installed"

  deps:install:
    desc: Install all dependencies via mise (reads .mise.toml)
    preconditions:
      - sh: command -v mise
        msg: "mise is not installed. See https://mise.jdx.dev/getting-started.html"
    cmds:
      - mise install
      - task: hooks:install
      - echo "All dependencies installed at the versions pinned in .mise.toml"

  hooks:install:
    desc: Install the git hooks defined in lefthook.yml
    preconditions:
      - sh: command -v lefthook
        msg: "lefthook not found. Run 'task deps:install'."
    cmds:
      - lefthook install

  # =============================================================================
  # CNPG - CloudNativePG
  # =============================================================================
  cnpg:status:
    desc: Show CNPG clusters status
    cmds:
      - echo "=== CNPG Clusters ==="
      - kubectl get clusters.postgresql.cnpg.io -A
      - echo "=== Recent CNPG Backups ==="
      - kubectl get backups.postgresql.cnpg.io -A --sort-by='.metadata.creationTimestamp' | tail -10

  # =============================================================================
  # Disaster Recovery - Longhorn Restore
  # =============================================================================
  dr:list-backups:
    desc: List available Longhorn backups from NAS
    cmds:
      - |
        echo "=== Longhorn Backups from NAS ==="
        kubectl get backups.longhorn.io -n longhorn-system -o json | \
          jq -r '.items[]
                 | select(.status.state == "Completed")
                 | (.status.labels.KubernetesStatus | fromjson) as $k
                 | "\($k.namespace)/\($k.pvcName) | \(.status.volumeSize | tonumber / 1073741824 | floor)GB | \(.status.backupCreatedAt) | \(.metadata.name)"' | \
          sort | uniq | column -t -s'|'
        echo ""
        echo "To restore a specific PVC, use:"
        echo "  task dr:restore PVC=<namespace>/<pvc-name>"

  dr:restore:
    desc: Restore a PVC from Longhorn backup (e.g. task dr:restore PVC=authentik/data-authentik-postgres-1)
    requires:
      vars: [PVC]
    vars:
      NAMESPACE: '{{index (splitList "/" .PVC) 0}}'
      PVC_NAME: '{{index (splitList "/" .PVC) 1}}'
    prompt: "Restore {{.PVC}} from backup? This will create a new volume from the latest backup."
    cmds:
      - echo "=== Restoring {{.PVC}} ==="
      - echo "1. Finding latest backup for {{.PVC}}..."
      - |
        # Find the backup URL for this PVC
        BACKUP_URL=$(kubectl get backups.longhorn.io -n longhorn-system -o json | jq -r --arg ns "{{.NAMESPACE}}" --arg pvc "{{.PVC_NAME}}" '
          .items[] |
          select(.status.state == "Completed") |
          select((.status.labels.KubernetesStatus | fromjson | .namespace) == $ns) |
          select((.status.labels.KubernetesStatus | fromjson | .pvcName) == $pvc) |
          .status.url
        ' | tail -1)

        if [ -z "$BACKUP_URL" ]; then
          echo "❌ No backup found for {{.PVC}}"
          exit 1
        fi

        echo "   Found backup: $BACKUP_URL"

        # Extract volume size
        VOLUME_SIZE=$(kubectl get backups.longhorn.io -n longhorn-system -o json | jq -r --arg ns "{{.NAMESPACE}}" --arg pvc "{{.PVC_NAME}}" '
          .items[] |
          select(.status.state == "Completed") |
          select((.status.labels.KubernetesStatus | fromjson | .namespace) == $ns) |
          select((.status.labels.KubernetesStatus | fromjson | .pvcName) == $pvc) |
          .status.volumeSize
        ' | tail -1)

        SIZE_GI=$((VOLUME_SIZE / 1073741824))
        echo "   Volume size: ${SIZE_GI}Gi"
        echo ""

        # Generate volume name
        VOLUME_NAME="restored-{{.PVC_NAME}}-$(date +%s)"

        echo "2. Creating Longhorn volume from backup..."
        kubectl apply -f - <<EOF
        apiVersion: longhorn.io/v1beta2
        kind: Volume
        metadata:
          name: $VOLUME_NAME
          namespace: longhorn-system
        spec:
          numberOfReplicas: 3
          dataEngine: v1
          frontend: blockdev
          fromBackup: "$BACKUP_URL"
          size: "$VOLUME_SIZE"
        EOF

        echo "   ✅ Volume $VOLUME_NAME created"
        echo ""

        echo "3. Waiting for volume to be ready..."
        until kubectl get volumes.longhorn.io -n longhorn-system $VOLUME_NAME -o jsonpath='{.status.state}' 2>/dev/null | grep -q "detached"; do
          STATE=$(kubectl get volumes.longhorn.io -n longhorn-system $VOLUME_NAME -o jsonpath='{.status.state}' 2>/dev/null || echo "creating")
          echo "   State: $STATE"
          sleep 5
        done
        echo "   ✅ Volume ready"
        echo ""

        echo "4. Creating PV..."
        kubectl apply -f - <<EOF
        apiVersion: v1
        kind: PersistentVolume
        metadata:
          name: $VOLUME_NAME
        spec:
          capacity:
            storage: ${SIZE_GI}Gi
          volumeMode: Filesystem
          accessModes:
            - ReadWriteOnce
          persistentVolumeReclaimPolicy: Retain
          storageClassName: longhorn
          csi:
            driver: driver.longhorn.io
            volumeHandle: $VOLUME_NAME
            fsType: ext4
        EOF
        echo "   ✅ PV created"
        echo ""

        echo "5. Creating PVC..."
        kubectl create namespace {{.NAMESPACE}} --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply -f - <<EOF
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: {{.PVC_NAME}}
          namespace: {{.NAMESPACE}}
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: longhorn
          volumeName: $VOLUME_NAME
          resources:
            requests:
              storage: ${SIZE_GI}Gi
        EOF
        echo "   ✅ PVC created"
        echo ""

        echo "=== Restore complete! ==="
        echo ""
        echo "Volume: $VOLUME_NAME"
        echo "PVC: {{.NAMESPACE}}/{{.PVC_NAME}}"
        echo ""
        echo "The workload using this PVC will automatically attach to the restored data."

  dr:restore-all:
    desc: List all PVCs that can be restored (run after hard reset)
    cmds:
      - |
        echo "=== Available PVC Restorations ==="
        echo "Run these commands to restore your data:"
        echo ""
        kubectl get backups.longhorn.io -n longhorn-system -o json 2>/dev/null | \
          jq -r '.items[] | select(.status.state == "Completed") | (.status.labels.KubernetesStatus | fromjson) as $k | "task dr:restore PVC=\($k.namespace)/\($k.pvcName)"' | \
          sort | uniq || echo "No backups found - is Longhorn running and connected to NAS?"
        echo ""
        echo "Note: Restore PVCs BEFORE Flux creates the workloads, or suspend Flux first."

  # =============================================================================
  # Cleanup
  # =============================================================================
  clean:
    desc: Clean generated Talos config files
    prompt: "Delete generated config files?"
    cmds:
      - rm -f {{.TALOS_DIR}}/clusterconfig/{{.CLUSTER_NAME}}-*.yaml
      - rm -f {{.TALOS_DIR}}/clusterconfig/talosconfig
      - echo "Generated files removed"
